pist_5:"Context: passa en mil·lisegons, milers de vegades per classe|Etapa 1: motoneurona i axó|Etapa 2: unió neuromuscular en 4 passos (acetilcolina)|Etapa 3: el calci com a senyal interior (túbuls T, troponina)|Etapa 4: cicle de la miosina amb ATP|Reflexió: la màquina invisible darrere del gest|Unitat motora: precisió (mà) vs força (quàdriceps)",

tip_metafora_b:"Escena inicial||Mira un ballarí: què veus (estructura) i què no veus (funció).|Definició||Anatomia vs fisiologia: la pregunta «què és?» davant «com funciona?».|Exemples||El bíceps, el cor (5 L/min), l'equilibri en una pirueta.|La metàfora||Desenvolupa escenari i coreografia: què passa si en falta una?|Conclusió||Per què un intèrpret necessita les dues mirades.",
tip_argumentativa_b:"Introducció||Presenta l'opinió que vols desmuntar.|Argument 1||Optimització tècnica: entendre les capacitats per millorar.|Argument 2||Prevenció de lesions i recuperació (resiliència).|Argument 3||Saber parlar amb fisios i metges: comunicació professional.|Contraargument i rèplica||«Aprenent ballant n'hi ha prou» → els estancaments i les lesions diuen el contrari.|Conclusió||Valoració personal.",
tip_explicativa_b:"Introducció||El cos com a sistema que es defensa del canvi.|El fenomen||El medi intern: líquid extracel·lular i valors de referència (pH, glucosa, temperatura, pressió).|La causa||Què desestabilitza el medi intern quan balles.|El mecanisme||Retroalimentació negativa: sensor → centre d'integració → efector (suor, vasodilatació).|El contrast||Retroalimentació positiva: quan el cos amplifica (part, coagulació).|Conclusió||Implicacions pràctiques: escalfament, hidratació, tornada a la calma.",
tip_analogia_b:"Introducció||Cap obra es sosté només amb el gran gest: tot comença al detall.|L'analogia||Presenta la teva analogia i les seves correspondències.|Desenvolupament||Recorre els nivells o components un per un dins de l'analogia.|Correspondències||Fes explícit què correspon a què entre analogia i cos.|Conclusió||Què ens ensenya l'analogia sobre el cos que balla.",
tip_proces_b:"Introducció||Context temporal: passa en mil·lisegons, milers de vegades per classe.|Etapa 1||La motoneurona espinal i l'axó cap al múscul.|Etapa 2||La unió neuromuscular en 4 passos (arribada del potencial, acetilcolina, receptors, potencial muscular).|Etapa 3||El calci com a senyal interior: túbuls T i troponina.|Etapa 4||El cicle de la miosina i l'ATP: unió, arrossegament, acurtament, desprendiment.|Conclusió||Reflexió sobre la màquina invisible darrere de cada gest.",
tip_comparativa_b:"Introducció||Un sol gest, tres mecanismes musculars.|Els elements||Defineix les tres contraccions amb tensió vs resistència.|Comparació||Analitza el gest fase a fase (o per blocs): el protagonista de cada fase.|Matisos||Depèn del múscul analitzat i de la fase; l'excèntrica com a frenada i fatiga.|Conclusió||Implicacions d'entrenament i prevenció (aterratges, demi-plié).",
tip_reflexiva_b:"Introducció||El mite a desmuntar o l'escena inicial (pirueta amb ulls tancats).|Explicació||El fonament científic: cicle ossi o els tres receptors.|Desenvolupament||Adaptació i risc (os) o integració i ajustos (propiocepció).|Reflexió personal||Primera persona: què canviarà en la teva manera de treballar.|Conclusió||Per al teu futur com a intèrpret.",
tip_mixta_b:"Escena narrativa||Una rampa a mig assaig. Breu: com a màxim 1 paràgraf.|Explicació||Què és fisiològicament una rampa: hiperexcitabilitat de la motoneurona alfa.|Factors||Per què els ballarins hi estan exposats: calor, hores, hidratació, electròlits.|Argumentació||La fatiga com a senyal: escoltar el cos és competència professional.|Conclusió||Prevenció i recuperació: el repòs restaura el medi intern."

tip_metafora_b:"Escena inicial||Mira a un bailarín: qué ves (estructura) y qué no ves (función).|Definición||Anatomía vs fisiología: la pregunta «qué es» frente a «cómo funciona».|Ejemplos||El bíceps, el corazón (5 L/min), el equilibrio en una pirueta.|La metáfora||Desarrolla escenario y coreografía: ¿qué pasa si falta una?|Conclusión||Por qué un intérprete necesita las dos miradas.",

tip_explicativa_b:"Introducción||El cuerpo como sistema que se defiende del cambio.|El fenómeno||El medio interno: líquido extracelular y valores de referencia (pH, glucosa, temperatura, presión).|La causa||Qué desestabiliza el medio interno cuando bailas.|El mecanismo||Retroalimentación negativa: sensor → centro de integración → efector (sudor, vasodilatación).|El contraste||Retroalimentación positiva: cuando el cuerpo amplifica (parto, coagulación).|Conclusión||Implicaciones prácticas: calentamiento, hidratación, vuelta a la calma.",
tip_analogia_b:"Introducción||Ninguna obra se sostiene solo con el gran gesto: todo empieza en el detalle.|La analogía||Presenta tu analogía y sus correspondencias.|Desarrollo||Recorre los niveles o componentes uno a uno dentro de la analogía.|Correspondencias||Haz explícito qué corresponde a qué entre analogía y cuerpo.|Conclusión||Qué nos enseña la analogía sobre el cuerpo que baila.",
tip_proces_b:"Introducción||Contexto temporal: pasa en milisegundos, miles de veces por clase.|Etapa 1||La motoneurona espinal y el axón hacia el músculo.|Etapa 2||La unión neuromuscular en 4 pasos (llegada del potencial, acetilcolina, receptores, potencial muscular).|Etapa 3||El calcio como señal interior: túbulos T y troponina.|Etapa 4||El ciclo de la miosina y el ATP: unión, arrastre, acortamiento, desprendimiento.|Conclusión||Reflexión sobre la máquina invisible tras cada gesto.",
tip_comparativa_b:"Introducción||Un solo gesto, tres mecanismos musculares.|Los elementos||Define las tres contracciones con tensión vs resistencia.|Comparación||Analiza el gesto fase a fase (o por bloques): el protagonista de cada fase.|Matices||Depende del músculo analizado y de la fase; la excéntrica como frenada y fatiga.|Conclusión||Implicaciones de entrenamiento y prevención (aterrizajes, demi-plié).",
tip_reflexiva_b:"Introducción||El mito a desmontar o la escena inicial (pirueta con ojos cerrados).|Explicación||El fundamento científico: ciclo óseo o los tres receptores.|Desarrollo||Adaptación y riesgo (hueso) o integración y ajustes (propiocepción).|Reflexión personal||Primera persona: qué cambiará en tu manera de trabajar.|Conclusión||Para tu futuro como intérprete.",

 const det=document.querySelector("#esquema details.detalls");
 if(det){
  det.style.display=CFG.pistes?"block":"none";
  $("pistes-summary").textContent=i.pistas;
  $("llista-pistes").innerHTML=(i["pist_"+t]||"").split("|")
   .map(function(p){return "<li>"+p+"</li>"}).join("");
 }
}
function renderEsquema(){
 $("txt-esquema").value=getString("esquema");
 compt("txt-esquema","pc-esquema");
}
function renderPlantilla(){
 const i=T(), bs=blocos();
 $("pl-resum").innerHTML='<b>'+i.r_tip+'</b> '+i["tip_"+tip()+"_n"]+
  ' &nbsp;·&nbsp; <b>'+i.r_tem+'</b> '+tema()+' · '+i["t_"+tema()];
 $("txt-titol").value=getString("titol");
 let h="";
 bs.forEach(function(b,idx){
  h+='<div class="bloc-plant"><h3>'+(idx+1)+'. '+b.t+'</h3>'+
     '<div class="ajuda">'+b.a+'</div>'+
     '<textarea id="bloc-'+idx+'" rows="4"></textarea>'+
     '<span class="pc" id="pc-bloc-'+idx+'"></span></div>';
 });
 $("blocs").innerHTML=h;
 bs.forEach(function(b,idx){
  const el=$("bloc-"+idx);
  el.value=getString("b"+idx);
  el.addEventListener("input",function(){
    setText("b"+idx,el.value);
    compt("bloc-"+idx,"pc-bloc-"+idx);
    compteTotal(); marca("ms-plantilla"); progr();
  });
  compt("bloc-"+idx,"pc-bloc-"+idx);
 });
 $("pl-connectors").innerHTML="<b>"+i.connectors+"</b> "+i["tip_"+tip()+"_c"];
 compteTotal();
}
function compteTotal(){
 let n=0;
 blocos().forEach(function(b,idx){const el=$("bloc-"+idx); if(el) n+=paraules(el.value);});
 $("pl-total").textContent=T().pl_total.replace("{n}",n);
 return n;
}
function totalParaules(){
 let n=0;
 blocos().forEach(function(b,idx){n+=paraules(getString("b"+idx));});
 return n;
}
function renderVocab(){
 const i=T(), terms=vocabItems(), arr=getBoolArr("vocab",terms.length);
 let h="";
 terms.forEach(function(t,idx){
  h+='<div class="vocab-item'+(arr[idx]?" usat":"")+'">'+
     '<input type="checkbox" '+(arr[idx]?"checked":"")+
     ' onchange="toggleVocab('+idx+')"><span>'+t+'</span></div>';
 });
 $("llista-vocab").innerHTML=h;
 $("txt-altres").value=getString("altres");
 const u=arr.filter(Boolean).length;
 $("voc-compte").textContent=i.voc_compte.replace("{u}",u).replace("{t}",terms.length);
}
function toggleVocab(idx){
 const terms=vocabItems(), arr=getBoolArr("vocab",terms.length);
 arr[idx]=!arr[idx]; setText("vocab",JSON.stringify(arr));
 renderVocab(); progr();
}
function detectaVocab(){
 const terms=vocabItems();
 let tot=getString("esquema").toLowerCase()+" "+getString("titol").toLowerCase();
 blocos().forEach(function(b,idx){tot+=" "+getString("b"+idx).toLowerCase();});
 const arr=terms.map(function(t){return tot.indexOf(t.toLowerCase())>-1;});
 setText("vocab",JSON.stringify(arr));
 renderVocab(); progr();
}
function renderChecks(){
 const items=checkItems(), arr=getBoolArr("checks",items.length);
 let h="";
 items.forEach(function(c,idx){
  h+='<div class="check"><input type="checkbox" '+(arr[idx]?"checked":"")+
     ' onchange="toggleCheck('+idx+')"><span>'+c+'</span></div>';
 });
 $("llista-checks").innerHTML=h;
 const u=arr.filter(Boolean).length;
 $("ck-compte").textContent=T().ck_compte.replace("{c}",u).replace("{t}",items.length);
}
function toggleCheck(idx){
 const items=checkItems(), arr=getBoolArr("checks",items.length);
 arr[idx]=!arr[idx]; setText("checks",JSON.stringify(arr));
 renderChecks(); progr();
}
function renderEines(){
 CAMPSE.forEach(function(c){const el=$("eines-"+c); if(el) el.value=getString("eines_"+c);});
}
function einesPlens(){
 let n=0; CAMPSE.forEach(function(c){if(getString("eines_"+c).trim()) n++;}); return n;
}
function renderFormat(){
 const i=T(), f=CFG.format||"redaccio";
 $("fitxa-format").innerHTML="<b>"+i["fk_"+f]+"</b><br>"+i["fkx_"+f];
}
function renderEntrega(){
 const i=T();
 const items=checkItems(), arr=getBoolArr("checks",items.length);
 const terms=vocabItems(), va=getBoolArr("vocab",terms.length);
 $("en-resum").innerHTML=
  "<b>"+i.en_resum_t+"</b><br>"+
  i.r_tem+" "+tema()+" · "+i["t_"+tema()]+"<br>"+
  i.r_tip+" "+i["tip_"+tip()+"_n"]+"<br>"+
  i.r_tit+" "+(getString("titol")||"—")+"<br>"+
  i.r_par+" "+totalParaules()+"<br>"+
  i.r_voc+" "+va.filter(Boolean).length+" / "+terms.length+"<br>"+
  i.r_ck+" "+arr.filter(Boolean).length+" / "+items.length+"<br>"+
  i.r_eines+" "+einesPlens()+" / "+CAMPSE.length+"<br>"+
  i.r_for+" "+i["fk_"+(CFG.format||"redaccio")];
}
function progr(){
 const items=checkItems(), arr=getBoolArr("checks",items.length);
 const terms=vocabItems(), va=getBoolArr("vocab",terms.length);
 const bs=blocos(); let plens=0;
 bs.forEach(function(b,idx){if(getString("b"+idx).trim()) plens++;});
 const parts=[
  getString("esquema").trim()?1:0,
  getString("titol").trim()?1:0,
  bs.length? plens/bs.length:0,
  terms.length? va.filter(Boolean).length/terms.length:0,
  items.length? arr.filter(Boolean).length/items.length:0,
  CFG.format?1:0,
  CAMPSE.length? einesPlens()/CAMPSE.length:0
 ];
 const pct=Math.round(100*parts.reduce(function(a,b){return a+b;},0)/parts.length);
 $("prog-fill").style.width=pct+"%";
 $("prog-txt-inici").textContent="Progress: "+pct+"%";
}
function refrescaTot(){
 renderSelects(); renderFitxaTema(); renderEsquema(); renderPlantilla();
 renderVocab(); renderChecks(); renderEines(); renderFormat(); renderEntrega(); progr();
 $("cfg-nom").value=CFG.nom||"";
 $("cfg-pistes").checked=!!CFG.pistes;
}
function aplicaIdioma(){
 const i=T();
 document.querySelectorAll("[data-i18n]").forEach(function(el){
  const kk=el.dataset.i18n; if(i[kk]) el.textContent=i[kk]; });
 document.documentElement.lang=LANG;
 ["ca","es","en"].forEach(function(l){
  const b=$("btn-"+l); if(b) b.classList.toggle("actiu",l===LANG); });
 refrescaTot();
}

/* ===== accions ===== */
function guardaNom(){
 CFG.nom=$("cfg-nom").value.trim(); sSet("taller_cfg",JSON.stringify(CFG));
 marca("ms-nom");
}
function descarregaTxt(){
 const i=T(), bs=blocos();
 const items=checkItems(), arr=getBoolArr("checks",items.length);
 const terms=vocabItems(), va=getBoolArr("vocab",terms.length);
 let x="=== "+i.titol+" ===\n\n";
 x+="* "+i.r_tem+" "+tema()+" · "+i["t_"+tema()]+"\n";
 x+="* "+i.r_tip+" "+i["tip_"+tip()+"_n"]+"\n";
 x+="* "+i.r_tit+" "+(getString("titol")||"—")+"\n";
 x+="* "+i.r_for+" "+i["fk_"+(CFG.format||"redaccio")]+"\n";
 x+="* "+i.r_par+" "+totalParaules()+"\n\n";
 x+="=== "+i.esq_t.toUpperCase()+" ===\n"+(getString("esquema")||"—")+"\n\n";
 x+="=== "+i.pl_t.toUpperCase()+" ===\n";
 bs.forEach(function(b,idx){
  x+="\n["+b.t+"]\n"+(getString("b"+idx)||"—")+"\n"; });
 x+="\n=== "+i.voc_t.toUpperCase()+" ("+va.filter(Boolean).length+"/"+terms.length+") ===\n";
 x+=terms.map(function(t,idx){return (va[idx]?"[x] ":"[ ] ")+t;}).join("\n");
 if(getString("altres")) x+="\n"+i.voc_altres+" "+getString("altres");
 x+="\n\n=== "+i.ck_t.toUpperCase()+" ("+arr.filter(Boolean).length+"/"+items.length+") ===\n";
 x+=items.map(function(c,idx){return (arr[idx]?"[x] ":"[ ] ")+c;}).join("\n");
 x+="\n\n=== "+i.ei_t.toUpperCase()+" ===\n";
 x+="* "+i.ei_prog+" "+(getString("eines_prog")||"—")+"\n";
 x+="* "+i.ei_ia+" "+(getString("eines_ia")||"—")+"\n";
 x+="* "+i.ei_ajut+" "+(getString("eines_ajut")||"—")+"\n";
 x+="* "+i.ei_altres+" "+(getString("eines_altres")||"—")+"\n";
 const nom="Tema"+("0"+tema()).slice(-2)+"_"+
   (CFG.nom||"Alumne").replace(/[\\\/:*?"<>|]/g,"").replace(/\s+/g,"_")+"_Redaccio.txt";
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([x],{type:"text/plain;charset=utf-8"}));
 a.download=nom;
 document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ===== escoltadors (registrats UN cop) ===== */
 $("sel-tema").addEventListener("change",function(){
 CFG.tema=parseInt(this.value,10)||1; sSet("taller_cfg",JSON.stringify(CFG)); refrescaTot(); });
 $("sel-format").addEventListener("change",function(){
 CFG.format=this.value; sSet("taller_cfg",JSON.stringify(CFG));
 renderFormat(); renderEntrega(); progr(); });
 $("cfg-pistes").addEventListener("change",function(){
 CFG.pistes=this.checked; sSet("taller_cfg",JSON.stringify(CFG)); renderFitxaTema(); });
 $("txt-esquema").addEventListener("input",function(){
 setText("esquema",this.value); compt("txt-esquema","pc-esquema");
 marca("ms-esquema"); progr(); });
 $("txt-titol").addEventListener("input",function(){
 setText("titol",this.value); marca("ms-titol"); progr(); });
 $("txt-altres").addEventListener("input",function(){
 setText("altres",this.value); marca("ms-altres"); });
CAMPSE.forEach(function(c){
 const el=$("eines-"+c);
 el.addEventListener("input",function(){
   setText("eines_"+c,el.value); marca("ms-eines"); progr(); });
});

/* ===== inici ===== */
try{
 mostra("inici"); aplicaIdioma();
}catch(e){
 const b=$("js-error");
 if(b){ b.style.display="block"; b.textContent="Error: "+e.message; }
}
</script>
</body>
