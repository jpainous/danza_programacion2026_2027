{id:"presentacio",t:"3. Subject presentation",h:`
<h3>3.1 General description</h3>
<p><b>Physiology Applied to Dance</b> is a core training subject within the Degree in Dance that provides students with the scientific tools needed to understand how the human body works in action. It deliberately avoids a rote-learning approach to anatomical systems, placing learning in real professional contexts: rehearsing better, preventing injuries, performing on stage and teaching safely.</p>
<p>The whole subject is structured around a <b>real, ongoing professional situation</b> (the core project), which simulates an intense professional week (tour, creation residency or run of shows). This thread acts as the guiding principle and ensures physiological knowledge is built <i>because it is needed</i> to solve the professional challenge posed.</p>
<h3>3.2 Contribution to the graduate profile</h3>
<p>Dance is a highly demanding artistic discipline requiring its performers and educators to have deep knowledge of the body. The subject responds to the need to train professionals who:</p>
<ul>
<li><b>Understand</b> the physiological mechanisms regulating exertion, recovery and injury.</li>
<li><b>Prevent</b> risks arising from intense workloads, tours or inadequate practices.</li>
<li><b>Optimise</b> artistic performance based on scientific evidence.</li>
<li><b>Communicate</b> body knowledge with rigour to companies, students and families.</li>
<li><b>Act</b> ethically, especially regarding body image and the prevention of eating disorders (EDs).</li>
</ul>
<p>The subject therefore contributes to <b>transversal competences</b> (scientific communication, cooperative work, learning autonomy) and to the <b>specific competences</b> of body care, prevention and performance in the study plan.</p>
<h3>3.3 Competence-based and methodological approach</h3>
<p>The approach is <b>competence-based, active and contextualised</b>. Knowledge is not transmitted in isolation but built through:</p>
<ul>
<li><b>First-person experimentation</b> (body workshops, recording of one's own physiological data).</li>
<li><b>Analysis of real professional situations</b> (case studies, design of proposals).</li>
<li><b>Scientific communication adapted</b> to different audiences (oral presentations).</li>
<li><b>Ethical reflection</b> on body image, EDs and professional responsibility.</li>
</ul>
<h3>3.4 Relationship with other subjects in the study plan</h3>
<p>The subject is part of a network of subjects in the Degree in Dance that share the goal of training well-rounded, rigorous professionals:</p>
<ul>
<li><b>Dance technique subjects:</b> where the biomechanics and physical conditioning principles of this subject are applied.</li>
<li><b>Functional Anatomy / Kinesiology:</b> shares foundations and is coordinated to avoid duplication.</li>
<li><b>Dance Pedagogy:</b> where knowledge on prevention, warm-up and scientific communication is transferred.</li>
<li><b>Health and well-being subjects:</b> ED prevention and holistic dancer care are addressed transversally.</li>
</ul>
<h3>3.5 Subject objectives</h3>
<p>By the end of the course, students will have achieved the <b>8 Learning Outcomes (LOs)</b> described in section 4, ranging from understanding basic physiological mechanisms to the ability to design safe proposals, communicate with rigour and act with professional ethics.</p>`},

{id:"avaluacio",t:"4. Assessment criteria and instruments",h:`
<p>Assessment rests on a <b>competence-based, continuous approach</b>, where physiological knowledge is assessed in real professional contexts. Formative assessment (during the process) is combined with summative assessment (at the end).</p>
<h3>4.1 Assessment instruments and weighting</h3>
<table>
<thead><tr><th>Instrument</th><th>Description</th><th>Weighting</th><th>Linked LOs</th></tr></thead>
<tbody>
<tr><td><b>Written theory-practice test</b></td><td>Test-type exam and short questions on physiological mechanisms and body systems applied to dance. Includes practical cases on injury prevention and performance optimisation.</td><td><b>30 %</b></td><td>LO1, LO2, LO3, LO5</td></tr>
<tr><td><b>Professional-week monitoring dossier</b></td><td>Document in which students record and analyse their own physiological data (HR, hydration, sleep, recovery) during a real week of professional workload (intensive rehearsals, shows, tour). Includes a physical conditioning and nutrition proposal.</td><td><b>35 %</b></td><td>LO4, LO5, LO6</td></tr>
<tr><td><b>Oral scientific communication presentation</b></td><td>Group presentation (2-3 people) communicating a physiological concept adapted to a specific audience (dance company, school students, families). Scientific rigour and didactic adaptation are assessed.</td><td><b>20 %</b></td><td>LO7, LO3</td></tr>
<tr><td><b>Participation and cooperative work</b></td><td>Continuous assessment of class participation, teamwork, solving practical cases, and health-care attitudes and professional ethics. Includes self- and peer-assessment.</td><td><b>15 %</b></td><td>LO8, LO6, TC1, TC2</td></tr>
</tbody></table>
<h3>4.2 Assessment criteria per Learning Outcome</h3>
<p><b>LO1 · Homeostasis and bodily regulation mechanisms</b></p>
<ul><li>Accurately explains thermal, fluid and energy regulation processes during dance activity.</li><li>Relates physiological mechanisms to real rehearsal and performance situations.</li></ul>
<p><b>LO2 · Structure and function of body systems</b></p>
<ul><li>Correctly describes the anatomy and physiology of the musculoskeletal, nervous, endocrine, cardiovascular and respiratory systems.</li><li>Identifies interrelations between systems during physical exertion.</li></ul>
<p><b>LO3 · Technical analysis and injury risk factors</b></p>
<ul><li>Analyses dance technical movements from a biomechanical perspective and identifies risk patterns.</li><li>Proposes preventive technical adjustments based on physiological evidence.</li></ul>
<p><b>LO4 · Interpretation of physiological data and self-regulation</b></p>
<ul><li>Correctly collects and interprets own HR, recovery and hydration data.</li><li>Makes data-based decisions on self-regulation of workload.</li></ul>
<p><b>LO5 · Application of nutrition, sleep and recovery</b></p>
<ul><li>Designs an eating, hydration and rest plan coherent with a real professional week.</li><li>Justifies decisions with physiological grounds.</li></ul>
<p><b>LO6 · Design of warm-up and conditioning proposals</b></p>
<ul><li>Creates safe, justified warm-up, cool-down and physical conditioning sequences.</li><li>Adapts proposals to different professional contexts (rehearsal, show, class).</li></ul>
<p><b>LO7 · Adapted scientific communication</b></p>
<ul><li>Communicates physiological concepts with rigour and clarity.</li><li>Adapts language and examples to the target audience (dancers, students, families).</li></ul>
<p><b>LO8 · Care attitudes and professional ethics</b></p>
<ul><li>Demonstrates sensitivity towards body image and ED prevention.</li><li>Shows responsibility in self-care and in conveying healthy messages.</li></ul>
<h3>4.3 Requirements to pass the subject</h3>
<ul>
<li><b>Minimum attendance of 80 %</b> at on-site sessions.</li>
<li><b>Submission of all assessable activities</b> (dossier, presentation, tests).</li>
<li><b>Minimum overall grade of 5/10</b> for the subject.</li>
<li><b>Minimum grade of 4/10</b> in the written theory-practice test (to guarantee achievement of basic content).</li>
</ul>
<h3>4.4 Resit assessment</h3>
<p>Students who do not pass the subject may take a <b>resit</b> that will include:</p>
<ul>
<li>Written theory-practice test (replaces 30 % of the final grade).</li>
<li>Possibility of improving the monitoring dossier (replaces 35 % of the final grade).</li>
<li>The oral presentation and continuous participation <b>cannot be recovered</b>.</li>
</ul>
<h3>4.5 Formative assessment (unweighted)</h3>
<p>Throughout the course, formative activities will be carried out that are ungraded but compulsory:</p>
<ul>
<li><b>Quick questionnaires</b> for self-assessment at the end of each thematic block.</li>
<li><b>Individual tutorials</b> to review the monitoring dossier.</li>
<li><b>Group debates and case studies</b> on injury prevention and professional ethics.</li>
</ul>`},

{id:"blocs",t:"5. Thematic contents",h:`
<p>Contents are organised into <b>5 thematic blocks</b> following a logical progression: from basic physiological foundations to advanced professional application. All learning is structured around the <b>core project</b> (ongoing real professional situation), which acts as the guiding thread and application context.</p>

<h3>Block 1 · Fundamentals of physiology applied to dance <small>(3 weeks)</small></h3>
<p><b>Conceptual:</b></p>
<ul><li>Concept of homeostasis and bodily regulation in physical activity.</li><li>Regulation systems: nervous, endocrine and cardiovascular.</li><li>Energy metabolism: aerobic and anaerobic pathways applied to dance.</li><li>Thermoregulation and hydration during exertion.</li></ul>
<p><b>Procedural:</b></p>
<ul><li>Measuring and recording heart rate (HR) at rest and during exertion.</li><li>Interpreting the immediate physiological response to exercise.</li><li>Analysing the energy demand of different dance styles.</li></ul>
<p><b>Attitudinal:</b></p>
<ul><li>Valuing the importance of knowing one's own body to optimise performance.</li><li>Awareness of individual differences in physiological response.</li></ul>
<p><b>Linked LOs:</b> LO1, LO2</p>

<h3>Block 2 · Functional anatomy and biomechanics of dance movement <small>(4 weeks)</small></h3>
<p><b>Conceptual:</b></p>
<ul><li>Musculoskeletal system: structure and function.</li><li>Biomechanics principles applied to dance: forces, levers, balance.</li><li>Functional analysis of the main muscle groups in technical movements (jumps, turns, extensions).</li><li>Injury risk factors: overload, poor technique, muscular imbalances.</li></ul>
<p><b>Procedural:</b></p>
<ul><li>Biomechanical analysis of specific technical movements.</li><li>Identifying risk movement patterns in one's own and others' execution.</li><li>Proposing preventive technical adjustments based on physiological evidence.</li></ul>
<p><b>Attitudinal:</b></p>
<ul><li>Responsibility for self-care and injury prevention.</li><li>Respect for individual limitations and adaptation of effort.</li></ul>
<p><b>Linked LOs:</b> LO2, LO3</p>

<h3>Block 3 · Nutrition, sleep and recovery for the professional week <small>(3 weeks)</small></h3>
<p><b>Conceptual:</b></p>
<ul><li>Dancers' nutritional needs: macronutrients, micronutrients, hydration.</li><li>Importance of sleep and recovery for performance and injury prevention.</li><li>Active and passive recovery strategies.</li><li>Relationship between nutrition, body image and mental health (ED prevention).</li></ul>
<p><b>Procedural:</b></p>
<ul><li>Designing a nutrition and hydration plan for a real professional week (intensive rehearsals, shows, tour).</li><li>Recording and analysing own sleep, hydration and recovery data.</li><li>Applying recovery techniques (stretching, foam roller, contrast bath).</li></ul>
<p><b>Attitudinal:</b></p>
<ul><li>Commitment to healthy, sustainable habits over time.</li><li>Sensitivity to body image and rejection of harmful practices.</li><li>Professional ethics in conveying nutritional advice.</li></ul>
<p><b>Linked LOs:</b> LO4, LO5, LO8</p>

<h3>Block 4 · Design of warm-up, cool-down and physical conditioning proposals <small>(4 weeks)</small></h3>
<p><b>Conceptual:</b></p>
<ul><li>Physiology of warm-up: effects on the cardiovascular, muscular and nervous systems.</li><li>Principles of physical conditioning applied to dance: strength, endurance, flexibility, power.</li><li>Designing safe, effective warm-up and cool-down sessions.</li><li>Adapting proposals to different contexts (rehearsal, show, class, tour).</li></ul>
<p><b>Procedural:</b></p>
<ul><li>Creating physiologically justified warm-up and cool-down sequences.</li><li>Designing conditioning programmes complementary to dance practice.</li><li>Evaluating the effectiveness of proposals using physiological data (HR, perceived exertion).</li></ul>
<p><b>Attitudinal:</b></p>
<ul><li>Responsibility for the safety of designed proposals.</li><li>Capacity to adapt to individual and group needs.</li></ul>
<p><b>Linked LOs:</b> LO6, LO3</p>

<h3>Block 5 · Scientific communication and professional ethics <small>(2 weeks)</small></h3>
<p><b>Conceptual:</b></p>
<ul><li>Principles of scientific communication: rigour, clarity, audience adaptation.</li><li>Strategies to convey physiological knowledge to different audiences (company, students, families).</li><li>Professional ethics in dance pedagogy: limits, responsibility, respect.</li><li>ED prevention and detection in the dance field.</li></ul>
<p><b>Procedural:</b></p>
<ul><li>Preparing and delivering a scientific presentation adapted to a specific audience.</li><li>Using didactic resources (visual, practical, analogical) to aid understanding.</li><li>Debate on real ethical cases in dance pedagogy and professional practice.</li></ul>
<p><b>Attitudinal:</b></p>
<ul><li>Commitment to conveying healthy, evidence-based messages.</li><li>Sensitivity to body diversity and rejection of harmful stereotypes.</li><li>Responsibility in the role model for students and peers.</li></ul>
<p><b>Linked LOs:</b> LO7, LO8</p>`},

{id:"eix",t:"6. Core project: ongoing real professional situation",h:`
<p>All learning is structured around a <b>real, ongoing professional situation</b> that acts as the subject's guiding thread. This situation simulates an <b>intense professional week</b> (for example, a tour, a creation residency or a run of shows) where students must apply all the knowledge acquired.</p>
<h3>Phases of the core project</h3>
<ol>
<li><b>Preparation (Blocks 1-2):</b> students analyse the physiological demands of the professional situation and identify potential risks.</li>
<li><b>Execution (Block 3):</b> during the simulated week, students record their own data (HR, sleep, hydration, nutrition) and make self-regulation decisions.</li>
<li><b>Design and application (Block 4):</b> students create and apply warm-up, cool-down and physical conditioning proposals adapted to the context.</li>
<li><b>Communication and reflection (Block 5):</b> students communicate results and learning to a specific audience and reflect on professional ethics.</li>
</ol>
<div class="note">This core project guarantees learning that is <b>meaningful, contextualised and transferable</b> to real professional practice.</div>`},

{id:"metodologia",t:"7. Teaching methodology",h:`
<p>The methodology is grounded in a <b>competence-based, active and contextualised approach</b>, where students build physiological knowledge <i>because they need it</i> to solve real professional challenges. It deliberately departs from the traditional transmission model (memorising anatomical systems) to situate learning in professional application contexts.</p>

<h3>7.1 General methodological principles</h3>
<ol>
<li><b>Learning based on real professional situations:</b> all content is introduced and developed from an ongoing professional situation (the "intense professional week") that acts as the backbone of the subject.</li>
<li><b>Meaningful and transferable learning:</b> knowledge is built in applied contexts to guarantee transfer to future professional practice (stage, pedagogy, prevention).</li>
<li><b>Active student role:</b> students are protagonists of their learning: they research, experiment, decide, design and communicate. The teacher acts as guide, facilitator and mentor.</li>
<li><b>Cooperative work:</b> peer learning is fostered through small-group activities, peer assessment and collaborative projects.</li>
<li><b>Autonomy and self-regulation:</b> the capacity to manage one's own learning, interpret physiological data and make informed decisions is promoted.</li>
<li><b>Theory-practice integration:</b> there is no artificial separation between theoretical and practical content; theory is introduced <i>when it is needed</i> to solve the professional challenge.</li>
<li><b>Ethical and body-care focus:</b> reflection on body image, ED prevention and professional responsibility is incorporated transversally.</li>
</ol>

<h3>7.2 Teaching-learning strategies and activities</h3>
<h4>A) Directed on-site activities (synchronous sessions)</h4>
<table>
<thead><tr><th>Activity type</th><th>Description</th><th>Purpose</th></tr></thead>
<tbody>
<tr><td><b>Dialogued expository sessions</b></td><td>Presentation of theoretical content with active student participation (questions, brief cases, discussion).</td><td>Introduce key concepts and solve doubts.</td></tr>
<tr><td><b>Body-lab practical workshops</b></td><td>First-person experimentation: HR measurement, balance tests, biomechanical analysis of technical movements, hydration records.</td><td>Experience physiological concepts in one's own body.</td></tr>
<tr><td><b>Group case studies</b></td><td>Analysis of real professional situations (dancer injuries, intensive tours, ED cases) with guided debate.</td><td>Develop critical thinking and decision-making.</td></tr>
<tr><td><b>Design laboratory</b></td><td>Group creation of warm-up, conditioning and recovery plan proposals.</td><td>Apply knowledge to professional design.</td></tr>
<tr><td><b>Scientific communication rehearsals</b></td><td>Preparation and simulation of presentations adapted to different audiences (company, students, families).</td><td>Develop communicative competence.</td></tr>
</tbody></table>
<h4>B) Autonomous activities (non-contact work)</h4>
<table>
<thead><tr><th>Activity type</th><th>Description</th><th>Purpose</th></tr></thead>
<tbody>
<tr><td><b>Critical reading of articles and resources</b></td><td>Selection of scientific texts, videos and digital resources on physiology applied to dance.</td><td>Broaden and deepen the content worked on in class.</td></tr>
<tr><td><b>Personal physiological diary recording</b></td><td>Continuous tracking of own data (HR, sleep, hydration, nutrition, perceived exertion) during the "professional week".</td><td>Develop self-regulation and body awareness.</td></tr>
<tr><td><b>Preparation of the final dossier</b></td><td>Individual preparation of the analysis and professional proposal document.</td><td>Synthesise learning and demonstrate acquired competence.</td></tr>
<tr><td><b>Preparation of the group presentation</b></td><td>Cooperative work to design the adapted scientific presentation.</td><td>Consolidate learning through teaching others.</td></tr>
<tr><td><b>Watching technical videos</b></td><td>Analysis of recordings of professional dancers from a biomechanical and physiological perspective.</td><td>Connect theory with real artistic references.</td></tr>
</tbody></table>
<h4>C) Tutorial and support activities</h4>
<table>
<thead><tr><th>Activity type</th><th>Description</th><th>Purpose</th></tr></thead>
<tbody>
<tr><td><b>Individual tutorials</b></td><td>Personalised monitoring of the physiological diary and final dossier.</td><td>Guide autonomous learning and solve specific doubts.</td></tr>
<tr><td><b>Formative feedback</b></td><td>Continuous feedback on activities in progress (not only at the end).</td><td>Allow improvement during the learning process.</td></tr>
<tr><td><b>Group consultation spaces</b></td><td>Time slots devoted to solving collective doubts about the projects.</td><td>Foster peer learning.</td></tr>
</tbody></table>

<h3>7.3 Organisation of student work</h3>
<table>
<thead><tr><th>Mode</th><th>% of total work</th><th>Description</th></tr></thead>
<tbody>
<tr><td><b>On-site classroom work</b></td><td>40 %</td><td>Theoretical sessions, practical workshops, case studies, design laboratories.</td></tr>
<tr><td><b>Individual autonomous work</b></td><td>35 %</td><td>Readings, physiological diary, dossier preparation, video viewing.</td></tr>
<tr><td><b>Cooperative group work</b></td><td>20 %</td><td>Case studies, proposal design, oral presentation preparation.</td></tr>
<tr><td><b>Tutorials and support</b></td><td>5 %</td><td>Personalised monitoring and formative feedback.</td></tr>
</tbody></table>
<div class="note">Orientative distribution by type of work. The official hourly distribution (45 contact hours + 30 autonomous = 75 h, 3 ECTS) is detailed in section 8.</div>

<h3>7.4 Teaching resources and materials</h3>
<p><b>Physical resources:</b></p>
<ul><li>Classroom with adaptable furniture for practical work.</li><li>Movement space (dance studio) for body workshops.</li><li>Measuring equipment: heart-rate monitors, bioimpedance scales, stopwatches, measuring tapes.</li><li>Conditioning equipment: foam rollers, elastic bands, mats.</li></ul>
<p><b>Digital resources:</b></p>
<ul><li><b>Institut del Teatre virtual campus:</b> central space for material delivery, activity submission, debate forums and feedback.</li><li><b>Digital library:</b> access to scientific articles, specialised books and databases (PubMed, Dialnet, SPORTDiscus).</li><li><b>Mobile tracking apps:</b> use of apps to track HR, sleep, hydration and nutrition (with selection criteria provided by the teacher).</li><li><b>Own and reference didactic videos:</b> workshop recordings, biomechanical analyses, examples of scientific communication.</li></ul>
<p><b>Human resources:</b></p>
<ul><li><b>Teacher-tutor:</b> guides the process, provides resources, offers formative feedback.</li><li><b>Guest professionals:</b> dancers, physiotherapists and dietitians specialised in performing arts participating in one-off sessions.</li><li><b>Course peers:</b> a fundamental resource for cooperative learning and peer assessment.</li></ul>

<h3>7.5 Pedagogical justification of the methodology</h3>
<ol>
<li><b>Social constructivism (Vygotsky):</b> knowledge is actively built by students in interaction with the professional context and peers.</li>
<li><b>Situated learning (Lave &amp; Wenger):</b> learning is more effective when it occurs in authentic application contexts, not academic abstractions.</li>
<li><b>Experiential learning (Kolb):</b> bodily experience of physiological concepts (through one's own body) generates deeper, more lasting learning than mere memorisation.</li>
<li><b>Competence-based approach (EHEA):</b> the methodology is oriented to the development of transferable competences, not the accumulation of inert content.</li>
<li><b>Formative assessment (Black &amp; Wiliam):</b> continuous feedback allows students to regulate their own learning and improve progressively.</li>
</ol>

<h3>7.6 Attention to student diversity</h3>
<ul>
<li><b>Multiple formats for content presentation:</b> texts, videos, body practices, visual schemes, podcasts.</li>
<li><b>Flexibility in ways of demonstrating learning:</b> students can choose the format of their final dossier (written, audiovisual, mixed) according to their preferences and strengths.</li>
<li><b>Differentiated paces:</b> extension activities for faster learners and reinforcement for those needing to consolidate concepts.</li>
<li><b>Individualised tutorials:</b> personalised monitoring to adapt the process to each student's specific needs.</li>
<li><b>Accessibility:</b> all digital resources meet accessibility criteria (subtitles, transcripts, adequate contrast).</li>
</ul>

<h3>7.7 Role of the teacher and the students</h3>
<table>
<thead><tr><th>Teacher's role</th><th>Students' role</th></tr></thead>
<tbody>
<tr><td>Designer of authentic professional situations</td><td>Active protagonist of their own learning</td></tr>
<tr><td>Facilitator of resources and experiences</td><td>First-person researcher and experimenter</td></tr>
<tr><td>Guide and mentor of the process</td><td>Self-regulator of their workload and recovery</td></tr>
<tr><td>Formative and summative assessor</td><td>Peer and self-assessor</td></tr>
<tr><td>Model of professional ethics and body care</td><td>Communicator of scientific knowledge to diverse audiences</td></tr>
<tr><td>Promoter of critical thinking</td><td>Informed decision-maker</td></tr>
</tbody></table>`},

{id:"biblio",t:"9. Bibliography and resources",h:`
<p>The bibliography and resources of the subject have been selected to guarantee a balance between the <b>scientific foundations of exercise physiology</b> and <b>specificity applied to dance</b>. Both general reference texts and publications specialised in dance medicine and science are included, with special attention to injury prevention, nutrition and ethical aspects (EDs, body image).</p>
<p>All resources are available at the <b>Institut del Teatre library</b> or through the <b>digital library</b> of the virtual campus.</p>

<h3>9.1 Basic bibliography (compulsory)</h3>
<p>This bibliography constitutes the core content of the subject and is compulsory consultation for students.</p>
<ul>
<li>Angioi, M., Metsios, G. S., Koutedakis, Y., Wyon, M. A., Nevill, A. M., Fairclough, S. J., &amp; Hagel, M. (2009). Fitness in contemporary dance: A systematic review. <i>International Journal of Sports Medicine, 30</i>(7), 475–484. https://doi.org/10.1055/s-0029-1185839</li>
<li>Howley, E. T., &amp; Franks, B. D. (2007). <i>Health fitness instructor's handbook</i> (5th ed.). Human Kinetics.</li>
<li>Koutedakis, Y., &amp; Jamurtas, A. (2004). The dancer as a performing athlete: Physiological considerations. <i>Sports Medicine, 34</i>(10), 651–661. https://doi.org/10.2165/00007256-200434100-00003</li>
<li>McArdle, W. D., Katch, F. I., &amp; Katch, V. L. (2015). <i>Fisiología del ejercicio: Nutrición, energía y rendimiento humano</i> (7th ed.). Alianza Editorial.</li>
<li>Solomon, R., Solomon, J., &amp; Minton, S. C. (2005). <i>Preventive dance medicine: The art and science of health and conditioning</i>. Princeton Book Company.</li>
<li>Wyon, M. A. (2010). Guidance for dance nutrition. In <i>Dance medicine: Science, art and practice</i> (pp. 113–132). Routledge.</li>
</ul>

<h3>9.2 Complementary bibliography (recommended)</h3>
<p>This bibliography allows deeper exploration of specific aspects of the subject and is especially useful for developing the dossier, oral presentations and assessment preparation.</p>
<p><b>Biomechanics and injury prevention:</b></p>
<ul>
<li>Hamilton, W. G., Hamilton, L. H., &amp; Lockett, J. (2018). <i>Anatomy and kinesiology for dancers</i> (3rd ed.). Routledge.</li>
<li>Liederbach, M., &amp; Richardson, M. A. (2016). <i>Dance medicine in practice: Anatomy, physiology, theory</i>. Routledge.</li>
</ul>
<p><b>Nutrition and recovery:</b></p>
<ul>
<li>American College of Sports Medicine, American Dietetic Association, &amp; Dietitians of Canada (2016). Nutrition and athletic performance. <i>Medicine &amp; Science in Sports &amp; Exercise, 48</i>(3), 543–568.</li>
<li>Burk, L. (2013). <i>Nutrition for dance: A practical guide</i>. Routledge.</li>
</ul>
<p><b>Body image and EDs in dance:</b></p>
<ul>
<li>Arcelus, J., Witcomb, G. L., &amp; Mitchell, T. (2014). Prevalence of eating disorders amongst dancers: A systematic review and meta-analysis. <i>European Eating Disorders Review, 22</i>(2), 92–101. https://doi.org/10.1002/erv.2272</li>
<li>Quested, E., &amp; Ntoumanis, N. (2010). The relationship between perceived autonomy support, exercise intentions and exercise behaviours. <i>Psychology of Sport and Exercise, 11</i>(4), 467–474.</li>
</ul>
<p><b>Scientific communication and pedagogy:</b></p>
<ul>
<li>Ambrose, M. (2016). <i>Dance pedagogy for a changing world: Teaching, learning and research</i>. Routledge.</li>
<li>Fortin, S., &amp; Siedentop, D. (1995). <i>Teaching dance in the school setting</i>. AAHPERD.</li>
</ul>

<h3>9.3 Digital and online resources</h3>
<p>The following resources are freely accessible or available through the Institut del Teatre institutional subscription:</p>
<p><b>Reference institutions and associations:</b></p>
<ul>
<li><b>IADMS (International Association for Dance Medicine &amp; Science):</b> https://www.iadms.org — Collection of <i>Fact Sheets</i> on nutrition, injury prevention, body image and dancer fitness. Essential material for adapted scientific communication.</li>
<li><b>CDR (Committee for Dance Education):</b> https://www.dance-education.org</li>
<li><b>One Dance UK — Healthy Dancer Programme:</b> https://www.onedanceuk.org/healthy-dancer/</li>
</ul>
<p><b>Scientific databases:</b></p>
<ul>
<li><b>PubMed:</b> https://pubmed.ncbi.nlm.nih.gov (free access to abstracts; full articles through the library).</li>
<li><b>Dialnet:</b> https://dialnet.unirioja.es/ (resources in Spanish and Catalan).</li>
<li><b>SPORTDiscus:</b> database specialised in sport sciences (institutional access).</li>
</ul>
<p><b>Video and technical analysis platforms:</b></p>
<ul>
<li><b>Dance Magazine — Science for Dancers:</b> https://www.dancemagazine.com/</li>
<li><b>IADMS YouTube channel:</b> didactic videos on injury prevention and biomechanics.</li>
</ul>

<h3>9.4 Reference scientific journals</h3>
<p>Students are encouraged to regularly consult the following journals to stay up to date and for oral presentation preparation:</p>
<ul>
<li><i>Journal of Dance Medicine &amp; Science</i> (IADMS)</li>
<li><i>Medical Problems of Performing Artists</i></li>
<li><i>Sports Medicine</i></li>
<li><i>International Journal of Sports Medicine</i></li>
<li><i>Journal of Dance Education</i></li>
<li><i>Research in Dance Education</i></li>
<li><i>Apunts: Educació Física i Esports</i> (Catalan reference journal)</li>
</ul>

<h3>9.5 Mobile apps and tracking tools</h3>
<p>For tracking the <b>personal physiological diary</b> (central tool of the core project), the use of scientifically validated apps is recommended. The teacher will provide an updated list at the start of the course; the most common are:</p>
<ul>
<li><b>Heart-rate recording:</b> Polar Flow, Garmin Connect, HeartRate Monitor.</li>
<li><b>Sleep recording:</b> Sleep Cycle, Pillow.</li>
<li><b>Hydration and nutrition recording:</b> MyFitnessPal, Yazio.</li>
<li><b>Perceived exertion (RPE scale):</b> daily, with own record in the template provided by the teacher.</li>
</ul>
<div class="note">The use of apps is voluntary and always respectful of personal data privacy. The critical interpretation of these tools and their limits will be discussed in class.</div>

<h3>9.6 Other resources</h3>
<ul>
<li><b>Classroom equipment:</b> heart-rate monitors, bioimpedance scales, stopwatches, measuring tapes, foam rollers and elastic bands (available at Institut del Teatre facilities).</li>
<li><b>Nutrition tutorial:</b> specific session with a dietitian specialised in performing arts (11 Dec 26).</li>
<li><b>Real case studies:</b> documentation provided by the teacher on professional dancer cases (anonymous and with consent).</li>
</ul>

<h3>9.7 Bibliographic selection criteria</h3>
<p>The bibliography has been selected following these criteria:</p>
<ol>
<li><b>Scientific rigour:</b> all texts are published by prestigious academic publishers or peer-reviewed journals.</li>
<li><b>Currency:</b> publications from the last 10 years are prioritised, although reference classics are included.</li>
<li><b>Dance specificity:</b> general exercise physiology texts are combined with publications specific to dance medicine and science.</li>
<li><b>Linguistic diversity:</b> resources in Catalan, Spanish and English are included, although English is essential for current scientific literature.</li>
<li><b>Accessibility:</b> all resources are available through the Institut del Teatre library or are freely accessible.</li>
</ol>`}
]}

/* =========================================================
   APLICACIÓ — render, idiomes, edició, persistència
   ========================================================= */
let lang=localStorage.getItem(KEY+'_lang')||'ca';
let overrides=JSON.parse(localStorage.getItem(KEY+'_overrides')||'{}');
let editing=false;

const $=s=>document.querySelector(s);
const U=()=>DATA[lang].ui;
const orig=(id)=>DATA[lang].secs.find(s=>s.id===id).h;
const cur=(id)=>(overrides[lang]&&overrides[lang][id]!==undefined)?overrides[lang][id]:orig(id);

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2200);}

function render(){
  const d=DATA[lang];
  document.documentElement.lang=lang;
  $('#brandTitle').textContent='🩰 '+d.ui.brand;
  $('#brandSub').textContent=d.ui.brandSub;
  $('#bEdit').textContent=editing?d.ui.editing:d.ui.edit;
  $('#bSave').textContent=d.ui.save;
  $('#bExport').textContent=d.ui.export;
  $('#bImport').textContent=d.ui.import;
  $('#bReset').textContent=d.ui.reset;
  $('#bPrint').textContent=d.ui.print;
  document.querySelectorAll('#langBox button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  $('#nav').innerHTML='<strong class="navtitle">'+d.ui.navTitle+'</strong>'+
    d.secs.map((s,i)=>'<a href="#s-'+s.id+'" data-i="'+i+'">'+s.t+'</a>').join('');
  $('#main').innerHTML=d.secs.map(s=>{
    const ed=(overrides[lang]&&overrides[lang][s.id]!==undefined)?'<span class="edited-chip">'+d.ui.edited+'</span>':'';
    return '<section class="card" id="s-'+s.id+'"><h2>'+s.t+ed+'</h2><div class="secbody" data-id="'+s.id+'">'+cur(s.id)+'</div></section>';
  }).join('');
  applyEdit();
  const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id));}})},{rootMargin:'-20% 0px -70% 0px'});
  document.querySelectorAll('section.card').forEach(sec=>obs.observe(sec));
}

function applyEdit(){
  document.querySelectorAll('.secbody').forEach(el=>{
    el.setAttribute('contenteditable',editing?'true':'false');
  });
  document.body.classList.toggle('editing',editing);
}

function save(){
  if(!editing){toast(U().nochanges);return;}
  overrides[lang]=overrides[lang]||{};
  let n=0;
  document.querySelectorAll('.secbody').forEach(el=>{
    const id=el.dataset.id;
    if(el.innerHTML!==orig(id)){overrides[lang][id]=el.innerHTML;n++;}
    else{delete overrides[lang][id];}
  });
  if(!Object.keys(overrides[lang]).length)delete overrides[lang];
  localStorage.setItem(KEY+'_overrides',JSON.stringify(overrides));
  toast(U().saved+' ('+n+') · '+new Date().toLocaleTimeString());
  $('#savestate').textContent=U().saved+' '+new Date().toLocaleTimeString();
  render();
}
function resetLang(){
  if(!confirm(U().resetMsg))return;
  delete overrides[lang];
  localStorage.setItem(KEY+'_overrides',JSON.stringify(overrides));
  render();toast(U().saved);
}
function exportJSON(){
  const blob=new Blob([JSON.stringify({app:KEY,exported:new Date().toISOString(),overrides},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='guia-docent-fisiologia-edicions.json';a.click();
}
function importJSON(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const j=JSON.parse(e.target.result);
      if(j.overrides){overrides=j.overrides;localStorage.setItem(KEY+'_overrides',JSON.stringify(overrides));render();toast(U().saved);}
      else toast('Format no vàlid');
    }catch(err){toast('Error: fitxer no vàlid');}
  };
  r.readAsText(file);
}

 $('#langBox').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(editing&&!confirm("Canviar d'idioma tanca el mode d'edició sense desar. Continuar?"))return;
  editing=false;lang=b.dataset.lang;localStorage.setItem(KEY+'_lang',lang);render();
});
 $('#bEdit').onclick=()=>{editing=!editing;applyEdit();$('#bEdit').textContent=editing?U().editing:U().edit;};
 $('#bSave').onclick=save;
 $('#bReset').onclick=resetLang;
 $('#bExport').onclick=exportJSON;
 $('#bPrint').onclick=()=>window.print();
 $('#bImport').onclick=()=>$('#fileImp').click();
 $('#fileImp').onchange=e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value='';};

render();
</script>
</body>
