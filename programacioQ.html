{id:"presentacio",t:"3. Presentació de l'assignatura",h:`
<h3>3.1 Descripció general</h3>
<p>La <b>Fisiologia aplicada a la dansa</b> és una assignatura de formació bàsica dins del Grau en Dansa que proporciona a l'alumnat les eines científiques necessàries per comprendre el funcionament del cos humà en acció. S'allunya deliberadament d'un plantejament memorístic dels sistemes anatòmics per situar l'aprenentatge en contextos professionals reals: assajar millor, prevenir lesions, rendir en escena i ensenyar amb seguretat.</p>
<p>Tota l'assignatura s'articula al voltant d'una <b>situació professional real i continuada</b> (l'eix global), que simula una setmana professional intensa (gira, residència de creació o sèrie de funcions). Aquest eix actua com a fil conductor i permet que el coneixement fisiològic es construeixi <i>perquè és necessari</i> per resoldre el repte professional plantejat.</p>
<h3>3.2 Justificació en el perfil del graduat/da</h3>
<p>La dansa és una disciplina artística d'alta exigència física que requereix dels seus intèrprets i pedagogs un coneixement profund del cos. L'assignatura respon a la necessitat de formar professionals que:</p>
<ul>
<li><b>Comprenguin</b> els mecanismes fisiològics que regulen l'esforç, la recuperació i la lesió.</li>
<li><b>Previnguin</b> riscos derivats de càrregues intenses, gires o pràctiques inadequades.</li>
<li><b>Optimitzin</b> el rendiment artístic a partir de l'evidència científica.</li>
<li><b>Comunicuin</b> amb rigor el coneixement corporal a companyies, alumnes i famílies.</li>
<li><b>Exerceixin</b> amb ètica, especialment en relació amb la imatge corporal i la prevenció dels TCA.</li>
</ul>
<p>Aquesta assignatura contribueix, per tant, a les <b>competències transversals</b> (comunicació científica, treball cooperatiu, autonomia d'aprenentatge) i a les <b>competències específiques</b> de cura del cos, prevenció i rendiment del pla d'estudis.</p>
<h3>3.3 Enfocament competencial i metodològic</h3>
<p>L'enfocament de l'assignatura és <b>competencial, actiu i contextualitzat</b>. El coneixement no es transmet de forma aïllada, sinó que es construeix a través de:</p>
<ul>
<li>L'<b>experimentació en primera persona</b> (tallers corporals, registre de dades fisiològiques pròpies).</li>
<li>L'<b>anàlisi de situacions professionals reals</b> (estudis de cas, disseny de propostes).</li>
<li>La <b>comunicació científica adaptada</b> a diferents públics (presentacions orals).</li>
<li>La <b>reflexió ètica</b> sobre la imatge corporal, els TCA i la responsabilitat professional.</li>
</ul>
<h3>3.4 Relació amb altres assignatures del pla d'estudis</h3>
<p>L'assignatura s'insereix en una xarxa de matèries del Grau en Dansa que comparteixen l'objectiu de formar professionals íntegres i rigorosos:</p>
<ul>
<li><b>Assignatures de tècnica de dansa:</b> on s'apliquen els principis de biomecànica i condicionament físic treballats en aquesta assignatura.</li>
<li><b>Anatomia funcional / Kinesiologia:</b> amb la qual comparteix fonaments i amb la qual es coordina per evitar duplicats.</li>
<li><b>Pedagogia de la dansa:</b> on es transfereixen els coneixements sobre prevenció, escalfament i comunicació científica.</li>
<li><b>Assignatures de salut i benestar:</b> amb les quals es treballa de manera transversal la prevenció de TCA i la cura de la salut integral del ballarí/na.</li>
</ul>
<h3>3.5 Objectius de l'assignatura</h3>
<p>En finalitzar el curs, l'alumnat haurà assolit els <b>8 Resultats d'Aprenentatge (RA)</b> descrits a l'apartat 4, que abasten des de la comprensió dels mecanismes fisiològics bàsics fins a la capacitat de dissenyar propostes segures, comunicar amb rigor i exercir amb ètica professional.</p>`},

{id:"avaluacio",t:"4. Criteris i instruments d'avaluació",h:`
<p>L'avaluació de l'assignatura es fonamenta en un <b>enfocament competencial i continuat</b>, on el coneixement fisiològic s'avalua en contextos professionals reals. Es combina l'avaluació formativa (durant el procés) amb l'avaluació sumativa (al final).</p>
<h3>4.1 Instruments d'avaluació i ponderació</h3>
<table>
<thead><tr><th>Instrument</th><th>Descripció</th><th>Ponderació</th><th>RA vinculats</th></tr></thead>
<tbody>
<tr><td><b>Prova escrita teoricopràctica</b></td><td>Examen tipus test i preguntes curtes sobre mecanismes fisiològics i sistemes corporals aplicats a la dansa. Inclou casos pràctics de prevenció de lesions i optimització del rendiment.</td><td><b>30 %</b></td><td>RA1, RA2, RA3, RA5</td></tr>
<tr><td><b>Dossier de seguiment de la setmana professional</b></td><td>Document on l'alumnat registra i analitza dades fisiològiques pròpies (FC, hidratació, son, recuperació) durant una setmana real de càrrega professional (assajos intensius, funcions, gira). Inclou proposta de condicionament físic i nutrició.</td><td><b>35 %</b></td><td>RA4, RA5, RA6</td></tr>
<tr><td><b>Presentació oral de comunicació científica</b></td><td>Exposició grupal (2-3 persones) on es comunica un concepte fisiològic adaptat a un públic concret (companyia de dansa, alumnes d'una escola, famílies). S'avalua el rigor científic i l'adaptació didàctica.</td><td><b>20 %</b></td><td>RA7, RA3</td></tr>
<tr><td><b>Participació i treball cooperatiu</b></td><td>Avaluació continuada de la participació en classe, treball en equip, resolució de casos pràctics i actituds de cura de la salut i ètica professional. Inclou autoavaluació i coavaluació.</td><td><b>15 %</b></td><td>RA8, RA6, CT1, CT2</td></tr>
</tbody></table>
<h3>4.2 Criteris d'avaluació per Resultat d'Aprenentatge</h3>
<p><b>RA1 · Mecanismes d'homeòstasi i regulació corporal</b></p>
<ul><li>Explica amb precisió els processos de regulació tèrmica, hídrica i energètica durant l'activitat dancística.</li><li>Relaciona els mecanismes fisiològics amb situacions reals d'assaig i actuació.</li></ul>
<p><b>RA2 · Estructura i funcionament dels sistemes corporals</b></p>
<ul><li>Descriu correctament l'anatomia i la fisiologia dels sistemes musculoesquelètic, nerviós, endocrí, cardiovascular i respiratori.</li><li>Identifica les interrelacions entre sistemes durant l'esforç físic.</li></ul>
<p><b>RA3 · Anàlisi tècnica i factors de risc de lesió</b></p>
<ul><li>Analitza moviments tècnics de dansa des de la biomecànica i identifica patrons de risc.</li><li>Proposa ajustos tècnics preventius basats en evidència fisiològica.</li></ul>
<p><b>RA4 · Interpretació de dades fisiològiques i autorregulació</b></p>
<ul><li>Recull i interpreta correctament dades pròpies de FC, recuperació i hidratació.</li><li>Pren decisions d'autorregulació de la càrrega de treball basades en les dades.</li></ul>
<p><b>RA5 · Aplicació de nutrició, son i recuperació</b></p>
<ul><li>Dissenyar un pla d'alimentació, hidratació i descans coherent amb una setmana professional real.</li><li>Justifica les decisions preses amb fonaments fisiològics.</li></ul>
<p><b>RA6 · Disseny de propostes d'escalfament i condicionament</b></p>
<ul><li>Crea seqüències d'escalfament, volta a la calma i condicionament físic segures i justificades.</li><li>Adapta les propostes a diferents contextos professionals (assaig, funció, classe).</li></ul>
<p><b>RA7 · Comunicació científica adaptada</b></p>
<ul><li>Comunica conceptes fisiològics amb rigor i claredat.</li><li>Adapta el llenguatge i els exemples al públic destinatari (ballarins, alumnes, famílies).</li></ul>
<p><b>RA8 · Actituds de cura i ètica professional</b></p>
<ul><li>Demostra sensibilitat envers la imatge corporal i prevenció de TCA.</li><li>Mostra responsabilitat en la cura pròpia i en la transmissió de missatges saludables.</li></ul>
<h3>4.3 Requisits per superar l'assignatura</h3>
<ul>
<li><b>Assistència mínima del 80 %</b> a les sessions presencials.</li>
<li><b>Lliurament de totes les activitats avaluables</b> (dossier, presentació, proves).</li>
<li><b>Nota mínima de 5/10</b> en el conjunt de l'assignatura.</li>
<li><b>Nota mínima de 4/10</b> en la prova escrita teoricopràctica (per garantir l'assoliment dels continguts bàsics).</li>
</ul>
<h3>4.4 Avaluació de recuperació</h3>
<p>L'alumnat que no superi l'assignatura podrà acollir-se a una <b>prova de recuperació</b> que inclourà:</p>
<ul>
<li>Prova escrita teoricopràctica (substitueix el 30 % de la nota final).</li>
<li>Possibilitat de millorar el dossier de seguiment (substitueix el 35 % de la nota final).</li>
<li><b>No es poden recuperar</b> la presentació oral ni la participació continuada.</li>
</ul>
<h3>4.5 Avaluació formativa (no ponderada)</h3>
<p>Durant tot el curs es realitzaran activitats formatives no puntuables però obligatòries:</p>
<ul>
<li><b>Qüestionaris ràpids</b> d'autoavaluació al final de cada bloc temàtic.</li>
<li><b>Tutories individuals</b> per revisar el dossier de seguiment.</li>
<li><b>Debats i estudis de cas</b> en grup sobre prevenció de lesions i ètica professional.</li>
</ul>`},

{id:"blocs",t:"5. Continguts temàtics",h:`
<p>Els continguts s'organitzen en <b>5 blocs temàtics</b> que segueixen una progressió lògica: des dels fonaments fisiològics bàsics fins a l'aplicació professional avançada. Tot l'aprenentatge es vertebra al voltant de l'<b>eix global</b> (situació professional real continuada), que actua com a fil conductor i context d'aplicació.</p>

<h3>Bloc 1 · Fonaments de la fisiologia aplicada a la dansa <small>(3 setmanes)</small></h3>
<p><b>Conceptuals:</b></p>
<ul><li>Concepte d'homeòstasi i regulació corporal en l'activitat física.</li><li>Sistemes de regulació: nerviós, endocrí i cardiovascular.</li><li>Metabolisme energètic: vies aeròbiques i anaeròbiques aplicades a la dansa.</li><li>Termoregulació i hidratació durant l'esforç.</li></ul>
<p><b>Procedimentals:</b></p>
<ul><li>Mesura i registre de la freqüència cardíaca (FC) en repòs i durant l'esforç.</li><li>Interpretació de la resposta fisiològica immediata a l'exercici.</li><li>Anàlisi de la demanda energètica de diferents estils de dansa.</li></ul>
<p><b>Actitudinals:</b></p>
<ul><li>Valoració de la importància de conèixer el propi cos per optimitzar el rendiment.</li><li>Consciència de les diferències individuals en la resposta fisiològica.</li></ul>
<p><b>RA vinculats:</b> RA1, RA2</p>

<h3>Bloc 2 · Anatomia funcional i biomecànica del moviment dancístic <small>(4 setmanes)</small></h3>
<p><b>Conceptuals:</b></p>
<ul><li>Sistema musculoesquelètic: estructura i funcionament.</li><li>Principis de biomecànica aplicats a la dansa: forces, palanques, equilibri.</li><li>Anàlisi funcional dels principals grups musculars en moviments tècnics (salts, girs, extensions).</li><li>Factors de risc de lesió: sobrecàrrega, mala tècnica, desequilibris musculars.</li></ul>
<p><b>Procedimentals:</b></p>
<ul><li>Anàlisi biomecànica de moviments tècnics específics.</li><li>Identificació de patrons de moviment de risc en l'execució pròpia i d'altres.</li><li>Proposta d'ajustos tècnics preventius basats en evidència fisiològica.</li></ul>
<p><b>Actitudinals:</b></p>
<ul><li>Responsabilitat en la cura del propi cos i prevenció de lesions.</li><li>Respecte per les limitacions individuals i adaptació de l'esforç.</li></ul>
<p><b>RA vinculats:</b> RA2, RA3</p>

<h3>Bloc 3 · Nutrició, son i recuperació per a la setmana professional <small>(3 setmanes)</small></h3>
<p><b>Conceptuals:</b></p>
<ul><li>Necessitats nutricionals del ballarí/na: macronutrients, micronutrients, hidratació.</li><li>Importància del son i la recuperació en el rendiment i la prevenció de lesions.</li><li>Estratègies de recuperació activa i passiva.</li><li>Relació entre alimentació, imatge corporal i salut mental (prevenció de TCA).</li></ul>
<p><b>Procedimentals:</b></p>
<ul><li>Disseny d'un pla d'alimentació i hidratació per a una setmana professional real (assajos intensius, funcions, gira).</li><li>Registre i anàlisi de dades pròpies de son, hidratació i recuperació.</li><li>Aplicació de tècniques de recuperació (estiraments, foam roller, bany de contrast).</li></ul>
<p><b>Actitudinals:</b></p>
<ul><li>Compromís amb hàbits saludables i sostenibles en el temps.</li><li>Sensibilitat cap a la imatge corporal i rebuig de pràctiques nocives.</li><li>Ètica professional en la transmissió de consells nutricionals.</li></ul>
<p><b>RA vinculats:</b> RA4, RA5, RA8</p>

<h3>Bloc 4 · Disseny de propostes d'escalfament, volta a la calma i condicionament físic <small>(4 setmanes)</small></h3>
<p><b>Conceptuals:</b></p>
<ul><li>Fisiologia de l'escalfament: efectes sobre el sistema cardiovascular, muscular i nerviós.</li><li>Principis del condicionament físic aplicat a la dansa: força, resistència, flexibilitat, potència.</li><li>Disseny de sessions d'escalfament i volta a la calma segures i efectives.</li><li>Adaptació de les propostes a diferents contextos (assaig, funció, classe, gira).</li></ul>
<p><b>Procedimentals:</b></p>
<ul><li>Creació de seqüències d'escalfament i volta a la calma justificades fisiològicament.</li><li>Disseny de programes de condicionament físic complementaris a la pràctica dancística.</li><li>Avaluació de l'efectivitat de les propostes mitjançant dades fisiològiques (FC, percepció de l'esforç).</li></ul>
<p><b>Actitudinals:</b></p>
<ul><li>Responsabilitat en la seguretat de les propostes dissenyades.</li><li>Capacitat d'adaptació a les necessitats individuals i del grup.</li></ul>
<p><b>RA vinculats:</b> RA6, RA3</p>

<h3>Bloc 5 · Comunicació científica i ètica professional <small>(2 setmanes)</small></h3>
<p><b>Conceptuals:</b></p>
<ul><li>Principis de comunicació científica: rigor, claredat, adaptació al públic.</li><li>Estratègies per transmetre coneixement fisiològic a diferents audiències (companyia, alumnes, famílies).</li><li>Ètica professional en la pedagogia de la dansa: límits, responsabilitat, respecte.</li><li>Prevenció i detecció de TCA en l'àmbit de la dansa.</li></ul>
<p><b>Procedimentals:</b></p>
<ul><li>Preparació i presentació d'una exposició científica adaptada a un públic concret.</li><li>Ús de recursos didàctics (visuals, pràctics, analògics) per facilitar la comprensió.</li><li>Debat sobre casos ètics reals en la pedagogia i la pràctica professional de la dansa.</li></ul>
<p><b>Actitudinals:</b></p>
<ul><li>Compromís amb la transmissió de missatges saludables i basats en evidència.</li><li>Sensibilitat cap a la diversitat corporal i rebuig d'estereotips nocius.</li><li>Responsabilitat en el rol de model per a alumnes i companyes.</li></ul>
<p><b>RA vinculats:</b> RA7, RA8</p>`},

{id:"eix",t:"6. Eix global: situació professional real continuada",h:`
<p>Tot l'aprenentatge es vertebra al voltant d'una <b>situació professional real i continuada</b> que actua com a fil conductor de l'assignatura. Aquesta situació simula una <b>setmana professional intensa</b> (per exemple, una gira, una residència de creació o una sèrie de funcions) on l'alumnat ha d'aplicar tots els coneixements adquirits.</p>
<h3>Fases de l'eix global</h3>
<ol>
<li><b>Preparació (blocs 1-2):</b> l'alumnat analitza les demandes fisiològiques de la situació professional i identifica els riscos potencials.</li>
<li><b>Execució (bloc 3):</b> durant la setmana simulada, l'alumnat registra dades pròpies (FC, son, hidratació, nutrició) i pren decisions d'autorregulació.</li>
<li><b>Disseny i aplicació (bloc 4):</b> l'alumnat crea i aplica propostes d'escalfament, volta a la calma i condicionament físic adaptades al context.</li>
<li><b>Comunicació i reflexió (bloc 5):</b> l'alumnat comunica els resultats i aprenentatges a un públic concret i reflexiona sobre l'ètica professional.</li>
</ol>
<div class="note">Aquest eix global garanteix que l'aprenentatge sigui <b>significatiu, contextualitzat i transferible</b> a la pràctica professional real.</div>`},

{id:"metodologia",t:"7. Metodologia didàctica",h:`
<p>La metodologia de l'assignatura es fonamenta en un <b>enfocament competencial, actiu i contextualitzat</b>, on l'alumnat construeix el coneixement fisiològic <i>perquè el necessita</i> per resoldre reptes professionals reals. S'allunya deliberadament del model transmissiu tradicional (memorització de sistemes anatòmics) per situar l'aprenentatge en contextos d'aplicació professional.</p>

<h3>7.1 Principis metodològics generals</h3>
<ol>
<li><b>Aprenentatge basat en situacions professionals reals (ABSP):</b> tot el contingut s'introdueix i es desenvolupa a partir d'una situació professional continuada (la «setmana professional intensa») que actua com a vertebrador de l'assignatura.</li>
<li><b>Aprenentatge significatiu i transferible:</b> els coneixements es construeixen en contextos aplicats per garantir la seva transferència a la pràctica professional futura (escena, pedagogia, prevenció).</li>
<li><b>Rol actiu de l'alumnat:</b> l'estudiant és protagonista del seu aprenentatge: investiga, experimenta, decideix, dissenya i comunica. El docent actua com a guia, facilitador i mentor.</li>
<li><b>Treball cooperatiu:</b> es fomenta l'aprenentatge entre iguals mitjançant activitats en petit grup, coavaluació i projectes col·laboratius.</li>
<li><b>Autonomia i autorregulació:</b> es promou la capacitat de gestionar el propi aprenentatge, interpretar les dades fisiològiques i prendre decisions fonamentades.</li>
<li><b>Integració teoria-pràctica:</b> no existeix una separació artificial entre continguts teòrics i pràctics; la teoria s'introdueix <i>en el moment en què és necessària</i> per resoldre el repte professional.</li>
<li><b>Enfocament ètic i de cura del cos:</b> s'incorpora transversalment la reflexió sobre la imatge corporal, la prevenció de TCA i la responsabilitat professional.</li>
</ol>

<h3>7.2 Estratègies i activitats d'ensenyament-aprenentatge</h3>
<h4>A) Activitats presencials dirigides (sessions síncrones)</h4>
<table>
<thead><tr><th>Tipus d'activitat</th><th>Descripció</th><th>Finalitat</th></tr></thead>
<tbody>
<tr><td><b>Sessions expositives dialogades</b></td><td>Presentació de continguts teòrics amb participació activa de l'alumnat (preguntes, casos breus, discussió).</td><td>Introduir conceptes clau i resoldre dubtes.</td></tr>
<tr><td><b>Tallers pràctics de laboratori corporal</b></td><td>Experimentació en primera persona: mesura de FC, tests d'equilibri, anàlisi biomecànica de moviments tècnics, registres d'hidratació.</td><td>Vivenciar els conceptes fisiològics en el propi cos.</td></tr>
<tr><td><b>Estudis de cas en grup</b></td><td>Anàlisi de situacions professionals reals (lesions de ballarins, gires intensives, casos de TCA) amb debat guiat.</td><td>Desenvolupar el pensament crític i la presa de decisions.</td></tr>
<tr><td><b>Laboratori de disseny</b></td><td>Creació en grup de propostes d'escalfament, condicionament i plans de recuperació.</td><td>Aplicar els coneixements al disseny professional.</td></tr>
<tr><td><b>Assajos de comunicació científica</b></td><td>Preparació i simulació d'exposicions adaptades a diferents públics (companyia, alumnes, famílies).</td><td>Desenvolupar la competència comunicativa.</td></tr>
</tbody></table>
<h4>B) Activitats autònomes (treball no presencial)</h4>
<table>
<thead><tr><th>Tipus d'activitat</th><th>Descripció</th><th>Finalitat</th></tr></thead>
<tbody>
<tr><td><b>Lectura crítica d'articles i recursos</b></td><td>Selecció de textos científics, vídeos i recursos digitals sobre fisiologia aplicada a la dansa.</td><td>Ampliar i aprofundir els continguts treballats a classe.</td></tr>
<tr><td><b>Registre del diari fisiològic personal</b></td><td>Seguiment continuat de dades pròpies (FC, son, hidratació, nutrició, percepció de l'esforç) durant la «setmana professional».</td><td>Desenvolupar l'autorregulació i la consciència corporal.</td></tr>
<tr><td><b>Preparació del dossier final</b></td><td>Elaboració individual del document d'anàlisi i proposta professional.</td><td>Sintetitzar els aprenentatges i demostrar la competència adquirida.</td></tr>
<tr><td><b>Preparació de la presentació grupal</b></td><td>Treball cooperatiu per dissenyar l'exposició científica adaptada.</td><td>Consolidar l'aprenentatge mitjançant l'ensenyament a altres.</td></tr>
<tr><td><b>Visionat de vídeos tècnics</b></td><td>Anàlisi de gravacions de ballarins professionals des de la perspectiva biomecànica i fisiològica.</td><td>Connectar la teoria amb referents artístics reals.</td></tr>
</tbody></table>
<h4>C) Activitats de tutoria i acompanyament</h4>
<table>
<thead><tr><th>Tipus d'activitat</th><th>Descripció</th><th>Finalitat</th></tr></thead>
<tbody>
<tr><td><b>Tutories individuals</b></td><td>Seguiment personalitzat del diari fisiològic i del dossier final.</td><td>Orientar l'aprenentatge autònom i resoldre dubtes específics.</td></tr>
<tr><td><b>Devolutives formatives</b></td><td>Retroalimentació continuada sobre les activitats en procés (no només al final).</td><td>Permetre la millora durant el procés d'aprenentatge.</td></tr>
<tr><td><b>Espais de consulta grupal</b></td><td>Horaris dedicats a resoldre dubtes col·lectius sobre els projectes.</td><td>Fomentar l'aprenentatge entre iguals.</td></tr>
</tbody></table>

<h3>7.3 Organització del treball de l'alumnat</h3>
<table>
<thead><tr><th>Modalitat</th><th>% del treball total</th><th>Descripció</th></tr></thead>
<tbody>
<tr><td><b>Treball presencial a l'aula</b></td><td>40 %</td><td>Sessions teòriques, tallers pràctics, estudis de cas, laboratoris de disseny.</td></tr>
<tr><td><b>Treball autònom individual</b></td><td>35 %</td><td>Lectures, diari fisiològic, preparació del dossier, visionats.</td></tr>
<tr><td><b>Treball cooperatiu en grup</b></td><td>20 %</td><td>Estudis de cas, disseny de propostes, preparació de la presentació oral.</td></tr>
<tr><td><b>Tutories i acompanyament</b></td><td>5 %</td><td>Seguiment personalitzat i devolutives formatives.</td></tr>
</tbody></table>
<div class="note">Distribució orientativa per tipologia de treball. La distribució horària oficial (45 h presencials + 30 h autònomes = 75 h, 3 ECTS) es detalla a l'apartat 8.</div>

<h3>7.4 Recursos i materials didàctics</h3>
<p><b>Recursos físics:</b></p>
<ul><li>Aula amb mobiliari adaptable per al treball pràctic.</li><li>Espai de moviment (sala de dansa) per als tallers corporals.</li><li>Material de mesura: pulsòmetres, bàscules de bioimpedància, cronòmetres, cintes mètriques.</li><li>Material de condicionament: foam rollers, bandes elàstiques, colchonetas.</li></ul>
<p><b>Recursos digitals:</b></p>
<ul><li><b>Campus virtual de l'Institut del Teatre:</b> espai central per a l'entrega de materials, enviament d'activitats, fòrums de debat i devolutives.</li><li><b>Biblioteca digital:</b> accés a articles científics, llibres especialitzats i bases de dades (PubMed, Dialnet, SPORTDiscus).</li><li><b>Aplicacions mòbils de registre:</b> ús d'apps per al seguiment de FC, son, hidratació i nutrició (amb criteris de selecció proporcionats pel docent).</li><li><b>Vídeos didàctics propis i de referència:</b> gravacions de tallers, anàlisis biomecàniques, exemples de comunicació científica.</li></ul>
<p><b>Recursos humans:</b></p>
<ul><li><b>Docent-tutor:</b> guia el procés, facilita recursos, ofereix devolutives formatives.</li><li><b>Professionals convidats:</b> ballarins, fisioterapeutes, nutricionistes especialitzats en arts escèniques que participen en sessions puntuals.</li><li><b>Companyes de curs:</b> recurs fonamental per a l'aprenentatge cooperatiu i la coavaluació.</li></ul>

<h3>7.5 Justificació pedagògica de la metodologia</h3>
<ol>
<li><b>Constructivisme social (Vygotsky):</b> el coneixement es construeix activament per l'alumnat en interacció amb el context professional i amb els companyes.</li>
<li><b>Aprenentatge situat (Lave &amp; Wenger):</b> l'aprenentatge és més efectiu quan es produeix en contextos autèntics d'aplicació, no en abstraccions acadèmiques.</li>
<li><b>Aprenentatge experiencial (Kolb):</b> la vivència corporal dels conceptes fisiològics (a través del propi cos) genera un aprenentatge més profund i durador que la mera memorització.</li>
<li><b>Enfocament per competències (EEES):</b> la metodologia està orientada al desenvolupament de competències transferibles, no a l'acumulació de continguts inerts.</li>
<li><b>Avaluació formativa (Black &amp; Wiliam):</b> la retroalimentació continuada permet a l'alumnat regular el seu propi aprenentatge i millorar progressivament.</li>
</ol>

<h3>7.6 Atenció a la diversitat de l'alumnat</h3>
<ul>
<li><b>Múltiples formats de presentació de continguts:</b> textos, vídeos, pràctiques corporals, esquemes visuals, pòdcasts.</li>
<li><b>Flexibilitat en les formes de demostració de l'aprenentatge:</b> l'alumnat pot triar el format del seu dossier final (escrit, audiovisual, mixt) segons les seves preferències i fortaleses.</li>
<li><b>Ritmes diferenciats:</b> s'ofereixen activitats d'ampliació per a qui avança més ràpid i de reforç per a qui necessita consolidar conceptes.</li>
<li><b>Tutories individualitzades:</b> seguiment personalitzat per adaptar el procés a les necessitats específiques de cada estudiant.</li>
<li><b>Accessibilitat:</b> tots els recursos digitals compleixen criteris d'accessibilitat (subtítols, transcripcions, contrast adequat).</li>
</ul>

<h3>7.7 Rol del docent i de l'alumnat</h3>
<table>
<thead><tr><th>Rol del docent</th><th>Rol de l'alumnat</th></tr></thead>
<tbody>
<tr><td>Dissenyador de situacions professionals autèntiques</td><td>Protagonista actiu del seu propi aprenentatge</td></tr>
<tr><td>Facilitador de recursos i experiències</td><td>Investigador i experimentador en primera persona</td></tr>
<tr><td>Guia i mentor del procés</td><td>Autorregulador de la seva càrrega i la seva recuperació</td></tr>
<tr><td>Avaluador formatiu i sumatiu</td><td>Coavaluador i autoavaluador</td></tr>
<tr><td>Model d'ètica professional i cura del cos</td><td>Comunicador de coneixement científic a diversos públics</td></tr>
<tr><td>Promotor del pensament crític</td><td>Prenedor de decisions fonamentades</td></tr>
</tbody></table>`},

{id:"biblio",t:"9. Bibliografia i recursos",h:`
<p>La bibliografia i els recursos de l'assignatura s'han seleccionat per garantir un equilibri entre els <b>fonaments científics de la fisiologia de l'exercici</b> i l'<b>especificitat aplicada a la dansa</b>. S'inclouen tant textos de referència general com publicacions especialitzades en medicina i ciència de la dansa, amb especial atenció a la prevenció de lesions, la nutrició i els aspectes ètics (TCA, imatge corporal).</p>
<p>Tots els recursos estan disponibles a la <b>biblioteca de l'Institut del Teatre</b> o a través de la <b>biblioteca digital</b> del campus virtual.</p>

<h3>9.1 Bibliografia bàsica (obligatòria)</h3>
<p>Aquesta bibliografia constitueix el nucli de continguts de l'assignatura i és de consulta obligada per a l'alumnat.</p>
<ul>
<li>Angioi, M., Metsios, G. S., Koutedakis, Y., Wyon, M. A., Nevill, A. M., Fairclough, S. J., &amp; Hagel, M. (2009). Fitness in contemporary dance: A systematic review. <i>International Journal of Sports Medicine, 30</i>(7), 475–484. https://doi.org/10.1055/s-0029-1185839</li>
<li>Howley, E. T., &amp; Franks, B. D. (2007). <i>Health fitness instructor's handbook</i> (5a ed.). Human Kinetics.</li>
<li>Koutedakis, Y., &amp; Jamurtas, A. (2004). The dancer as a performing athlete: Physiological considerations. <i>Sports Medicine, 34</i>(10), 651–661. https://doi.org/10.2165/00007256-200434100-00003</li>
<li>McArdle, W. D., Katch, F. I., &amp; Katch, V. L. (2015). <i>Fisiología del ejercicio: Nutrición, energía y rendimiento humano</i> (7a ed.). Alianza Editorial.</li>
<li>Solomon, R., Solomon, J., &amp; Minton, S. C. (2005). <i>Preventive dance medicine: The art and science of health and conditioning</i>. Princeton Book Company.</li>
<li>Wyon, M. A. (2010). Guidance for dance nutrition. En <i>Dance medicine: Science, art and practice</i> (pp. 113–132). Routledge.</li>
</ul>

<h3>9.2 Bibliografia complementària (recomanada)</h3>
<p>Aquesta bibliografia permet aprofundir en aspectes específics de l'assignatura i és especialment útil per al desenvolupament del dossier, els treballs orals i la preparació de les avaluacions.</p>
<p><b>Biomecànica i prevenció de lesions:</b></p>
<ul>
<li>Hamilton, W. G., Hamilton, L. H., &amp; Lockett, J. (2018). <i>Anatomy and kinesiology for dancers</i> (3a ed.). Routledge.</li>
<li>Liederbach, M., &amp; Richardson, M. A. (2016). <i>Dance medicine in practice: Anatomy, physiology, theory</i>. Routledge.</li>
</ul>
<p><b>Nutrició i recuperació:</b></p>
<ul>
<li>American College of Sports Medicine, American Dietetic Association, &amp; Dietitians of Canada (2016). Nutrition and athletic performance. <i>Medicine &amp; Science in Sports &amp; Exercise, 48</i>(3), 543–568.</li>
<li>Burk, L. (2013). <i>Nutrition for dance: A practical guide</i>. Routledge.</li>
</ul>
<p><b>Imatge corporal i TCA en dansa:</b></p>
<ul>
<li>Arcelus, J., Witcomb, G. L., &amp; Mitchell, T. (2014). Prevalence of eating disorders amongst dancers: A systematic review and meta-analysis. <i>European Eating Disorders Review, 22</i>(2), 92–101. https://doi.org/10.1002/erv.2272</li>
<li>Quested, E., &amp; Ntoumanis, N. (2010). The relationship between perceived autonomy support, exercise intentions and exercise behaviours. <i>Psychology of Sport and Exercise, 11</i>(4), 467–474.</li>
</ul>
<p><b>Comunicació científica i pedagogia:</b></p>
<ul>
<li>Ambrose, M. (2016). <i>Dance pedagogy for a changing world: Teaching, learning and research</i>. Routledge.</li>
<li>Fortin, S., &amp; Siedentop, D. (1995). <i>Teaching dance in the school setting</i>. AAHPERD.</li>
</ul>

<h3>9.3 Recursos digitals i en línia</h3>
<p>Els següents recursos són d'accés lliure o estan disponibles a través de la subscripció institucional de l'Institut del Teatre:</p>
<p><b>Institucions i associacions de referència:</b></p>
<ul>
<li><b>IADMS (International Association for Dance Medicine &amp; Science):</b> https://www.iadms.org — Recull de <i>Fact Sheets</i> sobre nutrició, prevenció de lesions, imatge corporal i condició física del ballarí/na. Material essencial per a la comunicació científica adaptada.</li>
<li><b>CDR (Committee for Dance Education):</b> https://www.dance-education.org</li>
<li><b>One Dance UK — Healthy Dancer Programme:</b> https://www.onedanceuk.org/healthy-dancer/</li>
</ul>
<p><b>Bases de dades científiques:</b></p>
<ul>
<li><b>PubMed:</b> https://pubmed.ncbi.nlm.nih.gov (accés lliure a resums; articles complets a través de la biblioteca).</li>
<li><b>Dialnet:</b> https://dialnet.unirioja.es/ (recursos en castellà i català).</li>
<li><b>SPORTDiscus:</b> base de dades especialitzada en ciències de l'esport (accés institucional).</li>
</ul>
<p><b>Plataformes de vídeo i anàlisi tècnica:</b></p>
<ul>
<li><b>Dance Magazine — Science for Dancers:</b> https://www.dancemagazine.com/</li>
<li><b>Canal de YouTube de l'IADMS:</b> vídeos didàctics sobre prevenció de lesions i biomecànica.</li>
</ul>

<h3>9.4 Revistes científiques de referència</h3>
<p>L'alumnat és encoratjat a consultar regularment les següents revistes per mantenir-se actualitzat i per a la preparació dels treballs orals:</p>
<ul>
<li><i>Journal of Dance Medicine &amp; Science</i> (IADMS)</li>
<li><i>Medical Problems of Performing Artists</i></li>
<li><i>Sports Medicine</i></li>
<li><i>International Journal of Sports Medicine</i></li>
<li><i>Journal of Dance Education</i></li>
<li><i>Research in Dance Education</i></li>
<li><i>Apunts: Educació Física i Esports</i> (revista catalana de referència)</li>
</ul>

<h3>9.5 Aplicacions mòbils i eines de registre</h3>
<p>Per al seguiment del <b>diari fisiològic personal</b> (eina central de l'eix global), es recomana l'ús d'aplicacions validades científicament. El docent proporcionarà una llista actualitzada al començament del curs, però les més habituals són:</p>
<ul>
<li><b>Registre de freqüència cardíaca:</b> Polar Flow, Garmin Connect, HeartRate Monitor.</li>
<li><b>Registre de son:</b> Sleep Cycle, Pillow.</li>
<li><b>Registre d'hidratació i nutrició:</b> MyFitnessPal, Yazio.</li>
<li><b>Percepció de l'esforç (escala RPE):</b> diàriament amb registre propi en plantilla proporcionada pel docent.</li>
</ul>
<div class="note">L'ús d'aplicacions és voluntari i sempre respectuós amb la privacitat de les dades personals. Es treballarà a classe la interpretació crítica d'aquestes eines i els seus límits.</div>

<h3>9.6 Altres recursos</h3>
<ul>
<li><b>Material d'aula:</b> pulsòmetres, bàscules de bioimpedància, cronòmetres, cintes mètriques, foam rollers i bandes elàstiques (disponibles a les instal·lacions de l'Institut del Teatre).</li>
<li><b>Tutoria de nutrició:</b> sessió específica amb nutricionista especialitzat/da en arts escèniques (11-des-26).</li>
<li><b>Estudis de cas reals:</b> documentació proporcionada pel docent sobre casos professionals de ballarins/es (anònims i amb consentiment).</li>
</ul>

<h3>9.7 Criteris de selecció bibliogràfica</h3>
<p>La bibliografia s'ha seleccionat seguint els següents criteris:</p>
<ol>
<li><b>Rigor científic:</b> tots els textos són publicats per editorials acadèmiques de prestigi o revistes amb revisió per parells.</li>
<li><b>Actualització:</b> es prioritzen publicacions dels últims 10 anys, tot i que s'inclouen clàssics de referència.</li>
<li><b>Especificitat per a la dansa:</b> es combinen textos generals de fisiologia de l'exercici amb publicacions específiques de medicina i ciència de la dansa.</li>
<li><b>Diversitat lingüística:</b> s'inclouen recursos en català, castellà i anglès, tot i que l'anglès és imprescindible per a la literatura científica actual.</li>
<li><b>Accessibilitat:</b> tots els recursos estan disponibles a través de la biblioteca de l'Institut del Teatre o són d'accés lliure.</li>
</ol>`}
]},

{id:"presentacio",t:"3. Presentación de la asignatura",h:`
<h3>3.1 Descripción general</h3>
<p>La <b>Fisiología aplicada a la danza</b> es una asignatura de formación básica dentro del Grado en Danza que proporciona al alumnado las herramientas científicas necesarias para comprender el funcionamiento del cuerpo humano en acción. Se aleja deliberadamente de un planteamiento memorístico de los sistemas anatómicos para situar el aprendizaje en contextos profesionales reales: ensayar mejor, prevenir lesiones, rendir en escena y enseñar con seguridad.</p>
<p>Toda la asignatura se articula en torno a una <b>situación profesional real y continuada</b> (el eje global), que simula una semana profesional intensa (gira, residencia de creación o serie de funciones). Este eje actúa como hilo conductor y permite que el conocimiento fisiológico se construya <i>porque es necesario</i> para resolver el reto profesional planteado.</p>
<h3>3.2 Justificación en el perfil del graduado/da</h3>
<p>La danza es una disciplina artística de alta exigencia física que requiere de sus intérpretes y pedagogos un conocimiento profundo del cuerpo. La asignatura responde a la necesidad de formar profesionales que:</p>
<ul>
<li><b>Comprendan</b> los mecanismos fisiológicos que regulan el esfuerzo, la recuperación y la lesión.</li>
<li><b>Prevengan</b> riesgos derivados de cargas intensas, giras o prácticas inadecuadas.</li>
<li><b>Optimicen</b> el rendimiento artístico a partir de la evidencia científica.</li>
<li><b>Comuniquen</b> con rigor el conocimiento corporal a compañías, alumnos y familias.</li>
<li><b>Ejerzan</b> con ética, especialmente en relación con la imagen corporal y la prevención de los TCA.</li>
</ul>
<p>Esta asignatura contribuye, por tanto, a las <b>competencias transversales</b> (comunicación científica, trabajo cooperativo, autonomía de aprendizaje) y a las <b>competencias específicas</b> de cuidado del cuerpo, prevención y rendimiento del plan de estudios.</p>
<h3>3.3 Enfoque competencial y metodológico</h3>
<p>El enfoque de la asignatura es <b>competencial, activo y contextualizado</b>. El conocimiento no se transmite de forma aislada, sino que se construye a través de:</p>
<ul>
<li>La <b>experimentación en primera persona</b> (talleres corporales, registro de datos fisiológicos propios).</li>
<li>El <b>análisis de situaciones profesionales reales</b> (estudios de caso, diseño de propuestas).</li>
<li>La <b>comunicación científica adaptada</b> a diferentes públicos (presentaciones orales).</li>
<li>La <b>reflexión ética</b> sobre la imagen corporal, los TCA y la responsabilidad profesional.</li>
</ul>
<h3>3.4 Relación con otras asignaturas del plan de estudios</h3>
<p>La asignatura se inserta en una red de materias del Grado en Danza que comparten el objetivo de formar profesionales íntegros y rigurosos:</p>
<ul>
<li><b>Asignaturas de técnica de danza:</b> donde se aplican los principios de biomecánica y acondicionamiento físico trabajados en esta asignatura.</li>
<li><b>Anatomía funcional / Kinesiología:</b> con la cual comparte fundamentos y con la que se coordina para evitar duplicados.</li>
<li><b>Pedagogía de la danza:</b> donde se transfieren los conocimientos sobre prevención, calentamiento y comunicación científica.</li>
<li><b>Asignaturas de salud y bienestar:</b> con las que se trabaja de manera transversal la prevención de TCA y el cuidado de la salud integral del bailarín/na.</li>
</ul>
<h3>3.5 Objetivos de la asignatura</h3>
<p>Al finalizar el curso, el alumnado habrá alcanzado los <b>8 Resultados de Aprendizaje (RA)</b> descritos en el apartado 4, que abarcan desde la comprensión de los mecanismos fisiológicos básicos hasta la capacidad de diseñar propuestas seguras, comunicar con rigor y ejercer con ética profesional.</p>`},

{id:"avaluacio",t:"4. Criterios e instrumentos de evaluación",h:`
<p>La evaluación de la asignatura se fundamenta en un <b>enfoque competencial y continuado</b>, donde el conocimiento fisiológico se evalúa en contextos profesionales reales. Se combina la evaluación formativa (durante el proceso) con la evaluación sumativa (al final).</p>
<h3>4.1 Instrumentos de evaluación y ponderación</h3>
<table>
<thead><tr><th>Instrumento</th><th>Descripción</th><th>Ponderación</th><th>RA vinculados</th></tr></thead>
<tbody>
<tr><td><b>Prueba escrita teoricopráctica</b></td><td>Examen tipo test y preguntas cortas sobre mecanismos fisiológicos y sistemas corporales aplicados a la danza. Incluye casos prácticos de prevención de lesiones y optimización del rendimiento.</td><td><b>30 %</b></td><td>RA1, RA2, RA3, RA5</td></tr>
<tr><td><b>Dossier de seguimiento de la semana profesional</b></td><td>Documento donde el alumnado registra y analiza datos fisiológicos propios (FC, hidratación, sueño, recuperación) durante una semana real de carga profesional (ensayos intensivos, funciones, gira). Incluye propuesta de acondicionamiento físico y nutrición.</td><td><b>35 %</b></td><td>RA4, RA5, RA6</td></tr>
<tr><td><b>Presentación oral de comunicación científica</b></td><td>Exposición grupal (2-3 personas) donde se comunica un concepto fisiológico adaptado a un público concreto (compañía de danza, alumnos de una escuela, familias). Se evalúa el rigor científico y la adaptación didáctica.</td><td><b>20 %</b></td><td>RA7, RA3</td></tr>
<tr><td><b>Participación y trabajo cooperativo</b></td><td>Evaluación continuada de la participación en clase, trabajo en equipo, resolución de casos prácticos y actitudes de cuidado de la salud y ética profesional. Incluye autoevaluación y coevaluación.</td><td><b>15 %</b></td><td>RA8, RA6, CT1, CT2</td></tr>
</tbody></table>
<h3>4.2 Criterios de evaluación por Resultado de Aprendizaje</h3>
<p><b>RA1 · Mecanismos de homeostasis y regulación corporal</b></p>
<ul><li>Explica con precisión los procesos de regulación térmica, hídrica y energética durante la actividad dancística.</li><li>Relaciona los mecanismos fisiológicos con situaciones reales de ensayo y actuación.</li></ul>
<p><b>RA2 · Estructura y funcionamiento de los sistemas corporales</b></p>
<ul><li>Describe correctamente la anatomía y la fisiología de los sistemas musculoesquelético, nervioso, endocrino, cardiovascular y respiratorio.</li><li>Identifica las interrelaciones entre sistemas durante el esfuerzo físico.</li></ul>
<p><b>RA3 · Análisis técnica y factores de riesgo de lesión</b></p>
<ul><li>Analiza movimientos técnicos de danza desde la biomecánica e identifica patrones de riesgo.</li><li>Propone ajustes técnicos preventivos basados en evidencia fisiológica.</li></ul>
<p><b>RA4 · Interpretación de datos fisiológicos y autorregulación</b></p>
<ul><li>Recoge e interpreta correctamente datos propios de FC, recuperación e hidratación.</li><li>Toma decisiones de autorregulación de la carga de trabajo basadas en los datos.</li></ul>
<p><b>RA5 · Aplicación de nutrición, sueño y recuperación</b></p>
<ul><li>Diseña un plan de alimentación, hidratación y descanso coherente con una semana profesional real.</li><li>Justifica las decisiones tomadas con fundamentos fisiológicos.</li></ul>
<p><b>RA6 · Diseño de propuestas de calentamiento y acondicionamiento</b></p>
<ul><li>Crea secuencias de calentamiento, vuelta a la calma y acondicionamiento físico seguras y justificadas.</li><li>Adapta las propuestas a diferentes contextos profesionales (ensayo, función, clase).</li></ul>
<p><b>RA7 · Comunicación científica adaptada</b></p>
<ul><li>Comunica conceptos fisiológicos con rigor y claridad.</li><li>Adapta el lenguaje y los ejemplos al público destinatario (bailarines, alumnos, familias).</li></ul>
<p><b>RA8 · Actitudes de cuidado y ética profesional</b></p>
<ul><li>Demuestra sensibilidad hacia la imagen corporal y prevención de TCA.</li><li>Muestra responsabilidad en el cuidado propio y en la transmisión de mensajes saludables.</li></ul>
<h3>4.3 Requisitos para superar la asignatura</h3>
<ul>
<li><b>Asistencia mínima del 80 %</b> a las sesiones presenciales.</li>
<li><b>Entrega de todas las actividades evaluables</b> (dossier, presentación, pruebas).</li>
<li><b>Nota mínima de 5/10</b> en el conjunto de la asignatura.</li>
<li><b>Nota mínima de 4/10</b> en la prueba escrita teoricopráctica (para garantizar el logro de los contenidos básicos).</li>
</ul>
<h3>4.4 Evaluación de recuperación</h3>
<p>El alumnado que no supere la asignatura podrá acogerse a una <b>prueba de recuperación</b> que incluirá:</p>
<ul>
<li>Prueba escrita teoricopráctica (sustituye el 30 % de la nota final).</li>
<li>Posibilidad de mejorar el dossier de seguimiento (sustituye el 35 % de la nota final).</li>
<li><b>No se pueden recuperar</b> la presentación oral ni la participación continuada.</li>
</ul>
<h3>4.5 Evaluación formativa (no ponderada)</h3>
<p>Durante todo el curso se realizarán actividades formativas no puntuables pero obligatorias:</p>
<ul>
<li><b>Cuestionarios rápidos</b> de autoevaluación al final de cada bloque temático.</li>
<li><b>Tutorías individuales</b> para revisar el dossier de seguimiento.</li>
<li><b>Debates y estudios de caso</b> en grupo sobre prevención de lesiones y ética profesional.</li>
</ul>`},

{id:"blocs",t:"5. Contenidos temáticos",h:`
<p>Los contenidos se organizan en <b>5 bloques temáticos</b> que siguen una progresión lógica: desde los fundamentos fisiológicos básicos hasta la aplicación profesional avanzada. Todo el aprendizaje se vertebra alrededor del <b>eje global</b> (situación profesional real continuada), que actúa como hilo conductor y contexto de aplicación.</p>

<h3>Bloque 1 · Fundamentos de la fisiología aplicada a la danza <small>(3 semanas)</small></h3>
<p><b>Conceptuales:</b></p>
<ul><li>Concepto de homeostasis y regulación corporal en la actividad física.</li><li>Sistemas de regulación: nervioso, endocrino y cardiovascular.</li><li>Metabolismo energético: vías aeróbicas y anaeróbicas aplicadas a la danza.</li><li>Termorregulación e hidratación durante el esfuerzo.</li></ul>
<p><b>Procedimentales:</b></p>
<ul><li>Medida y registro de la frecuencia cardíaca (FC) en reposo y durante el esfuerzo.</li><li>Interpretación de la respuesta fisiológica inmediata al ejercicio.</li><li>Análisis de la demanda energética de diferentes estilos de danza.</li></ul>
<p><b>Actitudinales:</b></p>
<ul><li>Valoración de la importancia de conocer el propio cuerpo para optimizar el rendimiento.</li><li>Consciencia de las diferencias individuales en la respuesta fisiológica.</li></ul>
<p><b>RA vinculados:</b> RA1, RA2</p>

<h3>Bloque 2 · Anatomía funcional y biomecánica del movimiento dancístico <small>(4 semanas)</small></h3>
<p><b>Conceptuales:</b></p>
<ul><li>Sistema musculoesquelético: estructura y funcionamiento.</li><li>Principios de biomecánica aplicados a la danza: fuerzas, palancas, equilibrio.</li><li>Análisis funcional de los principales grupos musculares en movimientos técnicos (saltos, giros, extensiones).</li><li>Factores de riesgo de lesión: sobrecarga, mala técnica, desequilibrios musculares.</li></ul>
<p><b>Procedimentales:</b></p>
<ul><li>Análisis biomecánico de movimientos técnicos específicos.</li><li>Identificación de patrones de movimiento de riesgo en la ejecución propia y de otros.</li><li>Propuesta de ajustes técnicos preventivos basados en evidencia fisiológica.</li></ul>
<p><b>Actitudinales:</b></p>
<ul><li>Responsabilidad en el cuidado del propio cuerpo y prevención de lesiones.</li><li>Respeto por las limitaciones individuales y adaptación del esfuerzo.</li></ul>
<p><b>RA vinculados:</b> RA2, RA3</p>

<h3>Bloque 3 · Nutrición, sueño y recuperación para la semana profesional <small>(3 semanas)</small></h3>
<p><b>Conceptuales:</b></p>
<ul><li>Necesidades nutricionales del bailarín/na: macronutrientes, micronutrientes, hidratación.</li><li>Importancia del sueño y la recuperación en el rendimiento y la prevención de lesiones.</li><li>Estrategias de recuperación activa y pasiva.</li><li>Relación entre alimentación, imagen corporal y salud mental (prevención de TCA).</li></ul>
<p><b>Procedimentales:</b></p>
<ul><li>Diseño de un plan de alimentación e hidratación para una semana profesional real (ensayos intensivos, funciones, gira).</li><li>Registro y análisis de datos propios de sueño, hidratación y recuperación.</li><li>Aplicación de técnicas de recuperación (estiramientos, foam roller, baño de contraste).</li></ul>
<p><b>Actitudinales:</b></p>
<ul><li>Compromiso con hábitos saludables y sostenibles en el tiempo.</li><li>Sensibilidad hacia la imagen corporal y rechazo de prácticas nocivas.</li><li>Ética profesional en la transmisión de consejos nutricionales.</li></ul>
<p><b>RA vinculados:</b> RA4, RA5, RA8</p>

<h3>Bloque 4 · Diseño de propuestas de calentamiento, vuelta a la calma y acondicionamiento físico <small>(4 semanas)</small></h3>
<p><b>Conceptuales:</b></p>
<ul><li>Fisiología del calentamiento: efectos sobre el sistema cardiovascular, muscular y nervioso.</li><li>Principios del acondicionamiento físico aplicado a la danza: fuerza, resistencia, flexibilidad, potencia.</li><li>Diseño de sesiones de calentamiento y vuelta a la calma seguras y efectivas.</li><li>Adaptación de las propuestas a diferentes contextos (ensayo, función, clase, gira).</li></ul>
<p><b>Procedimentales:</b></p>
<ul><li>Creación de secuencias de calentamiento y vuelta a la calma justificadas fisiológicamente.</li><li>Diseño de programas de acondicionamiento físico complementarios a la práctica dancística.</li><li>Evaluación de la efectividad de las propuestas mediante datos fisiológicos (FC, percepción del esfuerzo).</li></ul>
<p><b>Actitudinales:</b></p>
<ul><li>Responsabilidad en la seguridad de las propuestas diseñadas.</li><li>Capacidad de adaptación a las necesidades individuales y del grupo.</li></ul>
<p><b>RA vinculados:</b> RA6, RA3</p>

<h3>Bloque 5 · Comunicación científica y ética profesional <small>(2 semanas)</small></h3>
<p><b>Conceptuales:</b></p>
<ul><li>Principios de comunicación científica: rigor, claridad, adaptación al público.</li><li>Estrategias para transmitir conocimiento fisiológico a diferentes audiencias (compañía, alumnos, familias).</li><li>Ética profesional en la pedagogía de la danza: límites, responsabilidad, respeto.</li><li>Prevención y detección de TCA en el ámbito de la danza.</li></ul>
<p><b>Procedimentales:</b></p>
<ul><li>Preparación y presentación de una exposición científica adaptada a un público concreto.</li><li>Uso de recursos didácticos (visuales, prácticos, analógicos) para facilitar la comprensión.</li><li>Debate sobre casos éticos reales en la pedagogía y la práctica profesional de la danza.</li></ul>
<p><b>Actitudinales:</b></p>
<ul><li>Compromiso con la transmisión de mensajes saludables y basados en evidencia.</li><li>Sensibilidad hacia la diversidad corporal y rechazo de estereotipos nocivos.</li><li>Responsabilidad en el rol de modelo para alumnos y compañeros.</li></ul>
<p><b>RA vinculados:</b> RA7, RA8</p>`},

{id:"eix",t:"6. Eje global: situación profesional real continuada",h:`
<p>Todo el aprendizaje se vertebra alrededor de una <b>situación profesional real y continuada</b> que actúa como hilo conductor de la asignatura. Esta situación simula una <b>semana profesional intensa</b> (por ejemplo, una gira, una residencia de creación o una serie de funciones) donde el alumnado debe aplicar todos los conocimientos adquiridos.</p>
<h3>Fases del eje global</h3>
<ol>
<li><b>Preparación (bloques 1-2):</b> el alumnado analiza las demandas fisiológicas de la situación profesional e identifica los riesgos potenciales.</li>
<li><b>Ejecución (bloque 3):</b> durante la semana simulada, el alumnado registra datos propios (FC, sueño, hidratación, nutrición) y toma decisiones de autorregulación.</li>
<li><b>Diseño y aplicación (bloque 4):</b> el alumnado crea y aplica propuestas de calentamiento, vuelta a la calma y acondicionamiento físico adaptadas al contexto.</li>
<li><b>Comunicación y reflexión (bloque 5):</b> el alumnado comunica los resultados y aprendizajes a un público concreto y reflexiona sobre la ética profesional.</li>
</ol>
<div class="note">Este eje global garantiza que el aprendizaje sea <b>significativo, contextualizado y transferible</b> a la práctica profesional real.</div>`},

{id:"metodologia",t:"7. Metodología didáctica",h:`
<p>La metodología de la asignatura se fundamenta en un <b>enfoque competencial, activo y contextualizado</b>, donde el alumnado construye el conocimiento fisiológico <i>porque lo necesita</i> para resolver retos profesionales reales. Se aleja deliberadamente del modelo transmisivo tradicional (memorización de sistemas anatómicos) para situar el aprendizaje en contextos de aplicación profesional.</p>

<h3>7.1 Principios metodológicos generales</h3>
<ol>
<li><b>Aprendizaje basado en situaciones profesionales reales (ABSP):</b> todo el contenido se introduce y desarrolla a partir de una situación profesional continuada (la «semana profesional intensa») que actúa como vertebrador de la asignatura.</li>
<li><b>Aprendizaje significativo y transferible:</b> los conocimientos se construyen en contextos aplicados para garantizar su transferencia a la práctica profesional futura (escena, pedagogía, prevención).</li>
<li><b>Rol activo del alumnado:</b> el estudiante es protagonista de su aprendizaje: investiga, experimenta, decide, diseña y comunica. El docente actúa como guía, facilitador y mentor.</li>
<li><b>Trabajo cooperativo:</b> se fomenta el aprendizaje entre iguales mediante actividades en pequeño grupo, coevaluación y proyectos colaborativos.</li>
<li><b>Autonomía y autorregulación:</b> se promueve la capacidad de gestionar el propio aprendizaje, interpretar los datos fisiológicos y tomar decisiones fundamentadas.</li>
<li><b>Integración teoría-práctica:</b> no existe una separación artificial entre contenidos teóricos y prácticos; la teoría se introduce <i>en el momento en que es necesaria</i> para resolver el reto profesional.</li>
<li><b>Enfoque ético y de cuidado del cuerpo:</b> se incorpora transversalmente la reflexión sobre la imagen corporal, la prevención de TCA y la responsabilidad profesional.</li>
</ol>

<h3>7.2 Estrategias y actividades de enseñanza-aprendizaje</h3>
<h4>A) Actividades presenciales dirigidas (sesiones síncronas)</h4>
<table>
<thead><tr><th>Tipo de actividad</th><th>Descripción</th><th>Finalidad</th></tr></thead>
<tbody>
<tr><td><b>Sesiones expositivas dialogadas</b></td><td>Presentación de contenidos teóricos con participación activa del alumnado (preguntas, casos breves, discusión).</td><td>Introducir conceptos clave y resolver dudas.</td></tr>
<tr><td><b>Talleres prácticos de laboratorio corporal</b></td><td>Experimentación en primera persona: medición de FC, tests de equilibrio, análisis biomecánico de movimientos técnicos, registros de hidratación.</td><td>Vivenciar los conceptos fisiológicos en el propio cuerpo.</td></tr>
<tr><td><b>Estudios de caso en grupo</b></td><td>Análisis de situaciones profesionales reales (lesiones de bailarines, giras intensivas, casos de TCA) con debate guiado.</td><td>Desarrollar el pensamiento crítico y la toma de decisiones.</td></tr>
<tr><td><b>Laboratorio de diseño</b></td><td>Creación en grupo de propuestas de calentamiento, acondicionamiento y planes de recuperación.</td><td>Aplicar los conocimientos al diseño profesional.</td></tr>
<tr><td><b>Ensayos de comunicación científica</b></td><td>Preparación y simulación de exposiciones adaptadas a diferentes públicos (compañía, alumnos, familias).</td><td>Desarrollar la competencia comunicativa.</td></tr>
</tbody></table>
<h4>B) Actividades autónomas (trabajo no presencial)</h4>
<table>
<thead><tr><th>Tipo de actividad</th><th>Descripción</th><th>Finalidad</th></tr></thead>
<tbody>
<tr><td><b>Lectura crítica de artículos y recursos</b></td><td>Selección de textos científicos, vídeos y recursos digitales sobre fisiología aplicada a la danza.</td><td>Ampliar y profundizar los contenidos trabajados en clase.</td></tr>
<tr><td><b>Registro del diario fisiológico personal</b></td><td>Seguimiento continuado de datos propios (FC, sueño, hidratación, nutrición, percepción del esfuerzo) durante la «semana profesional».</td><td>Desarrollar la autorregulación y la consciencia corporal.</td></tr>
<tr><td><b>Preparación del dossier final</b></td><td>Elaboración individual del documento de análisis y propuesta profesional.</td><td>Sintetizar los aprendizajes y demostrar la competencia adquirida.</td></tr>
<tr><td><b>Preparación de la presentación grupal</b></td><td>Trabajo cooperativo para diseñar la exposición científica adaptada.</td><td>Consolidar el aprendizaje mediante la enseñanza a otros.</td></tr>
<tr><td><b>Visionado de vídeos técnicos</b></td><td>Análisis de grabaciones de bailarines profesionales desde la perspectiva biomecánica y fisiológica.</td><td>Conectar la teoría con referentes artísticos reales.</td></tr>
</tbody></table>
<h4>C) Actividades de tutoría y acompañamiento</h4>
<table>
<thead><tr><th>Tipo de actividad</th><th>Descripción</th><th>Finalidad</th></tr></thead>
<tbody>
<tr><td><b>Tutorías individuales</b></td><td>Seguimiento personalizado del diario fisiológico y del dossier final.</td><td>Orientar el aprendizaje autónomo y resolver dudas específicas.</td></tr>
<tr><td><b>Devolutivas formativas</b></td><td>Retroalimentación continuada sobre las actividades en proceso (no solo al final).</td><td>Permitir la mejora durante el proceso de aprendizaje.</td></tr>
<tr><td><b>Espacios de consulta grupal</b></td><td>Horarios dedicados a resolver dudas colectivas sobre los proyectos.</td><td>Fomentar el aprendizaje entre iguales.</td></tr>
</tbody></table>

<h3>7.3 Organización del trabajo del alumnado</h3>
<table>
<thead><tr><th>Modalidad</th><th>% del trabajo total</th><th>Descripción</th></tr></thead>
<tbody>
<tr><td><b>Trabajo presencial en el aula</b></td><td>40 %</td><td>Sesiones teóricas, talleres prácticos, estudios de caso, laboratorios de diseño.</td></tr>
<tr><td><b>Trabajo autónomo individual</b></td><td>35 %</td><td>Lecturas, diario fisiológico, preparación del dossier, visionados.</td></tr>
<tr><td><b>Trabajo cooperativo en grupo</b></td><td>20 %</td><td>Estudios de caso, diseño de propuestas, preparación de la presentación oral.</td></tr>
<tr><td><b>Tutorías y acompañamiento</b></td><td>5 %</td><td>Seguimiento personalizado y devolutivas formativas.</td></tr>
</tbody></table>
<div class="note">Distribución orientativa por tipología de trabajo. La distribución horaria oficial (45 h presenciales + 30 h autónomas = 75 h, 3 ECTS) se detalla en el apartado 8.</div>

<h3>7.4 Recursos y materiales didácticos</h3>
<p><b>Recursos físicos:</b></p>
<ul><li>Aula con mobiliario adaptable para trabajo práctico.</li><li>Espacio de movimiento (sala de danza) para los talleres corporales.</li><li>Material de medición: pulsómetros, básculas de bioimpedancia, cronómetros, cintas métricas.</li><li>Material de acondicionamiento: foam rollers, bandas elásticas, colchonetas.</li></ul>
<p><b>Recursos digitales:</b></p>
<ul><li><b>Campus virtual del Institut del Teatre:</b> espacio central para la entrega de materiales, envío de actividades, foros de debate y devolutivas.</li><li><b>Biblioteca digital:</b> acceso a artículos científicos, libros especializados y bases de datos (PubMed, Dialnet, SPORTDiscus).</li><li><b>Aplicaciones móviles de registro:</b> uso de apps para el seguimiento de FC, sueño, hidratación y nutrición (con criterios de selección proporcionados por el docente).</li><li><b>Vídeos didácticos propios y de referencia:</b> grabaciones de talleres, análisis biomecánicos, ejemplos de comunicación científica.</li></ul>
<p><b>Recursos humanos:</b></p>
<ul><li><b>Docente-tutor:</b> guía el proceso, facilita recursos, ofrece devolutivas formativas.</li><li><b>Profesionales invitados:</b> bailarines, fisioterapeutas, nutricionistas especializados en artes escénicas que participan en sesiones puntuales.</li><li><b>Compañeros de curso:</b> recurso fundamental para el aprendizaje cooperativo y la coevaluación.</li></ul>

<h3>7.5 Justificación pedagógica de la metodología</h3>
<ol>
<li><b>Constructivismo social (Vygotsky):</b> el conocimiento se construye activamente por el alumnado en interacción con el contexto profesional y con los compañeros.</li>
<li><b>Aprendizaje situado (Lave &amp; Wenger):</b> el aprendizaje es más efectivo cuando se produce en contextos auténticos de aplicación, no en abstracciones académicas.</li>
<li><b>Aprendizaje experiencial (Kolb):</b> la vivencia corporal de los conceptos fisiológicos (a través del propio cuerpo) genera un aprendizaje más profundo y duradero que la mera memorización.</li>
<li><b>Enfoque por competencias (EEES):</b> la metodología está orientada al desarrollo de competencias transferibles, no a la acumulación de contenidos inertes.</li>
<li><b>Evaluación formativa (Black &amp; Wiliam):</b> la retroalimentación continuada permite al alumnado regular su propio aprendizaje y mejorar progresivamente.</li>
</ol>

<h3>7.6 Atención a la diversidad del alumnado</h3>
<ul>
<li><b>Múltiples formatos de presentación de contenidos:</b> textos, vídeos, prácticas corporales, esquemas visuales, pódcasts.</li>
<li><b>Flexibilidad en las formas de demostración del aprendizaje:</b> el alumnado puede elegir el formato de su dossier final (escrito, audiovisual, mixto) según sus preferencias y fortalezas.</li>
<li><b>Ritmos diferenciados:</b> se ofrecen actividades de ampliación para quienes avanzan más rápido y de refuerzo para quienes necesitan consolidar conceptos.</li>
<li><b>Tutorías individualizadas:</b> seguimiento personalizado para adaptar el proceso a las necesidades específicas de cada estudiante.</li>
<li><b>Accesibilidad:</b> todos los recursos digitales cumplen criterios de accesibilidad (subtítulos, transcripciones, contraste adecuado).</li>
</ul>

<h3>7.7 Rol del docente y del alumnado</h3>
<table>
<thead><tr><th>Rol del docente</th><th>Rol del alumnado</th></tr></thead>
<tbody>
<tr><td>Diseñador de situaciones profesionales auténticas</td><td>Protagonista activo de su propio aprendizaje</td></tr>
<tr><td>Facilitador de recursos y experiencias</td><td>Investigador y experimentador en primera persona</td></tr>
<tr><td>Guía y mentor del proceso</td><td>Autorregulador de su carga y su recuperación</td></tr>
<tr><td>Evaluador formativo y sumativo</td><td>Coevaluador y autoevaluador</td></tr>
<tr><td>Modelo de ética profesional y cuidado del cuerpo</td><td>Comunicador de conocimiento científico a diversos públicos</td></tr>
<tr><td>Promotor del pensamiento crítico</td><td>Tomador de decisiones fundamentadas</td></tr>
</tbody></table>`},

{id:"biblio",t:"9. Bibliografía y recursos",h:`
<p>La bibliografía y los recursos de la asignatura se han seleccionado para garantizar un equilibrio entre los <b>fundamentos científicos de la fisiología del ejercicio</b> y la <b>especificidad aplicada a la danza</b>. Se incluyen tanto textos de referencia general como publicaciones especializadas en medicina y ciencia de la danza, con especial atención a la prevención de lesiones, la nutrición y los aspectos éticos (TCA, imagen corporal).</p>
<p>Todos los recursos están disponibles en la <b>biblioteca del Institut del Teatre</b> o a través de la <b>biblioteca digital</b> del campus virtual.</p>

<h3>9.1 Bibliografía básica (obligatoria)</h3>
<p>Esta bibliografía constituye el núcleo de contenidos de la asignatura y es de consulta obligada para el alumnado.</p>
<ul>
<li>Angioi, M., Metsios, G. S., Koutedakis, Y., Wyon, M. A., Nevill, A. M., Fairclough, S. J., &amp; Hagel, M. (2009). Fitness in contemporary dance: A systematic review. <i>International Journal of Sports Medicine, 30</i>(7), 475–484. https://doi.org/10.1055/s-0029-1185839</li>
<li>Howley, E. T., &amp; Franks, B. D. (2007). <i>Health fitness instructor's handbook</i> (5ª ed.). Human Kinetics.</li>
<li>Koutedakis, Y., &amp; Jamurtas, A. (2004). The dancer as a performing athlete: Physiological considerations. <i>Sports Medicine, 34</i>(10), 651–661. https://doi.org/10.2165/00007256-200434100-00003</li>
<li>McArdle, W. D., Katch, F. I., &amp; Katch, V. L. (2015). <i>Fisiología del ejercicio: Nutrición, energía y rendimiento humano</i> (7ª ed.). Alianza Editorial.</li>
<li>Solomon, R., Solomon, J., &amp; Minton, S. C. (2005). <i>Preventive dance medicine: The art and science of health and conditioning</i>. Princeton Book Company.</li>
<li>Wyon, M. A. (2010). Guidance for dance nutrition. En <i>Dance medicine: Science, art and practice</i> (pp. 113–132). Routledge.</li>
</ul>

<h3>9.2 Bibliografía complementaria (recomendada)</h3>
<p>Esta bibliografía permite profundizar en aspectos específicos de la asignatura y es especialmente útil para el desarrollo del dossier, los trabajos orales y la preparación de las evaluaciones.</p>
<p><b>Biomecánica y prevención de lesiones:</b></p>
<ul>
<li>Hamilton, W. G., Hamilton, L. H., &amp; Lockett, J. (2018). <i>Anatomy and kinesiology for dancers</i> (3ª ed.). Routledge.</li>
<li>Liederbach, M., &amp; Richardson, M. A. (2016). <i>Dance medicine in practice: Anatomy, physiology, theory</i>. Routledge.</li>
</ul>
<p><b>Nutrición y recuperación:</b></p>
<ul>
<li>American College of Sports Medicine, American Dietetic Association, &amp; Dietitians of Canada (2016). Nutrition and athletic performance. <i>Medicine &amp; Science in Sports &amp; Exercise, 48</i>(3), 543–568.</li>
<li>Burk, L. (2013). <i>Nutrition for dance: A practical guide</i>. Routledge.</li>
</ul>
<p><b>Imagen corporal y TCA en danza:</b></p>
<ul>
<li>Arcelus, J., Witcomb, G. L., &amp; Mitchell, T. (2014). Prevalence of eating disorders amongst dancers: A systematic review and meta-analysis. <i>European Eating Disorders Review, 22</i>(2), 92–101. https://doi.org/10.1002/erv.2272</li>
<li>Quested, E., &amp; Ntoumanis, N. (2010). The relationship between perceived autonomy support, exercise intentions and exercise behaviours. <i>Psychology of Sport and Exercise, 11</i>(4), 467–474.</li>
</ul>
<p><b>Comunicación científica y pedagogía:</b></p>
<ul>
<li>Ambrose, M. (2016). <i>Dance pedagogy for a changing world: Teaching, learning and research</i>. Routledge.</li>
<li>Fortin, S., &amp; Siedentop, D. (1995). <i>Teaching dance in the school setting</i>. AAHPERD.</li>
</ul>

<h3>9.3 Recursos digitales y en línea</h3>
<p>Los siguientes recursos son de acceso libre o están disponibles a través de la suscripción institucional del Institut del Teatre:</p>
<p><b>Instituciones y asociaciones de referencia:</b></p>
<ul>
<li><b>IADMS (International Association for Dance Medicine &amp; Science):</b> https://www.iadms.org — Recogida de <i>Fact Sheets</i> sobre nutrición, prevención de lesiones, imagen corporal y condición física del bailarín/na. Material esencial para la comunicación científica adaptada.</li>
<li><b>CDR (Committee for Dance Education):</b> https://www.dance-education.org</li>
<li><b>One Dance UK — Healthy Dancer Programme:</b> https://www.onedanceuk.org/healthy-dancer/</li>
</ul>
<p><b>Bases de datos científicas:</b></p>
<ul>
<li><b>PubMed:</b> https://pubmed.ncbi.nlm.nih.gov (acceso libre a resúmenes; artículos completos a través de la biblioteca).</li>
<li><b>Dialnet:</b> https://dialnet.unirioja.es/ (recursos en castellano y catalán).</li>
<li><b>SPORTDiscus:</b> base de datos especializada en ciencias del deporte (acceso institucional).</li>
</ul>
<p><b>Plataformas de vídeo y análisis técnica:</b></p>
<ul>
<li><b>Dance Magazine — Science for Dancers:</b> https://www.dancemagazine.com/</li>
<li><b>Canal de YouTube de la IADMS:</b> vídeos didácticos sobre prevención de lesiones y biomecánica.</li>
</ul>

<h3>9.4 Revistas científicas de referencia</h3>
<p>Se anima al alumnado a consultar regularmente las siguientes revistas para mantenerse actualizado y para la preparación de los trabajos orales:</p>
<ul>
<li><i>Journal of Dance Medicine &amp; Science</i> (IADMS)</li>
<li><i>Medical Problems of Performing Artists</i></li>
<li><i>Sports Medicine</i></li>
<li><i>International Journal of Sports Medicine</i></li>
<li><i>Journal of Dance Education</i></li>
<li><i>Research in Dance Education</i></li>
<li><i>Apunts: Educació Física i Esports</i> (revista catalana de referencia)</li>
</ul>

<h3>9.5 Aplicaciones móviles y herramientas de registro</h3>
<p>Para el seguimiento del <b>diario fisiológico personal</b> (herramienta central del eje global), se recomienda el uso de aplicaciones validadas científicamente. El docente proporcionará una lista actualizada al comienzo del curso, pero las más habituales son:</p>
<ul>
<li><b>Registro de frecuencia cardíaca:</b> Polar Flow, Garmin Connect, HeartRate Monitor.</li>
<li><b>Registro de sueño:</b> Sleep Cycle, Pillow.</li>
<li><b>Registro de hidratación y nutrición:</b> MyFitnessPal, Yazio.</li>
<li><b>Percepción del esfuerzo (escala RPE):</b> diariamente con registro propio en plantilla proporcionada por el docente.</li>
</ul>
<div class="note">El uso de aplicaciones es voluntario y siempre respetuoso con la privacidad de los datos personales. Se trabajará en clase la interpretación crítica de estas herramientas y sus límites.</div>

<h3>9.6 Otros recursos</h3>
<ul>
<li><b>Material de aula:</b> pulsómetros, básculas de bioimpedancia, cronómetros, cintas métricas, foam rollers y bandas elásticas (disponibles en las instalaciones del Institut del Teatre).</li>
<li><b>Tutoría de nutrición:</b> sesión específica con nutricionista especializado/a en artes escénicas (11-dic-26).</li>
<li><b>Estudios de caso reales:</b> documentación proporcionada por el docente sobre casos profesionales de bailarines/as (anónimos y con consentimiento).</li>
</ul>

<h3>9.7 Criterios de selección bibliográfica</h3>
<p>La bibliografía se ha seleccionado siguiendo los siguientes criterios:</p>
<ol>
<li><b>Rigor científico:</b> todos los textos son publicados por editoriales académicas de prestigio o revistas con revisión por pares.</li>
<li><b>Actualización:</b> se priorizan publicaciones de los últimos 10 años, aunque se incluyen clásicos de referencia.</li>
<li><b>Especificidad para la danza:</b> se combinan textos generales de fisiología del ejercicio con publicaciones específicas de medicina y ciencia de la danza.</li>
<li><b>Diversidad lingüística:</b> se incluyen recursos en catalán, castellano e inglés, aunque el inglés es imprescindible para la literatura científica actual.</li>
<li><b>Accesibilidad:</b> todos los recursos están disponibles a través de la biblioteca del Institut del Teatre o son de acceso libre.</li>
</ol>`}
]},
