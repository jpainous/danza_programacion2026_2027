 p7_rows:[["programacio.html","Professora","Document marc: presentaci\u00f3 i consulta","Editar / Exportar / Imprimir"],["planificador.html","Professora","Pla de treball de cada sessi\u00f3","Exporta per a l'alumnat / Exporta c\u00f2pia"],["fitxa_alumne.html","Alumnat","Seguiment personal i entregues","Importar programa / Enviar a professora"],["manual-kit.html","Tots","Aquest manual d'ajuda","Imprimir / PDF"]],
 foot:"Manual del kit Fisiologia - programacio.html + planificador.html + fitxa_alumne.html"},
es:{
 t1:"Manual del kit",t2:"Fisiolog\u00eda aplicada a la danza - Institut del Teatre - Curso 2026-27",
 bPrint:"Imprimir / PDF",
 nav:["Visi\u00f3n general","1 Programaci\u00f3","2 Planificador","3 Intercambio JSON","4 Datos y nombres","5 Ficha alumnado","6 Flujos","7 Problemas","8 Referencia"],
 ov_t:"Visi\u00f3n general",
 ov_intro:"El kit lo forman <b>tres p\u00e1ginas web independientes</b> que trabajan juntas para gestionar la asignatura de Fisiolog\u00eda: el documento de programaci\u00f3n, el planificador de sesiones del profesorado y la ficha de seguimiento del alumnado. Todas funcionan <b>sin internet</b>, guardan los datos en el navegador y est\u00e1n disponibles en catal\u00e1n, castellano e ingl\u00e9s.",
 ov_chart:"Esquema de relaciones entre las tres herramientas",
 ov_chartNote:"Haz clic en cualquier caja para ir a su explicaci\u00f3n completa.",
 ov_n1t:"programacio.html",ov_n1r:"El documento marco (Plan C)",
 ov_n2t:"planificador.html",ov_n2r:"Planificaci\u00f3n semanal de sesiones",
 ov_n3t:"fitxa_alumne.html",ov_n3r:"Ficha de seguimiento del alumnado",
 ov_ex1:"&#11015; fitxa-alumne-dades.json<br>(el profesorado exporta el programa visible)",
 ov_ex2:"&#11014; fitxa-nom-alumne.json<br>(el alumnado env\u00eda su ficha trabajada)",
 ov_req:"Requisitos b\u00e1sicos",
 ov_reqL:["Navegador moderno (Chrome, Edge o Firefox).","Abrir los archivos con <b>doble clic</b> en el navegador, nunca desde vistas previas de otras aplicaciones (si no, aparece el banner amarillo de \u00abmodo memoria\u00bb).","Para la ficha del alumnado hace falta a mano el archivo JSON que genera el planificador."],
 ov_cardsT:"Las tres herramientas de un vistazo",
 c1t:"1 - programacio.html",c1b:"b-doc",c1who:"Documento de referencia",
 c1:["Programa did\u00e1ctico completo (Plan C, rev. 2).","Competencias, RA, cronograma, evaluaci\u00f3n...","Editable, triling\u00fce e imprimible."],
 c2t:"2 - planificador.html",c2b:"b-tea",c2who:"Herramienta del profesorado",
 c2:["14 sesiones prellenadas con objetivos.","Actividades, recursos, estados y visibilidades.","Exporta el programa para el alumnado."],
 c3t:"3 - fitxa_alumne.html",c3b:"b-stu",c3who:"Herramienta del alumnado",
 c3:["Datos personales y selector de sesi\u00f3n.","Estados y observaciones de cada actividad.","Control, log y env\u00edo a la profesora."],
 p1_t:"1 - programacio.html: la programaci\u00f3n (Plan C)",
 p1_what:"Es el <b>documento normativo</b> de la asignatura: datos identificativos, competencias (CG3, CECI 3) y resultados de aprendizaje, enfoque, eje global, contenidos con la correspondencia al temario oficial, cronograma, metodolog\u00eda y escritura manual, evaluaci\u00f3n, bibliograf\u00eda y anexos pendientes de concretar.",
 p1_feat:"Principales funciones",
 p1_rows:[["Idiomas","CA / ES / EN con un clic; el contenido escrito se mantiene \u00fanico."],["Editar","Bot\u00f3n \u00abEditar\u00bb: haz clic en cualquier texto o tabla y modif\u00edcalo."],["Guardar","Los cambios se guardan solos en el navegador, por idioma, tambi\u00e9n con el bot\u00f3n Guardar."],["Exportar","Genera <b>dos archivos</b>: copia de seguridad datada + <code>programacio-dades.json</code> (nombre fijo)."],["Importar","Restaura las ediciones desde cualquiera de los dos archivos exportados."],["Restaurar","Vuelve al contenido original del idioma activo."],["Imprimir / PDF","Versi\u00f3n limpia del documento para archivar o presentar."]],
 p1_tip:"Es el punto de partida: all\u00ed se deciden ponderaci\u00f3n, calendario y metodolog\u00eda, que despu\u00e9s se aplican al planificador. Si el departamento pide cambios, se editan aqu\u00ed primero.",
 p2_t:"2 - planificador.html: el planificador de sesiones",
 p2_what:"Cada viernes del curso es una <b>sesi\u00f3n editable</b>. Viene prellenado con las 14 sesiones (fechas y temas del calendario) y <b>objetivos orientativos</b> que se pueden modificar, borrar u ocultar.",
 p2_sess:"Dentro de cada sesi\u00f3n",
 p2_sessL:[["Objetivos","Texto libre; casilla de visibilidad para el alumnado."],["Actividades","Bot\u00f3n + para a\u00f1adir; descripci\u00f3n, horario (ej. 10:00-11:30), visibilidad y estado: Prevista / Hecha / En pausa / Descartada."],["Recursos online","Una l\u00ednea por recurso: t\u00edtulo + enlace https://"],["Medios audiovisuales","Una l\u00ednea por elemento (v\u00eddeo, presentaci\u00f3n...)."],["Trabajo complementario","Una l\u00ednea por tarea: cada l\u00ednea llega a la ficha como actividad fuera de aula."],["Evidencias","Qu\u00e9 se recoge de la sesi\u00f3n (cuaderno, registro...)."]],
 p2_counts:"La cabecera de cada sesi\u00f3n muestra recuentos autom\u00e1ticos: actividades totales y visibles, recursos, enlaces, medios A/V, trabajo complementario y evidencias.",
 p2_btns:"Botones de sesi\u00f3n y barra",
 p2_rows:[["&#9650; / &#9660;","Mueve la sesi\u00f3n arriba o abajo."],["&#10697;","Duplica la sesi\u00f3n entera como plantilla (recuerda cambiar la fecha)."],["&#128465;","Borra la sesi\u00f3n: hay que confirmar con un 2\u00ba clic."],["+ A\u00f1adir sesi\u00f3n","Crea una sesi\u00f3n vac\u00eda al final."],["Exportar para el alumnado","Genera <code>fitxa-alumne-dades.json</code> con solo el contenido visible."],["Exportar copia","Genera <b>dos archivos</b>: copia datada + <code>planificador-dades.json</code> (nombre fijo)."],["Importar copia","Restaura el plan desde el archivo datado o el de nombre fijo."],["Imprimir","Despliega todas las sesiones y abre la impresi\u00f3n."],["Filtro de estado","Muestra u oculta actividades seg\u00fan: prevista / hecha / en pausa / descartada."]],
 p2_tip:"Todo se guarda autom\u00e1ticamente mientras escribes. Las sesiones plegadas muestran el recuento, as\u00ed que puedes ver el estado del curso sin abrirlas.",
 p3_t:"El intercambio JSON: c\u00f3mo viaja la informaci\u00f3n",
 p3_steps:["En el planificador, marca con la casilla de visibilidad todo lo que el alumnado debe ver.","Pulsa \u00abExportar para el alumnado\u00bb: se genera <code>fitxa-alumne-dades.json</code> (las actividades descartadas se excluyen autom\u00e1ticamente).","Env\u00eda el archivo al alumnado por correo o por el campus.","En la ficha, el alumno pulsa \u00abImportar programa\u00bb y elige el archivo.","La importaci\u00f3n se hace <b>por fecha</b>: se actualiza el contenido del profesorado y <b>se conservan</b> las marcas y notas del alumno.","Cada vez que actualices el planificador, repite los pasos 2 y 5: nunca se pierde el trabajo del alumno."],
 p3_note:"En el otro sentido, el bot\u00f3n \u00abEnviar a profesora\u00bb de la ficha genera un archivo de entrega con estados, observaciones y log, y abre el correo preparado hacia la profesora.",
 n4_t:"4 - D\u00f3nde se guardan los datos y nombres de los archivos",
 n4_intro:"Los datos <b>no se guardan en los archivos .html</b> ni en ning\u00fan archivo JS: se guardan <b>dentro del navegador</b> de cada ordenador (almacenamiento local, localStorage), bajo unas <b>claves internas</b> fijas de cada programa. Los archivos JSON que se exportan sirven para hacer copias de seguridad y <b>llevar el trabajo a otro ordenador o navegador</b>, donde se importan con el bot\u00f3n de importaci\u00f3n de cada programa.",
 n4_keysT:"Claves internas de guardado (localStorage)",
 n4_h1:"Programa (nombre fijo)",n4_h2:"Claves internas",n4_h3:"Qu\u00e9 guardan",
 n4_keys:[["programacio.html","fisiodanza_plaC_r2_lang \u00b7 fisiodanza_plaC_r2_overrides","Idioma activo y ediciones de contenido, por idioma"],["planificador.html","planificador_celia_v5 \u00b7 planificador_celia_v5L","Plan completo de sesiones e idioma activo"],["fitxa_alumne.html","fitxa_alumne_prog_v6 \u00b7 fitxa_alumne_me_v6 \u00b7 fa_lang","Programa importado, trabajo del alumno (datos, estados, notas, log) e idioma"],["manual-kit.html","manual_lang","Idioma del manual"]],
 n4_keysNote:"Estas claves son internas: <b>no hay que tocarlas nunca</b>. Solo indican d\u00f3nde vive cada cosa dentro del navegador (para verlas o borrarlas del todo: F12 \u2192 Application \u2192 Local Storage). El nombre que tenga el archivo .html no afecta al guardado.",
 n4_namesT:"Nombres fijos de los archivos JSON",
 n4_names:[["fitxa-alumne-dades.json","planificador \u2192 \u00abExportar para el alumnado\u00bb","Programa visible, para importar en la ficha del alumnado"],["planificador-dades.json","planificador \u2192 \u00abExportar copia\u00bb","Plan completo de trabajo del profesorado"],["programacio-dades.json","programacio \u2192 \u00abExportar cambios\u00bb","Ediciones del documento de programaci\u00f3n"],["fitxa-alumne-copia.json","fitxa \u2192 \u00abCopia de seguridad\u00bb","Todo: programa importado + trabajo del alumno"],["fitxa-NOMBRE-CURSO.json","fitxa \u2192 \u00abEnviar a profesora\u00bb","Entrega personalizada del alumno (nombre libre, con su nombre)"]],
 n4_ruleT:"La regla de oro al guardar",
 n4_rule:"Al pulsar cualquier bot\u00f3n de guardado o copia, la aplicaci\u00f3n genera <b>SIEMPRE dos archivos, en este orden</b>:<br><b>1\u00ba</b> la copia de seguridad datada <code>&lt;programa&gt;-seguretat-AAAA-MM-DD-HHMM.json</code> del estado actual (cada vez crea una nueva, no sobrescribe nada: es tu historial);<br><b>2\u00ba</b> el <b>archivo de trabajo con nombre fijo</b> (<code>planificador-dades.json</code>, <code>fitxa-alumne-copia.json</code> o <code>programacio-dades.json</code>), que es la \u00faltima versi\u00f3n y el que se lleva a otros ordenadores o navegadores.",
 n4_flowT:"Trabajar en otro ordenador o navegador",
 n4_flow:["En el ordenador de origen, pulsa el bot\u00f3n de copia: se descargan la copia de seguridad datada y el archivo de nombre fijo.","Env\u00edate el <b>archivo de nombre fijo</b> (correo, USB o campus): es la \u00faltima versi\u00f3n.","En el destino, abre el mismo programa e importa el archivo con su bot\u00f3n de importaci\u00f3n.","Conserva las copias datadas: si algo va mal, importa la de la fecha anterior y vuelves atr\u00e1s."],
 n4_warn:"<b>No renombres nunca los archivos de nombre fijo</b>: trabajar siempre con el mismo nombre hace que la importaci\u00f3n sea directa y que sepas siempre cu\u00e1l es el archivo actual. Las fechas de las copias de seguridad ya distinguen las versiones antiguas.",
 p4_t:"5 - fitxa_alumne.html: la ficha del alumnado",
 p4_what:"La ficha personal de seguimiento. Empieza vac\u00eda: lo primero es <b>importar el programa</b> del planificador.",
 p4_sec:"Estructura (7 apartados)",
 p4_secL:[["1. Datos personales","Nombre, email, fecha de inicio, correo de la profesora (prellenado) y curso."],["2. Sesi\u00f3n de trabajo","Men\u00fa con todas las sesiones; al elegir una se abre el panel de trabajo."],["3. Actividades presenciales","Cada actividad con estado (Hecha / Pendiente / No hecha) y su campo de observaciones."],["4. Actividades fuera de horario","Cada tarea del trabajo complementario con estado (S\u00ed, completa / S\u00ed, parcial / Pendiente / No hecha) y observaciones."],["5. Observaciones generales","Qu\u00e9 he aprendido, dudas, incidencias de la sesi\u00f3n."],["6. Control","Recuentos de la sesi\u00f3n y resumen de todo el curso (total, hechas, porcentaje)."],["7. Log de acciones","Registro autom\u00e1tico: apertura, selecciones, cambios de estado, importaciones, env\u00edos..."]],
 p4_btns:"Botones de la barra",
 p4_rows:[["Guardar ficha","Guarda todo (adem\u00e1s, se guarda solo continuamente)."],["Imprimir PDF","Versi\u00f3n limpia de la ficha para imprimir o archivar."],["Enviar a profesora","Genera el archivo de entrega y abre el correo con el asunto escrito: solo hay que adjuntar el archivo."],["Importar programa","Carga o actualiza el JSON del planificador sin perder nada."],["Copia de seguridad","Genera <b>dos archivos</b>: copia datada + <code>fitxa-alumne-copia.json</code> (nombre fijo, todo incluido)."],["Limpiar log","Borra el registro de acciones (confirmaci\u00f3n con 2\u00ba clic)."],["Reiniciar ficha","Acci\u00f3n protegida: hay que escribir la palabra REINICIA; opcionalmente mantiene los datos personales."]],
 p5_t:"Flujos de trabajo t\u00edpicos",
 p5_w1:"Profesora: preparar la semana",
 p5_w1l:["Abre el planificador y despliega la sesi\u00f3n del viernes.","Ajusta objetivos, actividades, recursos y medios.","Marca las visibilidades del alumnado.","\u00abExportar para el alumnado\u00bb y env\u00eda el JSON.","Despu\u00e9s de clase: pasa actividades a \u00abHecha\u00bb y, si hace falta, vuelve a exportar."],
 p5_w2:"Alumno: semana tipo",
 p5_w2l:["Importa el JSON nuevo (\u00abImportar programa\u00bb): no pierdes nada de lo anterior.","En la sesi\u00f3n correspondiente, marca estados y escribe observaciones.","Rellena las observaciones generales.","\u00abEnviar a profesora\u00bb cuando toque (archivo + correo)."],
 p5_w3:"Inicio de curso, cambios o nuevo ordenador",
 p5_w3l:["Edita la programaci\u00f3n (programacio.html) y guarda.","Traslada los cambios al planificador (fechas, temas, objetivos).","Haz la primera exportaci\u00f3n y comp\u00e1rtela con el alumnado.","Para cambiar de ordenador o navegador: copia de nombre fijo + importar en el destino (v\u00e9ase la secci\u00f3n 4)."],
 p6_t:"Problemas frecuentes",
 p6_rows:[["Aparece el banner amarillo \u00abModo memoria\u00bb","El archivo se abri\u00f3 desde una vista previa. Ci\u00e9rralo y \u00e1brelo con doble clic en el navegador."],["En la ficha no sale ninguna sesi\u00f3n","Todav\u00eda no se ha importado el JSON del planificador: pulsa \u00abImportar programa\u00bb."],["\u00abJSON no valid\u00bb al importar","El archivo es equivocado o se da\u00f1\u00f3 en el env\u00edo; p\u00eddelo de nuevo."],["Solo se descarga uno de los dos archivos","El navegador puede bloquear descargas m\u00faltiples: perm\u00edtelas (icono en la barra de direcciones) o vuelve a pulsar el bot\u00f3n."],["Cambio de ordenador o de navegador","Planificador: \u00abExportar copia\u00bb y en el destino \u00abImportar copia\u00bb con el archivo <code>planificador-dades.json</code>. Ficha: \u00abCopia de seguridad\u00bb e importa <code>fitxa-alumne-copia.json</code>."],["He borrado algo por error","Restaura la \u00faltima copia de seguridad datada (importa el archivo seguretat de la fecha anterior)."],["Cambio de idioma y el contenido es igual","Es normal: la interfaz es triling\u00fce y el contenido escrito es \u00fanico, para evitar triple mantenimiento."]],
 p7_t:"8 - Referencia r\u00e1pida",
 p7_c1:"Web",p7_c2:"Qui\u00e9n",p7_c3:"Para qu\u00e9",p7_c4:"Botones clave",
 p7_rows:[["programacio.html","Profesora","Documento marco: presentaci\u00f3n y consulta","Editar / Exportar / Imprimir"],["planificador.html","Profesora","Plan de trabajo de cada sesi\u00f3n","Exportar para el alumnado / Exportar copia"],["fitxa_alumne.html","Alumnado","Seguimiento personal y entregas","Importar programa / Enviar a profesora"],["manual-kit.html","Todos","Este manual de ayuda","Imprimir / PDF"]],
 foot:"Manual del kit Fisiolog\u00eda - programacio.html + planificador.html + fitxa_alumne.html"},
en:{
 t1:"Toolkit manual",t2:"Physiology Applied to Dance - Institut del Teatre - Academic year 2026-27",
 bPrint:"Print / PDF",
 nav:["Overview","1 Programme","2 Planner","3 JSON exchange","4 Data & names","5 Student sheet","6 Workflows","7 Issues","8 Quick reference"],
 ov_t:"Overview",
 ov_intro:"The toolkit consists of <b>three independent web pages</b> that work together to manage the Physiology course: the teaching programme document, the staff session planner and the student tracking sheet. All of them work <b>offline</b>, save data in the browser and are available in Catalan, Spanish and English.",
 ov_chart:"How the three tools relate",
 ov_chartNote:"Click any box to jump to its full explanation.",
 ov_n1t:"programacio.html",ov_n1r:"The framework document (Plan C)",
 ov_n2t:"planificador.html",ov_n2r:"Weekly session planning",
 ov_n3t:"fitxa_alumne.html",ov_n3r:"Student tracking sheet",
 ov_ex1:"&#11015; fitxa-alumne-dades.json<br>(staff export the visible programme)",
 ov_ex2:"&#11014; fitxa-name.json<br>(students send back their worked sheet)",
 ov_req:"Basic requirements",
 ov_reqL:["A modern browser (Chrome, Edge or Firefox).","Open the files by <b>double-clicking</b> them in the browser, never from other apps' previews (otherwise the yellow \u201cmemory mode\u201d banner appears).","For the student sheet, keep at hand the JSON file generated by the planner."],
 ov_cardsT:"The three tools at a glance",
 c1t:"1 - programacio.html",c1b:"b-doc",c1who:"Reference document",
 c1:["Full didactic programme (Plan C, rev. 2).","Competences, LOs, schedule, assessment...","Editable, trilingual, printable."],
 c2t:"2 - planificador.html",c2b:"b-tea",c2who:"Staff tool",
 c2:["14 pre-filled sessions with objectives.","Activities, resources, statuses, visibility.","Exports the programme for students."],
 c3t:"3 - fitxa_alumne.html",c3b:"b-stu",c3who:"Student tool",
 c3:["Personal data and session selector.","Status and observations per activity.","Course control, log and send-to-teacher."],
 p1_t:"1 - programacio.html: the programme (Plan C)",
 p1_what:"The <b>normative document</b> of the subject: identification data, competences (GC3, CECI 3) and learning outcomes, approach, core project, contents mapped to the official syllabus, schedule, methodology and handwriting, assessment, bibliography and annexes pending specification.",
 p1_feat:"Main features",
 p1_rows:[["Languages","CA / ES / EN with one click; written content stays single-sourced."],["Edit","\u201cEdit\u201d button: click any text or table and modify it."],["Save","Changes auto-save in the browser, per language, also via the Save button."],["Export","Generates <b>two files</b>: dated backup + <code>programacio-dades.json</code> (fixed name)."],["Import","Restores edits from either exported file."],["Restore","Returns to the original content of the active language."],["Print / PDF","Clean version of the document to file or present."]],
 p1_tip:"This is the starting point: weighting, calendar and methodology are decided here and then applied in the planner. If the department requests changes, edit them here first.",
 p2_t:"2 - planificador.html: the session planner",
 p2_what:"Every Friday of the course is an <b>editable session</b>. It comes pre-filled with the 14 sessions (calendar dates and topics) and <b>guiding objectives</b> that can be modified, deleted or hidden.",
 p2_sess:"Inside each session",
 p2_sessL:[["Objectives","Free text; visibility checkbox for students."],["Activities","\u201c+\u201d button to add; description, time slot (e.g. 10:00-11:30), visibility and status: Planned / Done / On hold / Discarded."],["Online resources","One line per resource: title + https:// link."],["Audiovisual media","One line per item (video, slides...)."],["Complementary work","One line per task: each line reaches the sheet as an out-of-class activity."],["Evidence","What is collected from the session (notebook, record...)."]],
 p2_counts:"Each session header shows automatic counts: total and visible activities, resources, links, A/V media, complementary work and evidence.",
 p2_btns:"Session and toolbar buttons",
 p2_rows:[["&#9650; / &#9660;","Moves the session up or down."],["&#10697;","Duplicates the whole session as a template (remember to change the date)."],["&#128465;","Deletes the session: confirm with a 2nd click."],["+ Add session","Creates an empty session at the end."],["Export for students","Generates <code>fitxa-alumne-dades.json</code> with only the visible content."],["Export backup","Generates <b>two files</b>: dated copy + <code>planificador-dades.json</code> (fixed name)."],["Import backup","Restores the plan from the dated file or the fixed-name one."],["Print","Expands all sessions and opens printing."],["Status filter","Shows or hides activities by: planned / done / on hold / discarded."]],
 p2_tip:"Everything saves automatically as you type. Collapsed sessions show their counts, so you can see the state of the course without opening them.",
 p3_t:"The JSON exchange: how information travels",
 p3_steps:["In the planner, tick the visibility checkbox on everything students should see.","Press \u201cExport for students\u201d: <code>fitxa-alumne-dades.json</code> is generated (discarded activities are excluded automatically).","Send the file to students by email or campus.","On the sheet, the student presses \u201cImport programme\u201d and picks the file.","The import merges <b>by date</b>: staff content is updated and the student's marks and notes are <b>kept</b>.","Every time you update the planner, repeat steps 2 and 5: student work is never lost."],
 p3_note:"In the other direction, the sheet's \u201cSend to teacher\u201d button generates a delivery file with statuses, observations and log, and opens a pre-written email to the teacher.",
 n4_t:"4 - Where data is stored and file names",
 n4_intro:"Data is <b>not stored in the .html files</b> nor in any JS file: it is stored <b>inside each computer's browser</b> (local storage), under fixed <b>internal keys</b> belonging to each program. The exported JSON files are for backups and for <b>carrying your work to another computer or browser</b>, where it is imported with each program's import button.",
 n4_keysT:"Internal storage keys (localStorage)",
 n4_h1:"Program (fixed name)",n4_h2:"Internal keys",n4_h3:"What they store",
 n4_keys:[["programacio.html","fisiodanza_plaC_r2_lang \u00b7 fisiodanza_plaC_r2_overrides","Active language and per-language content edits"],["planificador.html","planificador_celia_v5 \u00b7 planificador_celia_v5L","Full session plan and active language"],["fitxa_alumne.html","fitxa_alumne_prog_v6 \u00b7 fitxa_alumne_me_v6 \u00b7 fa_lang","Imported programme, student work (data, statuses, notes, log) and language"],["manual-kit.html","manual_lang","Manual language"]],
 n4_keysNote:"These keys are internal: <b>they never need touching</b>. They only show where each thing lives inside the browser (to view or fully clear them: F12 \u2192 Application \u2192 Local Storage). The .html file's name does not affect saving.",
 n4_namesT:"Fixed names of the JSON files",

var lang=ST.getItem('manual_lang')||'ca';
function $(id){return document.getElementById(id);}
function t(k){return (I18N[lang]&&I18N[lang][k])?I18N[lang][k]:k;}
function ul(arr){var h='<ul>',i;for(i=0;i<arr.length;i++)h+='<li>'+arr[i]+'</li>';return h+'</ul>';}
function ol(arr){var h='<ol>',i;for(i=0;i<arr.length;i++)h+='<li>'+arr[i]+'</li>';return h+'</ol>';}
function miniList(arr){var h='<ul>',i;for(i=0;i<arr.length;i++)h+='<li><b>'+arr[i][0]+':</b> '+arr[i][1]+'</li>';return h+'</ul>';}
function tbl2(rows){var h='<table><tbody>',i;for(i=0;i<rows.length;i++)h+='<tr><td style="width:34%"><b>'+rows[i][0]+'</b></td><td>'+rows[i][1]+'</td></tr>';return h+'</tbody></table>';}
function tbl3(rows,h1,h2,h3){var h='<table><thead><tr><th>'+h1+'</th><th>'+h2+'</th><th>'+h3+'</th></tr></thead><tbody>',i;for(i=0;i<rows.length;i++)h+='<tr><td><b>'+rows[i][0]+'</b></td><td>'+rows[i][1]+'</td><td>'+rows[i][2]+'</td></tr>';return h+'</tbody></table>';}
function tbl4(rows){var h='<table><thead><tr><th>'+t('p7_c1')+'</th><th>'+t('p7_c2')+'</th><th>'+t('p7_c3')+'</th><th>'+t('p7_c4')+'</th></tr></thead><tbody>',i;for(i=0;i<rows.length;i++)h+='<tr><td><b>'+rows[i][0]+'</b></td><td>'+rows[i][1]+'</td><td>'+rows[i][2]+'</td><td>'+rows[i][3]+'</td></tr>';return h+'</tbody></table>';}

 h+='<h3>'+t('n4_keysT')+'</h3>'+tbl3(t('n4_keys'),t('n4_h1'),t('n4_h2'),t('n4_h3'));

 $('main').innerHTML=h;
 $('t1').textContent=t('t1');
 $('t2').textContent=t('t2');
 $('bPrint').textContent=t('bPrint');
 var nv=t('nav'),i,anchors=['sec-0','sec-1','sec-2','sec-3','sec-4','sec-5','sec-6','sec-7','sec-8'],nh='';
 for(i=0;i<nv.length&&i<anchors.length;i++)nh+='<a href="#'+anchors[i]+'">'+nv[i]+'</a>';

 var bs=document.querySelectorAll('#langBox button');
 for(i=0;i<bs.length;i++)bs[i].className=(bs[i].getAttribute('data-lang')===lang)?'on':'';
}
 $('langBox').addEventListener('click',function(e){
 var b=e.target;
 while(b&&b.tagName!=='BUTTON')b=b.parentNode;
 if(!b||!b.getAttribute('data-lang'))return;
 lang=b.getAttribute('data-lang');
 ST.setItem('manual_lang',lang);
 render();
});
 $('bPrint').onclick=function(){window.print();};
render();
</script>
