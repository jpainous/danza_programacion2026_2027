/* ================== UTILITATS ================== */
function $(id){return document.getElementById(id);}
function t(k){
 var s=(I18N[lang]&&I18N[lang][k])?I18N[lang][k]:k;
 s=s.replace('RESET-WORD',I18N[lang]?I18N[lang].resetWord:'REINICIA');
 var d=document.createElement('div');d.innerHTML=s;return d.textContent;
}
function esc(s){s=(s==null)?'':String(s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function linkify(s){return esc(s).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');}
function nowISO(){return new Date().toISOString();}
function clock(){var d=new Date(),p=function(n){return (n<10?'0':'')+n;};return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());}
function fmtD(iso){if(!iso)return '-';var p=String(iso).split('-');if(p.length<3)return String(iso);return p[2]+'/'+p[1]+'/'+p[0];}

function log(a,d){
 me.log.push({ts:nowISO(),a:a,d:d||''});
 if(me.log.length>300)me.log=me.log.slice(me.log.length-300);
}
function save(silent){
 try{ST.setItem(KM,JSON.stringify(me));}catch(e){}
 if(prog)try{ST.setItem(KP,JSON.stringify(prog));}catch(e){}
 var el=$('savestate');
 if(el)el.textContent=t('saved')+' '+clock();
 if(!silent)renderLog();
}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(function(){save(true);},500);}
window.onbeforeunload=function(){save(true);};
function toast(m){var x=$('toast');x.textContent=m;x.className='show';clearTimeout(x._t);x._t=setTimeout(function(){x.className='';},3200);}

/* ================== SESSIONS ================== */
function sorted(){
 if(!prog||!prog.sessions)return [];
 var ss=prog.sessions.slice(0);
 ss.sort(function(a,b){return (a.date||'9999')<(b.date||'9999')?-1:1;});
 return ss;
}
function findSes(date){
 var ss=sorted(),i;
 for(i=0;i<ss.length;i++)if((ss[i].date||'')===date)return ss[i];
 return null;
}
function actKey(date,txt,i){
 if(txt&&txt.replace(/\s/g,''))return date+'|'+txt;
 return date+'|@|'+i;
}
function compLines(s){
 if(!s.comp)return [];
 var raw=s.comp.split('\n'),out=[],i,l;
 for(i=0;i<raw.length;i++){l=raw[i].replace(/^\s*[-*\u2022]\s*/,'').replace(/\s+$/,'');if(l)out.push(l);}
 return out;
}

/* ================== RENDER: PROFILE ================== */

 var p=me.profile;
 return '<section class="card"><h2>'+t('sData')+'</h2>'
 +'<div class="grid2">'
 +'<label class="fld"><span>'+t('sName')+'</span><input type="text" id="pName" value="'+esc(p.name)+'"></label>'
 +'<label class="fld"><span>'+t('sMail')+'</span><input type="email" id="pMail" value="'+esc(p.email)+'"></label>'
 +'<label class="fld"><span>'+t('sStart')+'</span><input type="date" id="pStart" value="'+esc(p.start)+'"></label>'
 +'<label class="fld"><span>'+t('sTeach')+'</span><input type="email" id="pTeach" value="'+esc(p.teacher)+'"></label>'
 +'<label class="fld"><span>'+t('sCourse')+'</span><input type="text" id="pCourse" value="'+esc(p.course)+'"></label>'
 +'</div></section>';
}

/* ================== RENDER: SELECTOR ================== */
function selectorHTML(){
 var ss=sorted(),h='',i,s;
 h+='<section class="card"><h2>'+t('sSel')+'</h2><div class="selrow"><label class="fld"><span>'+t('sSel')+'</span>';
 h+='<select id="selSes"><option value="">'+t('pick')+'</option>';
 for(i=0;i<ss.length;i++){
  s=ss[i];
  h+='<option value="'+esc(s.date||'')+'"'+((me.lastSes===(s.date||''))?' selected':'')+'>'
   +fmtD(s.date)+' - '+esc(s.topic||'')+(s.noLectiva?' ('+t('noData')+')':'')+'</option>';
 }

/* ================== RENDER: PANELL DE SESSIO ================== */
function infoHTML(s){
 var h='',i;
 if(s.obj){h+='<h3>'+t('sObj')+'</h3><div class="info"><p>'+esc(s.obj)+'</p></div>';}
 if(s.res&&s.res.length){h+='<h3>'+t('sRes')+'</h3><div class="info"><ul>';for(i=0;i<s.res.length;i++)h+='<li>'+linkify(s.res[i].txt)+'</li>';h+='</ul></div>';}
 if(s.av&&s.av.length){h+='<h3>'+t('sAv')+'</h3><div class="info"><ul>';for(i=0;i<s.av.length;i++)h+='<li>'+linkify(s.av[i].txt)+'</li>';h+='</ul></div>';}
 if(s.ev){h+='<h3>'+t('sEv')+'</h3><div class="info"><p>'+esc(s.ev)+'</p></div>';}
 return h;
}
function actHTML(s){
 var h='',i,a,k,st,cls,stSel;
 if(!s.acts||!s.acts.length)return '<p class="hint">'+t('noActs')+'</p>';
 for(i=0;i<s.acts.length;i++){
  a=s.acts[i];
  k=actKey(s.date,a.txt,i);
  st=me.done[k]||'';
  cls=st?('st-'+st):'';
  stSel='<select data-ak="'+esc(k)+'">'
   +'<option value=""'+(st===''?' selected':'')+'>'+t('stEmpty')+'</option>'
   +'<option value="done"'+(st==='done'?' selected':'')+'>'+t('stDone')+'</option>'
   +'<option value="pend"'+(st==='pend'?' selected':'')+'>'+t('stPend')+'</option>'
   +'<option value="nof"'+(st==='nof'?' selected':'')+'>'+t('stNof')+'</option>'
   +'</select>';
  h+='<div class="actbox '+cls+'"><div class="top">'
   +'<span class="tm">'+esc(a.time||'')+'</span><span class="tx">'+esc(a.txt)+'</span>'+stSel
   +'</div><textarea data-an="'+esc(k)+'" placeholder="'+t('phActObs')+'">'+esc(me.actNotes[k]||'')+'</textarea></div>';
 }
 return h;
}
function compHTML(s){
 var lines=compLines(s),h='',i,l,k,st,cls,stSel;
 if(!lines.length)return '<p class="hint">'+t('noComp')+'</p>';
 for(i=0;i<lines.length;i++){
  l=lines[i];
  k=(s.date||'')+'|c|'+i;
  st=me.compStatus[k]||'';
  cls=st?('st-'+st):'';
  stSel='<select data-ck="'+esc(k)+'">'
   +'<option value=""'+(st===''?' selected':'')+'>'+t('stEmpty')+'</option>'
   +'<option value="full"'+(st==='full'?' selected':'')+'>'+t('ctFull')+'</option>'
   +'<option value="partial"'+(st==='partial'?' selected':'')+'>'+t('ctPartial')+'</option>'
   +'<option value="pend"'+(st==='pend'?' selected':'')+'>'+t('ctPend')+'</option>'
   +'<option value="nof"'+(st==='nof'?' selected':'')+'>'+t('ctNof')+'</option>'
   +'</select>';
  h+='<div class="actbox '+cls+'"><div class="top"><span class="tx">'+esc(l)+'</span>'+stSel+'</div>'
   +'<textarea data-cn="'+esc(k)+'" placeholder="'+t('phCompObs')+'">'+esc(me.compNotes[k]||'')+'</textarea></div>';
 }
 return h;
}
function statsHTML(s){
 var i,done=0,pend=0,nof=0,n=(s.acts?s.acts.length:0),k,st;
 for(i=0;i<n;i++){k=actKey(s.date,s.acts[i].txt,i);st=me.done[k]||'';
  if(st==='done')done++;else if(st==='pend')pend++;else if(st==='nof')nof++;}
 var cd=0,cp=0,cn=0,lines=compLines(s),ck,cst;
 for(i=0;i<lines.length;i++){ck=(s.date||'')+'|c|'+i;cst=me.compStatus[ck]||'';
  if(cst==='full')cd++;else if(cst==='partial')cp++;else if(cst==='nof')cn++;}
 return '<div class="stats">'
 +'<span class="stat">'+t('pres')+': <b>'+n+'</b></span>'
 +'<span class="stat">'+t('done')+': <b>'+done+'</b></span>'
 +'<span class="stat">'+t('pend')+': <b>'+pend+'</b></span>'
 +'<span class="stat">'+t('nof')+': <b>'+nof+'</b></span>'
 +'<span class="stat">'+t('comp')+': <b>'+lines.length+'</b></span>'
 +'<span class="stat">'+t('full')+': <b>'+cd+'</b></span>'
 +'<span class="stat">'+t('partial')+': <b>'+cp+'</b></span>'
 +'</div>';
}
function globalStatsHTML(){
 var ss=sorted(),tot=0,dn=0,i,j,s,k,st,lines,ck,cst;
 for(i=0;i<ss.length;i++){
  s=ss[i];
  for(j=0;j<(s.acts||[]).length;j++){tot++;k=actKey(s.date,s.acts[j].txt,j);st=me.done[k]||'';if(st==='done')dn++;}
  lines=compLines(s);
  for(j=0;j<lines.length;j++){tot++;ck=(s.date||'')+'|c|'+j;cst=me.compStatus[ck]||'';if(cst==='full'||cst==='partial')dn++;}
 }
 var pc=tot?Math.round(dn*100/tot):0;
 return '<div class="stats">'
 +'<span class="stat">'+t('total')+': <b>'+tot+'</b></span>'
 +'<span class="stat">'+t('done')+': <b>'+dn+'</b></span>'
 +'<span class="stat">'+pc+'%</span>'
 +'</div>';
}
function sessPanelHTML(s){
 var h='<h3>'+t('sInfo')+'</h3>';
 h+=infoHTML(s);
 h+='<h3>'+t('sActs')+'</h3>'+actHTML(s);
 h+='<h3>'+t('sComp')+'</h3>'+compHTML(s);
 h+='<h3>'+t('sGen')+'</h3><textarea data-gn="'+esc(s.date||'')+'" rows="3" placeholder="'+t('phGen')+'">'+esc(me.genNotes[s.date]||'')+'</textarea>';
 h+='<h3>'+t('sCtrl')+'</h3>'+statsHTML(s);
 h+='<div class="btnrow"><button type="button" class="btn mini" onclick="window.print()">'+t('bPrint')+'</button></div>';
 return h;
}

/* ================== RENDER: LOG ================== */
function logHTML(){
 var h='<section class="card"><h2>'+t('sLog')+'</h2><div id="logbox">',i,e,dsc;
 for(i=me.log.length-1;i>=0;i--){
  e=me.log[i];
  dsc=(I18N[lang]&&I18N[lang][e.a])?I18N[lang][e.a]:e.a;
  var d=new Date(e.ts),p=function(n){return (n<10?'0':'')+n;};
  h+='<div><span class="lg-t">'+p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'</span> - '+esc(dsc)+(e.d?(' - '+esc(e.d)):'')+'</div>';
 }
 h+='</div></section>';
 return h;
}

/* ================== RENDER GLOBAL ================== */
function render(){
 var ss=sorted(),s=findSes(me.lastSes),h='';
 h+=profileHTML();
 h+=selectorHTML();
 if(prog&&ss.length){
  if(s){
   h+='<section class="card" id="spanel"><h2>'+fmtD(s.date)+' <small>'+esc(s.topic||'')+'</small>'+(s.noLectiva?'<span class="nlb">-</span>':'')+'</h2>'+sessPanelHTML(s)+'</section>';
   h+='<section class="card"><h2>'+t('statsAll')+'</h2>'+globalStatsHTML()+'</section>';
  }
 }else if(!prog){
  h+='<div class="hint">'+t('noProg')+'</div>';
 }
 h+=logHTML();
 $('main').innerHTML=h;
}

/* ================== LOG VISIBLE EN CANVI DE SESSIO ================== */
function renderLog(){
 var box=$('logbox');
 if(!box)return;
 var h='',i,e,dsc;
 for(i=me.log.length-1;i>=0;i--){
  e=me.log[i];
  dsc=(I18N[lang]&&I18N[lang][e.a])?I18N[lang][e.a]:e.a;
  var d=new Date(e.ts),p=function(n){return (n<10?'0':'')+n;};
  h+='<div><span class="lg-t">'+p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'</span> - '+esc(dsc)+(e.d?(' - '+esc(e.d)):'')+'</div>';
 }
 box.innerHTML=h;
}

/* ================== ESDEVENIMENTS ================== */
 $('main').addEventListener('input',function(e){
 var el=e.target,old;
 if(el.id==='pName'||el.id==='pMail'||el.id==='pStart'||el.id==='pTeach'||el.id==='pCourse'){
  var map={pName:'name',pMail:'email',pStart:'start',pTeach:'teacher',pCourse:'course'};
  me.profile[map[el.id]]=el.value;
  log('L_PROF',me.profile.name||'');
  scheduleSave();return;
 }
 var ak=el.getAttribute?el.getAttribute('data-ak'):null;
 if(ak!==null){me.actNotes[ak]=el.value;log('L_ACTNOTE');scheduleSave();return;}
 var an=el.getAttribute?el.getAttribute('data-an'):null;
 if(an!==null){me.actNotes[an]=el.value;log('L_ACTNOTE');scheduleSave();return;}
 var ck=el.getAttribute?el.getAttribute('data-ck'):null;
 if(ck!==null){me.compNotes[ck]=el.value;log('L_COMPNOTE');scheduleSave();return;}
 var cn=el.getAttribute?el.getAttribute('data-cn'):null;
 if(cn!==null){me.compNotes[cn]=el.value;log('L_COMPNOTE');scheduleSave();return;}
 var gn=el.getAttribute?el.getAttribute('data-gn'):null;
 if(gn!==null){me.genNotes[gn]=el.value;log('L_GENNOTE');scheduleSave();return;}
});
 $('main').addEventListener('change',function(e){
 var el=e.target;
 if(el.id==='selSes'){
  me.lastSes=el.value||'';
  var s=findSes(me.lastSes);
  log('L_SEL',s?(fmtD(s.date)+' '+ (s.topic||'')):'');
  save(true);render();return;
 }
 var ak=el.getAttribute?el.getAttribute('data-ak'):null;
 if(ak!==null){
  old=me.done[ak]||'';
  me.done[ak]=el.value;
  log('L_ACTST',(old||'-')+' > '+(el.value||'-'));
  if(me.lastSes){var s=findSes(me.lastSes);if(s){var sp=document.getElementById('spanel');if(sp&&s){sp.innerHTML='<h2>'+fmtD(s.date)+' <small>'+esc(s.topic||'')+'</small></h2>'+sessPanelHTML(s);}}}
  scheduleSave();return;
 }
 var ck=el.getAttribute?el.getAttribute('data-ck'):null;
 if(ck!==null){
  old=me.compStatus[ck]||'';
  me.compStatus[ck]=el.value;
  log('L_COMPST',(old||'-')+' > '+(el.value||'-'));
  var s2=findSes(me.lastSes);
  if(s2){var sp2=document.getElementById('spanel');if(sp2){sp2.innerHTML='<h2>'+fmtD(s2.date)+' <small>'+esc(s2.topic||'')+'</small></h2>'+sessPanelHTML(s2);}}
  scheduleSave();return;
 }
});

/* ================== IMPORTACIO CONTROLADA ================== */
function mergeProgram(inc){
 var existing={},i,j,nNew=0,nUpd=0;
 if(!prog)prog={sessions:[]};
 for(i=0;i<prog.sessions.length;i++)existing[prog.sessions[i].date||'']=i;
 for(i=0;i<inc.sessions.length;i++){
  var s=inc.sessions[i],key=s.date||'';
  s.noLectiva=!!s.noLectiva;
  if(!s.acts)s.acts=[];
  for(j=0;j<s.acts.length;j++){if(!s.acts[j].txt)s.acts[j].txt='';}
  if(existing[key]!==undefined){prog.sessions[existing[key]]=s;nUpd++;}
  else{prog.sessions.push(s);nNew++;}
 }
 prog.sessions.sort(function(a,b){return (a.date||'9999')<(b.date||'9999')?-1:1;});
 return nNew+' '+t('sessNew')+' / '+nUpd+' '+t('sessUpd');
}
function handleFile(f){
 var r=new FileReader();
 r.onload=function(ev){
  try{
   var j=JSON.parse(ev.target.result);
   if(j&&j.app==='fitxa-alumne'&&j.sessions){
    var res=mergeProgram(j);
    log('L_IMPPROG',res);
    save(true);render();
    toast(t('importOk')+' '+res);
   }else if(j&&j.app==='fitxa-alumne-backup'&&j.me){
    prog=j.prog||null;me=j.me;
    if(!me.profile)me.profile={name:'',email:'',start:'',teacher:'cpainous@institutdelteatre.cat',course:'2026-2027'};
    log('L_IMPBAK');save(true);render();toast(t('importOk'));
   }else{toast('JSON no valid');}
  }catch(x){toast('JSON no valid');}
 };
 r.readAsText(f);
}
 $('fImp').onchange=function(e){
 var f=e.target.files[0];
 if(f)handleFile(f);
 e.target.value='';
};

/* ================== EXPORTACIONS ================== */
function download(name,txt){
 try{
  var a=document.createElement('a');
  var blob=new Blob([txt],{type:'application/json'});
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){document.body.removeChild(a);},100);
  return true;
 }catch(e){return false;}
}
function safeName(s){return String(s||'alumne').replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);}

/* ================== CABLEJAT BARRETA ================== */
 $('langBox').addEventListener('click',function(e){
 var b=e.target;
 while(b&&b.tagName!=='BUTTON')b=b.parentNode;
 if(!b||!b.getAttribute('data-lang'))return;
 lang=b.getAttribute('data-lang');
 ST.setItem('fa_lang',lang);
 log('L_LANG',lang);
 save(true);render();
});
 $('bSave').onclick=function(){log('L_SAVE');save();toast(t('manSaved'));};
 $('bPrint').onclick=function(){log('L_PRINT');save(true);window.print();};
 $('bClrLog').onclick=function(){
 var b=$('bClrLog');
 if(b.getAttribute('data-arm')!=='1'){
  b.setAttribute('data-arm','1');
  b.textContent=t('confirmClr');
  toast(t('confirmClr'));
  b._to=setTimeout(function(){b.removeAttribute('data-arm');b.textContent=t('bClrLog');},4000);
  return;
 }
 clearTimeout(b._to);b.removeAttribute('data-arm');b.textContent=t('bClrLog');
 me.log=[];log('L_CLRLOG');save();toast(t('clrLog'));
};
 $('bReset').onclick=function(){
 var p=$('resetpanel');
 if(!p)return;
 if(p.style.display==='block'){p.style.display='none';return;}
 p.style.display='block';
 $('rpWord').value='';
 $('rpWord').focus();
};
 $('main').addEventListener('click',function(e){
 var el=e.target;
 if(el.id==='rpGo'){
  var w=($('rpWord').value||'').toUpperCase();
  if(w!==t('resetWord')){toast(t('resetBad'));return;}
  var keep=$('rpKeep').checked;
  var prof=keep?me.profile:{name:'',email:'',start:me.profile.start,teacher:me.profile.teacher,course:me.profile.course};
  me={profile:prof,done:{},compStatus:{},actNotes:{},compNotes:{},genNotes:{},log:[],lastSes:''};
  log('L_RESET');save();render();toast(t('reseted'));
  return;
 }
 if(el.id==='rpCancel'){$('resetpanel').style.display='none';}
});
 $('bSend').onclick=function(){
 var ss=sorted(),out=[],i,j,s,had=false;
 for(i=0;i<ss.length;i++){
  s=ss[i];
  var o={date:s.date,topic:s.topic,acts:[],comp:[],genNote:me.genNotes[s.date]||''},k,st;
  for(j=0;j<(s.acts||[]).length;j++){
   k=actKey(s.date,s.acts[j].txt,j);st=me.done[k]||'';
   if(st||me.actNotes[k])had=true;
   o.acts.push({txt:s.acts[j].txt,time:s.acts[j].time,status:st,note:me.actNotes[k]||''});
  }
  var lines=compLines(s);
  for(j=0;j<lines.length;j++){
   k=(s.date||'')+'|c|'+j;st=me.compStatus[k]||'';
   if(st||me.compNotes[k])had=true;
   o.comp.push({txt:lines[j],status:st,note:me.compNotes[k]||''});
  }
  out.push(o);
 }
 if(!had){toast(t('sendNone'));return;}
 var pack={app:'fitxa-alumne-entrega',student:me.profile,exported:nowISO(),sessions:out,stats:globalStatsHTML().replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(),log:me.log.slice(-100)};
 var fn='fitxa-'+safeName(me.profile.name)+'-'+safeName(me.profile.course)+'.json';
 var ok=download(fn,JSON.stringify(pack,null,1));
 log('L_EXPTEA',fn);save(true);
 if(ok){
  toast(t('sendHow'));
  try{
   var su=encodeURIComponent('Fitxa de seguiment - '+(me.profile.name||'')+' - '+(me.profile.course||''));
   var bo=encodeURIComponent('Hola Celia,\n\nAdjunto la meva fitxa de seguiment ('+fn+').\n\nSalutacions,\n'+(me.profile.name||''));
   window.location.href='mailto:'+(me.profile.teacher||'cpainous@institutdelteatre.cat')+'?subject='+su+'&body='+bo;
  }catch(e){}
 }
};
 $('bImpP').onclick=function(){$('fImp').click();};
 $('bBak').onclick=function(){
 var b=$('bBak');
 if(b.getAttribute('data-arm')!=='1'){
  b.setAttribute('data-arm','1');
  if(b._to)clearTimeout(b._to);
  b._to=setTimeout(function(){b.removeAttribute('data-arm');},4000);
  b.textContent=t('confirmClr');
  return;
 }
 clearTimeout(b._to);b.removeAttribute('data-arm');
 download('fitxa-copia-'+safeName(me.profile.name)+'-'+clock().replace(/[^\d]/g,'')+'.json',JSON.stringify({app:'fitxa-alumne-backup',prog:prog,me:me}));
 log('L_IMPBAK','(export)');save(true);
};

/* ================== INICI ================== */
log('L_OPEN');
if(window.__memMode){log('L_MEMMODE');}
save(true);
render();
