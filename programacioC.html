{id:"ra",t:"2. Competències i resultats d'aprenentatge",h:`
<h3>Competències del pla docent (text oficial)</h3>
<p><b>CG3</b> · Conèixer els principis bàsics, tant teòrics com pràctics, del funcionament del cos humà, amb l'objecte de proporcionar una visió global i integradora del mateix.</p>
<p><b>CECI 3</b> · Conèixer l'anatomia, fisiologia i biomecànica del cos humà, les seves capacitats i limitacions com a vehicle d'expressió artística, així com les patologies més freqüents i la seva prevenció per a poder optimitzar la seva interpretació i la seva labor creativa.</p>
<p><b>Altres competències:</b> desenvolupar la capacitat de síntesi i de visions globals (seminaris); desenvolupar l'aplicació dels coneixements a la pràctica: habilitats i actituds (pràctica).</p>
<h3>Resultats d'aprenentatge (RA) i desplegament</h3>
<p>El pla docent fixa <b>7 RA oficials</b> (coneixements, habilitats i actituds). La taula concreta el criteri d'assoliment, com es treballa i amb quin instrument s'avalua.</p>

<thead><tr><th>RA oficial</th><th>Criteri d'assoliment</th><th>Com es treballa</th><th>Instrument</th></tr></thead>
<tbody>

<tr><td><b>C2</b> · Adaptacions dels sistemes a l'activitat física</td><td>Explica la resposta i l'adaptació de cada sistema a l'esforç dansat (FC, fatiga, termoregulació, RED-S…).</td><td>Pràctiques de laboratori corporal; estudis de cas</td><td>Quadern · Prova escrita</td></tr>

<tr><td><b>A1</b> · Interès pel funcionament del propi cos</td><td>Registra i interpreta dades pròpies amb cura, constància i rigor.</td><td>Quadern de fisiologia: registres a mà de les pràctiques</td><td>Quadern</td></tr>

{id:"enfo",t:"3. Enfocament de l'assignatura",h:`
<p>La fisiologia és la base científica que permet a l'intèrpret i al pedagog comprendre com funciona el cos en acció. L'assignatura s'allunya d'un plantejament memorístic i situa l'aprenentatge en contextos professionals: assajar millor, prevenir lesions, rendir en escena i ensenyar amb seguretat. Concretament:</p>
<ul>
<li><b>Les sessions parteixen de presentacions de continguts</b> (expositives dialogades) que donen a l'estudiant l'esquema conceptual per ordenar i integrar el que treballarà després.</li>
<li><b>Cap tema es tanca en una sola sessió:</b> els temes del temari avancen de forma contínua, es reparteixen entre sessions, es tornen a obrir quan cal i cada sessió comença amb un <b>repàs</b> de l'anterior.</li>
<li><b>Hi ha una part pràctica important a cada sessió</b> (laboratori corporal: mesurar el propi cos), estructurada al voltant de la SdA.</li>
<li><b>La SdA se centra en la fisiologia:</b> l'anatomia necessària es tracta com a <i>suport mínim</i> per entendre la funció, sense entrada en profunditat anatòmica.</li>
<li><b>Les activitats complementàries</b> desenvolupen i consoliden els continguts de les presentacions.</li>
<li><b>L'escriptura manual és l'eina cognitiva central:</b> tot l'aprenentatge es fixa a mà al <b>Quadern de Fisiologia</b> (vegeu §4 i §7).</li>
</ul>
<h3>Estructura recurrent de sessió (plantilla)</h3>
<table>
<thead><tr><th>Fase</th><th>Temps orientatiu</th><th>Què es fa</th><th>Producte (a mà)</th></tr></thead>
<tbody>
<tr><td>1. Activació i repàs</td><td>15-20 min</td><td>Activitat breu sobre la sessió anterior: quiz exprés, completar un esquema, preguntes de repàs…</td><td>Resposta al quadern</td></tr>
<tr><td>2. Presentació de continguts</td><td>50-60 min</td><td>Exposició dialogada del tema (o de la part de tema que toca), amb preguntes i casos breus</td><td>Notes i esquemes dibuixats</td></tr>
<tr><td>3. Part pràctica</td><td>60-75 min</td><td>Laboratori corporal, activitat de la SdA, estudi de cas o treball cooperatiu</td><td>Registre de dades + interpretació</td></tr>
<tr><td>4. Síntesi i tancament</td><td>15-30 min</td><td>Síntesi de la sessió, esquema de memòria, «paper d'un minut», anticipació de la propera sessió</td><td>Resum + esquema al quadern</td></tr>
</tbody></table>
<div class="note">Els temps són orientatius. Un cop validada aquesta programació, s'elaborarà el <b>pla de treball de cada sessió</b> (planificació setmanal del professorat) amb la temporalització definitiva de tots els recursos i activitats. La concreció de les SdA, pràctiques i activitats complementàries es recull en aquesta planificació setmanal.</div>`},

{id:"eix",t:"4. Eix global i productes de l'alumnat",h:`
<h3>Repte: «L'equip de ciències de la salut de la companyia»</h3>
<p><i>Sou l'equip de ciències de la salut d'una companyia de dansa. La companyia ha d'arribar a la temporada sense lesions i amb el màxim rendiment: prepareu el seu «dossier de salut».</i> Grups de 3-4 amb rols rotatius (coordinació, dades, redacció, portaveu); cada grup adopta un perfil de companyia (contemporània en creació, flamenca en gira, companyia júnior… o una real del centre) i el documenta en una fitxa inicial.</p>
<h3>Productes</h3>
<table>
<thead><tr><th>Producte</th><th>Qui</th><th>Descripció</th><th>Quan (calendari del curs)</th></tr></thead>

<tr><td><b>Presentació oral</b></td><td>Grupal</td><td>Comunicació científica adaptada a un públic, amb fitxes d'exposició escrites a mà. <b>Preparació i enviament dels treballs orals el 13-nov</b>, segons el calendari del curs.</td><td>Preparació i enviament: 13-nov · Exposició: 27-nov</td></tr>
<tr><td><b>Dossier de la companyia</b> <span class="badge b-hand">a mà</span></td><td>Grupal</td><td>Capítols en còpia neta a mà + annexos impresos (dades, gràfics, referències). Lliurament i defensa davant el grup.</td><td>Lliurament i defensa: 22-gen (dia de l'examen final)</td></tr>
</tbody></table>
<h3>Capítols del dossier (els sistemes = moments del projecte)</h3>
<p>Marc homeostàtic (T1) · Cap. 1 Fisiologia d'un pas (T2) · Cap. 2 El cervell que balla (T3) · Cap. 3 Motor i combustible (T4, T7, nutrició) · Cap. 4 Cardio i respiració (T5, T6) · Cap. 5 Integració: la setmana de funcions (T8).</p>
<h3>Mòdul d'especialitat</h3>
<p><i>Pedagogia de la dansa:</i> secció «Expliquem-ho a l'aula» (traduir conceptes fisiològics + escalfament/refredament segurs justificats). <i>Coreografia i interpretació:</i> secció «Manual d'ús del meu cos» (protocol personal pre-escena i post-funció).</p>
<div class="note">La concreció dels productes (formats, requisits, dates exactes de lliurament intermèdia) es detallarà a la <b>planificació setmanal del professorat</b> un cop validada la programació.</div>`},

{id:"metod",t:"7. Metodologia i escriptura manual",h:`
<h3>Principis</h3>
<ul>
<li><b>Presentació dialogada com a base:</b> la teoria s'introdueix amb un esquema conceptual clar i es consolida amb pràctica i casos. La presentació no es tanca mai dins d'una sola sessió: els temes continuen, es repassen i s'integren progressivament.</li>
<li><b>Aprenentatge situat:</b> la SdA de la companyia dona sentit professional a cada sistema estudiat, amb la fisiologia com a centre i l'anatomia com a suport mínim.</li>
<li><b>Pràctica corporal a cada sessió:</b> el laboratori corporal (mesurar i experimentar amb el propi cos) és una part important de totes les sessions i l'eina principal per assolir els continguts.</li>
<li><b>Activitats complementàries:</b> cada presentació es desenvolupa i consolida amb activitats complementàries (pràctiques, casos, fitxes, quiz, seminaris) que ajuden l'alumnat a assolir els continguts.</li>
<li><b>Treball cooperatiu amb rols</b> rotatius, coavaluació i autoavaluació.</li>
<li><b>Autorregulació:</b> l'alumnat interpreta les seves dades i decideix sobre la seva càrrega i recuperació.</li>
<li><b>Enfocament ètic:</b> imatge corporal i prevenció de TCA tractades amb llenguatge no estigmatitzant i perspectiva professional.</li>
</ul>
<h3>L'escriptura manual <span class="badge b-hand">a mà</span></h3>
<p>La professora treballarà amb <b>escriptura manual</b> com a eina d'aprenentatge. La nota manuscrita activa processos de codificació profunda: obliga a seleccionar, jerarquitzar i reformular —no a copiar—, i el dibuix d'esquemes a mà força a traduir la informació a una representació pròpia. A més, el quadern permet fer visible el progrés i revisar-lo amb el professorat. Es concreta en:</p>
<ul>
<li><b>Quadern de Fisiologia (individual):</b> notes i esquemes dibuixats de les presentacions; registres de les pràctiques (dades, càlculs i interpretació); síntesis de tancament de cada sessió.</li>
<li><b>Fitxes de lectura a mà</b> (garanteixen la consulta metòdica i científica): referència completa citada + idees clau + aplicació a la dansa. La <b>consulta</b> de fonts és digital o bibliogràfica; el que s'avalua és el <b>producte manual</b>.</li>
<li><b>Productes de la SdA en còpia neta a mà</b> (dossier de la companyia) amb annexos impresos quan el contingut ho demani (dades, gràfics, referències).</li>
<li><b>Fitxes d'exposició a mà</b> per als treballs orals (no es llegeixen pantalles).</li>
<li><b>Proves escrites a mà</b>, amb preguntes essencials vinculades a la llista de conceptes imprescindibles del pla docent.</li>
</ul>
<div class="note">Si algun estudiant té necessitats específiques (DUA), es poden establir adaptacions sense perdre el component de fixació activa. Els formats i criteris concrets de cada producte manual es detallaran a la planificació setmanal.</div>
<h3>Activitats complementàries (tipologia i finalitat)</h3>
<table>
<thead><tr><th>Tipologia</th><th>Finalitat</th></tr></thead>
<tbody>
<tr><td>Pràctiques de laboratori corporal (a cada sessió)</td><td>Experimentar en primera persona els continguts de la presentació; generar dades pròpies</td></tr>
<tr><td>Activitats d'escriptura manual (quadern, esquemes, fitxes)</td><td>Fixar i estructurar el coneixement; fer visible el progrés</td></tr>
<tr><td>Fitxes de lectura amb consulta de fonts científiques</td><td>Rigor, citació i transferència professional (H2, A3)</td></tr>
<tr><td>Quiz i preguntes de repàs</td><td>Consolidar conceptes imprescindibles i preparar les proves</td></tr>
<tr><td>Estudis de cas i debats</td><td>Anàlisi professional, prevenció i ètica (CECI 3)</td></tr>
<tr><td>Treballs orals i seminaris</td><td>Comunicació científica adaptada i síntesi (H2)</td></tr>
</tbody></table>
<h3>Atenció a la diversitat</h3>
<ul><li>DUA: continguts en múltiples formats; productes adaptables quan calgui.</li><li>Pràctiques adaptades a lesions o condicions de salut (mai provocar dolor).</li><li>Salut mental i imatge corporal: llenguatge cuidat i derivació als serveis del centre si cal.</li><li>Cooperació estructurada amb rols rotatius per garantir la participació de tots els perfils.</li></ul>`},

{id:"aval",t:"8. Avaluació",h:`
<p>Enfocament <b>competencial i continuat</b>: es combina l'avaluació formativa (durant el procés) amb la sumativa (al final). El coneixement s'avalua en contextos professionals reals.</p>
<h3>Ponderació</h3>
<div class="note"><b>Ponderació provisional:</b> els percentatges de la taula es modificaran de forma manual un cop revisada la programació amb el departament.</div>
<table>
<thead><tr><th>Instrument</th><th>Descripció</th><th>Pes</th><th>RA</th></tr></thead>
<tbody>
<tr><td><b>Prova escrita teoricopràctica</b></td><td>Parcial (18-des) + final (22-gen). Inclou <b>preguntes essencials</b> vinculades a la llista de conceptes imprescindibles del pla docent: cal aprovar-les totes. Amb preguntes contextualitzades i un cas integrador a la prova final.</td><td><b>30 %</b></td><td>C1, C2, H1</td></tr>
<tr><td><b>Quadern de Fisiologia</b> <span class="badge b-hand">a mà</span></td><td>Individual: notes i esquemes, registres de pràctiques, síntesis i fitxes de lectura. Revisió contínua + lliuraments formals.</td><td><b>15 %</b></td><td>C2, H2, A1</td></tr>
<tr><td><b>Dossier de la companyia + defensa</b> <span class="badge b-hand">a mà</span></td><td>Grupal: capítols en còpia neta a mà + annexos; defensa davant el grup (22-gen).</td><td><b>20 %</b></td><td>H1, H2, A3</td></tr>
<tr><td><b>Presentació oral</b></td><td>Grupal (27-nov): comunicació científica adaptada amb demostració en directe. Rúbrica + coavaluació entre grups.</td><td><b>20 %</b></td><td>H2, A2, A3</td></tr>
<tr><td><b>Participació i treball cooperatiu</b></td><td>Implicació a les pràctiques i seminaris, resolució de casos, actituds de cura i ètica professional. Inclou autoavaluació i coavaluació (ajust ±10 %).</td><td><b>15 %</b></td><td>A1, A2</td></tr>
</tbody></table>
<p><b>Formatiu (no ponderat però obligatori):</b> quiz de bloc, debats i estudis de cas, tutories de seguiment. A l'inici del curs es publicarà la <b>llista de conceptes imprescindibles</b> (pla docent), que fonamenta les preguntes essencials de les proves.</p>
<h3>Requisits per superar l'assignatura</h3>
<ul>
<li><b>Assistència mínima del 80 %</b> (dins del rang 70-80 % del pla docent; necessària pel caràcter pràctic de les sessions).</li>
<li>Lliurament del quadern, del dossier i de la presentació oral.</li>
<li>Nota global ≥ 5/10 i <b>prova escrita ≥ 4/10</b>, amb les preguntes essencials aprovades.</li>
</ul>
<h3>Recuperació i avaluació única</h3>
<ul>
<li><b>Recuperació:</b> prova escrita global al febrer; el quadern i el dossier es poden millorar; la presentació oral i la participació no es recuperen.</li>
<li><b>Avaluació única:</b> es regirà pel que estableix la Guia de l'estudiant del CSD (causes excepcionals justificades documentalment).</li>
</ul>
<div class="note"><b>Nota de compatibilitat:</b> el pla docent oficial recull la ponderació «continuada 25 % / preguntes fonamentals 25 % / examen 50 %». Aquesta proposta la renova mantenint els elements no negociables (examen imprescindible, conceptes imprescindibles, avaluació única, assistència mínima). Pendent de validar amb el departament.</div>
<h3>Dimensions d'avaluació dels productes</h3>
<p><b>Quadern:</b> regularitat i cura; precisió dels registres i dels esquemes; qualitat de les síntesis; fitxes de lectura completes i ben citades. <b>Presentació oral:</b> contingut científic; estructura; comunicació adaptada al públic; demostració pràctica; fonts i temps. <b>Dossier:</b> fonamentació fisiològica; adaptació al perfil de companyia; integració de sistemes (H1); mòdul d'especialitat; format a mà i citació; defensa. Les <b>rúbriques completes</b> es concretaran a la planificació setmanal.</p>`},

{id:"biblio",t:"9. Bibliografia i recursos",h:`
<h3>Bibliografia bàsica (pla docent)</h3>
<ul>
<li>Patton, K. T., &amp; Thibodeau, G. A. <i>Anatomía y fisiología</i> (8ª ed.). Elsevier.</li>
<li>Mulroney, S. E., &amp; Myers, A. K. <i>Netter: Fundamentos de la Fisiología</i> (2ª ed.). Elsevier.</li>
</ul>
<h3>Bibliografia específica de dansa (recomanada)</h3>
<ul>
<li>Haas, J. G. <i>Dance Anatomy</i>. Human Kinetics.</li>
<li>Quin, E., Rafferty, S., &amp; Tomlinson, C. <i>Safe Dance Practice</i>. Human Kinetics.</li>
<li>Krasnow, D., &amp; Wilmerding, M. V. <i>Motor Learning and Control for Dance</i>. Human Kinetics.</li>
<li>Calais-Germain, B. <i>Anatomía para el movimiento</i>. La Isla.</li>
<li>Koutedakis, Y., &amp; Jamurtas, A. (2004). The dancer as a performing athlete. <i>Sports Medicine, 34</i>(10), 651-661.</li>
<li>Wyon, M. A. (2010). Guidance for dance nutrition. A <i>Dance medicine: Science, art and practice</i>. Routledge.</li>
<li>Arcelus, J., et al. (2014). Prevalence of eating disorders amongst dancers. <i>European Eating Disorders Review, 22</i>(2), 92-101.</li>
<li>McArdle, W. D., Katch, F. I., &amp; Katch, V. L. <i>Fisiología del ejercicio</i> (7ª ed.). Alianza.</li>
</ul>
<h3>Recursos digitals</h3>
<ul>
<li><b>IADMS</b> (iadms.org): <i>Fact Sheets</i> de nutrició, prevenció de lesions, imatge corporal — material de referència per a les fitxes de lectura.</li>
<li><b>One Dance UK — Healthy Dancer</b>; <b>PubMed</b>, <b>Dialnet</b>, <b>SPORTDiscus</b> (accés per la biblioteca del centre).</li>
<li>Apps de registre (FC, son, hidratació) <b>com a complement</b>: les dades que s'avaluen són les transcrites a mà al quadern.</li>
</ul>
<p><b>Criteris de selecció:</b> rigor científic, actualització, especificitat de dansa, diversitat lingüística i accessibilitat via biblioteca de l'Institut del Teatre.</p>`},

{id:"annex",t:"10. Annex: fitxes de treball de l'alumnat",h:`
<p><span class="badge b-pend">pendent de concretar</span></p>
<p>Els documents operatius de treball de l'alumnat es concretaran a la <b>planificació setmanal del professorat</b> (pla de treball de cada sessió) i en annexos específics. Queden pendents de concretar:</p>
<ul>
<li><b>Quadern de Fisiologia:</b> estructura, criteris de revisió i formats.</li>
<li><b>Fitxes de lectura a mà:</b> model, nombre mínim i calendari.</li>
<li><b>Productes de la SdA del curs:</b> fitxa inicial de companyia, productes intermedis i dossier final (formats, requisits i dates exactes de lliurament).</li>
<li><b>Rúbriques completes:</b> presentació oral, quadern i dossier.</li>
<li><b>Banc de preguntes essencials</b> i llista de conceptes imprescindibles de cada bloc.</li>
<li><b>Plantilla del pla de treball de cada sessió:</b> temporalització de tots els recursos i activitats (activació i repàs, presentació, part pràctica, síntesi).</li>
</ul>
<div class="note">Aquests annexos es treballaran un cop validada la programació amb el departament, de manera que es puguin ajustar a les decisions finals (ponderació, calendari de lliuraments, formats).</div>`}
]},

{id:"ra",t:"2. Competencias y resultados de aprendizaje",h:`
<h3>Competencias del plan docente (texto oficial)</h3>
<p><b>CG3</b> · Conocer los principios básicos, tanto teóricos como prácticos, del funcionamiento del cuerpo humano, con el objeto de proporcionar una visión global e integradora del mismo.</p>
<p><b>CECI 3</b> · Conocer la anatomía, fisiología y biomecánica del cuerpo humano, sus capacidades y limitaciones como vehículo de expresión artística, así como las patologías más frecuentes y su prevención para poder optimizar su interpretación y su labor creativa.</p>
<p><b>Otras competencias:</b> desarrollar la capacidad de síntesis y de visiones globales (seminarios); desarrollar la aplicación de los conocimientos a la práctica: habilidades y actitudes (práctica).</p>
<h3>Resultados de aprendizaje (RA) y despliegue</h3>
<p>El plan docente fija <b>7 RA oficiales</b> (conocimientos, habilidades y actitudes). La tabla concreta el criterio de logro, cómo se trabaja y con qué instrumento se evalúa.</p>
<table>
<thead><tr><th>RA oficial</th><th>Criterio de logro</th><th>Cómo se trabaja</th><th>Instrumento</th></tr></thead>
<tbody>
<tr><td><b>C1</b> · Estructura y bases funcionales de los sistemas orgánicos</td><td>Describe el funcionamiento de los sistemas muscular, nervioso, sanguíneo, cardiovascular, respiratorio y hormonal, y los mecanismos de homeostasis.</td><td>Presentaciones dialogadas + esquemas dibujados en el cuaderno</td><td>Prueba escrita · Cuaderno</td></tr>
<tr><td><b>C2</b> · Adaptaciones de los sistemas a la actividad física</td><td>Explica la respuesta y la adaptación de cada sistema al esfuerzo dancístico (FC, fatiga, termorregulación, RED-S…).</td><td>Prácticas de laboratorio corporal; estudios de caso</td><td>Cuaderno · Prueba escrita</td></tr>
<tr><td><b>H1</b> · Relacionar los sistemas en el funcionamiento del organismo como un todo</td><td>Relaciona los sistemas de forma integrada (cadena O₂, regulación energética, respuesta global al esfuerzo).</td><td>Repasos integradores, pregunta integradora del examen, síntesis final de los productos</td><td>Examen final · Dossier</td></tr>
<tr><td><b>H2</b> · Aplicar los conocimientos adquiridos a su campo de trabajo</td><td>Aplica la fisiología a situaciones profesionales reales (ensayos, funciones, aula de danza).</td><td>Eje global: dossier de la compañía + presentación oral</td><td>Dossier · Presentación oral</td></tr>
<tr><td><b>A1</b> · Interés por el funcionamiento del propio cuerpo</td><td>Registra e interpreta datos propios con cuidado, constancia y rigor.</td><td>Cuaderno de fisiología: registros a mano de las prácticas</td><td>Cuaderno</td></tr>
<tr><td><b>A2</b> · Actitud positiva ante un campo de conocimiento nuevo</td><td>Participa con implicación en teoría, práctica y trabajo cooperativo.</td><td>Participación en las sesiones, cooperación, coevaluación</td><td>Observación · Coevaluación</td></tr>
<tr><td><b>A3</b> · Importancia de estos conocimientos para el propio trabajo</td><td>Transfiere los conocimientos a su rol profesional (intérprete / pedagogo).</td><td>Módulo de especialidad, presentación adaptada al público</td><td>Presentación oral · Dossier</td></tr>
</tbody></table>`},

{id:"enfo",t:"3. Enfoque de la asignatura",h:`
<p>La fisiología es la base científica que permite al intérprete y al pedagogo comprender cómo funciona el cuerpo en acción. La asignatura se aleja de un planteamiento memorístico y sitúa el aprendizaje en contextos profesionales: ensayar mejor, prevenir lesiones, rendir en escena y enseñar con seguridad. Concretamente:</p>
<ul>
<li><b>Las sesiones parten de presentaciones de contenidos</b> (expositivas dialogadas) que dan al estudiante el esquema conceptual para ordenar e integrar lo que trabajará después.</li>
<li><b>Ningún tema se cierra en una sola sesión:</b> los temas del temario avanzan de forma continua, se reparten entre sesiones, se vuelven a abrir cuando hace falta y cada sesión comienza con un <b>repaso</b> del anterior.</li>
<li><b>Hay una parte práctica importante en cada sesión</b> (laboratorio corporal: medir el propio cuerpo), estructurada en torno a la SdA.</li>
<li><b>La SdA se centra en la fisiología:</b> la anatomía necesaria se trata como <i>soporte mínimo</i> para entender la función, sin entrada en profundidad anatómica.</li>
<li><b>Las actividades complementarias</b> desarrollan y consolidan los contenidos de las presentaciones.</li>
<li><b>La escritura manual es la herramienta cognitiva central:</b> todo el aprendizaje se fija a mano en el <b>Cuaderno de Fisiología</b> (véase §4 y §7).</li>
</ul>
<h3>Estructura recurrente de sesión (plantilla)</h3>
<table>
<thead><tr><th>Fase</th><th>Tiempo orientativo</th><th>Qué se hace</th><th>Producto (a mano)</th></tr></thead>
<tbody>
<tr><td>1. Activación y repaso</td><td>15-20 min</td><td>Actividad breve sobre la sesión anterior: quiz exprés, completar un esquema, preguntas de repaso…</td><td>Respuesta en el cuaderno</td></tr>
<tr><td>2. Presentación de contenidos</td><td>50-60 min</td><td>Exposición dialogada del tema (o de la parte del tema que toca), con preguntas y casos breves</td><td>Apuntes y esquemas dibujados</td></tr>
<tr><td>3. Parte práctica</td><td>60-75 min</td><td>Laboratorio corporal, actividad de la SdA, estudio de caso o trabajo cooperativo</td><td>Registro de datos + interpretación</td></tr>
<tr><td>4. Síntesis y cierre</td><td>15-30 min</td><td>Síntesis de la sesión, esquema de memoria, «papel de un minuto», anticipación de la próxima sesión</td><td>Resumen + esquema en el cuaderno</td></tr>
</tbody></table>
<div class="note">Los tiempos son orientativos. Una vez validada esta programación, se elaborará el <b>plan de trabajo de cada sesión</b> (planificación semanal del profesorado) con la temporalización definitiva de todos los recursos y actividades. La concreción de las SdA, prácticas y actividades complementarias se recoge en esa planificación semanal.</div>`},

{id:"eix",t:"4. Eje global y productos del alumnado",h:`
<h3>Reto: «El equipo de ciencias de la salud de la compañía»</h3>
<p><i>Sois el equipo de ciencias de la salud de una compañía de danza. La compañía tiene que llegar a la temporada sin lesiones y con el máximo rendimiento: preparad su «dossier de salud».</i> Grupos de 3-4 con roles rotativos (coordinación, datos, redacción, portavoz); cada grupo adopta un perfil de compañía (contemporánea en creación, flamenca de gira, compañía júnior… o una real del centro) y lo documenta en una ficha inicial.</p>
<h3>Productos</h3>
<table>
<thead><tr><th>Producto</th><th>Quién</th><th>Descripción</th><th>Cuándo (calendario del curso)</th></tr></thead>
<tbody>
<tr><td><b>Cuaderno de Fisiología</b> <span class="badge b-hand">a mano</span></td><td>Individual</td><td>Cuaderno de laboratorio: apuntes y esquemas dibujados de las presentaciones, registros de las prácticas, síntesis de cierre y fichas de lectura.</td><td>Continuo; revisiones 18-dic y 22-ene</td></tr>
<tr><td><b>Presentación oral</b></td><td>Grupal</td><td>Comunicación científica adaptada a un público, con fichas de exposición escritas a mano. <b>Preparación y envío de los trabajos orales el 13-nov</b>, según el calendario del curso.</td><td>Preparación y envío: 13-nov · Exposición: 27-nov</td></tr>
<tr><td><b>Dossier de la compañía</b> <span class="badge b-hand">a mano</span></td><td>Grupal</td><td>Capítulos en copia limpia a mano + anexos impresos (datos, gráficos, referencias). Entrega y defensa ante el grupo.</td><td>Entrega y defensa: 22-ene (día del examen final)</td></tr>
</tbody></table>
<h3>Capítulos del dossier (los sistemas = momentos del proyecto)</h3>
<p>Marco homeostático (T1) · Cap. 1 Fisiología de un paso (T2) · Cap. 2 El cerebro que baila (T3) · Cap. 3 Motor y combustible (T4, T7, nutrición) · Cap. 4 Cardio y respiración (T5, T6) · Cap. 5 Integración: la semana de funciones (T8).</p>
<h3>Módulo de especialidad</h3>
<p><i>Pedagogía de la danza:</i> sección «Se lo explicamos al aula» (traducir conceptos fisiológicos + calentamiento/enfriamiento seguros justificados). <i>Coreografía e interpretación:</i> sección «Manual de uso de mi cuerpo» (protocolo personal pre-escena y post-función).</p>
<div class="note">La concreción de los productos (formatos, requisitos, fechas exactas de entrega intermedia) se detallará en la <b>planificación semanal del profesorado</b> una vez validada la programación.</div>`},

{id:"metod",t:"7. Metodología y escritura manual",h:`
<h3>Principios</h3>
<ul>
<li><b>Presentación dialogada como base:</b> la teoría se introduce con un esquema conceptual claro y se consolida con práctica y casos. La presentación no se cierra nunca dentro de una sola sesión: los temas continúan, se repasan y se integran progresivamente.</li>
<li><b>Aprendizaje situado:</b> la SdA de la compañía da sentido profesional a cada sistema estudiado, con la fisiología como centro y la anatomía como soporte mínimo.</li>
<li><b>Práctica corporal en cada sesión:</b> el laboratorio corporal (medir y experimentar con el propio cuerpo) es una parte importante de todas las sesiones y la herramienta principal para alcanzar los contenidos.</li>
<li><b>Actividades complementarias:</b> cada presentación se desarrolla y consolida con actividades complementarias (prácticas, casos, fichas, quiz, seminarios) que ayudan al alumnado a alcanzar los contenidos.</li>
<li><b>Trabajo cooperativo con roles</b> rotativos, coevaluación y autoevaluación.</li>
<li><b>Autorregulación:</b> el alumnado interpreta sus datos y decide sobre su carga y recuperación.</li>
<li><b>Enfoque ético:</b> imagen corporal y prevención de TCA tratadas con lenguaje no estigmatizante y perspectiva profesional.</li>
</ul>
<h3>La escritura manual <span class="badge b-hand">a mano</span></h3>
<p>La profesora trabajará con <b>escritura manual</b> como herramienta de aprendizaje. La nota manuscrita activa procesos de codificación profunda: obliga a seleccionar, jerarquizar y reformular —no a copiar—, y el dibujo de esquemas a mano fuerza a traducir la información a una representación propia. Además, el cuaderno permite hacer visible el progreso y revisarlo con el profesorado. Se concreta en:</p>
<ul>
<li><b>Cuaderno de Fisiología (individual):</b> apuntes y esquemas dibujados de las presentaciones; registros de las prácticas (datos, cálculos e interpretación); síntesis de cierre de cada sesión.</li>
<li><b>Fichas de lectura a mano</b> (garantizan la consulta metódica y científica): referencia completa citada + ideas clave + aplicación a la danza. La <b>consulta</b> de fuentes es digital o bibliográfica; lo que se evalúa es el <b>producto manual</b>.</li>
<li><b>Productos de la SdA en copia limpia a mano</b> (dossier de la compañía) con anexos impresos cuando el contenido lo pida (datos, gráficos, referencias).</li>
<li><b>Fichas de exposición a mano</b> para los trabajos orales (no se leen pantallas).</li>
<li><b>Pruebas escritas a mano</b>, con preguntas esenciales vinculadas a la lista de conceptos imprescindibles del plan docente.</li>
</ul>
<div class="note">Si algún estudiante tiene necesidades específicas (DUA), se pueden establecer adaptaciones sin perder el componente de fijación activa. Los formatos y criterios concretos de cada producto manual se detallarán en la planificación semanal.</div>
<h3>Actividades complementarias (tipología y finalidad)</h3>
<table>
<thead><tr><th>Tipología</th><th>Finalidad</th></tr></thead>
<tbody>
<tr><td>Prácticas de laboratorio corporal (en cada sesión)</td><td>Experimentar en primera persona los contenidos de la presentación; generar datos propios</td></tr>
<tr><td>Actividades de escritura manual (cuaderno, esquemas, fichas)</td><td>Fijar y estructurar el conocimiento; hacer visible el progreso</td></tr>
<tr><td>Fichas de lectura con consulta de fuentes científicas</td><td>Rigor, citación y transferencia profesional (H2, A3)</td></tr>
<tr><td>Quiz y preguntas de repaso</td><td>Consolidar conceptos imprescindibles y preparar las pruebas</td></tr>
<tr><td>Estudios de caso y debates</td><td>Análisis profesional, prevención y ética (CECI 3)</td></tr>
<tr><td>Trabajos orales y seminarios</td><td>Comunicación científica adaptada y síntesis (H2)</td></tr>
</tbody></table>
<h3>Atención a la diversidad</h3>
<ul><li>DUA: contenidos en múltiples formatos; productos adaptables cuando haga falta.</li><li>Prácticas adaptadas a lesiones o condiciones de salud (nunca provocar dolor).</li><li>Salud mental e imagen corporal: lenguaje cuidado y derivación a los servicios del centro si procede.</li><li>Cooperación estructurada con roles rotativos para garantizar la participación de todos los perfiles.</li></ul>`},

{id:"aval",t:"8. Evaluación",h:`
<p>Enfoque <b>competencial y continuado</b>: se combina la evaluación formativa (durante el proceso) con la sumativa (al final). El conocimiento se evalúa en contextos profesionales reales.</p>
<h3>Ponderación</h3>
<div class="note"><b>Ponderación provisional:</b> los porcentajes de la tabla se modificarán de forma manual una vez revisada la programación con el departamento.</div>
<table>
<thead><tr><th>Instrumento</th><th>Descripción</th><th>Peso</th><th>RA</th></tr></thead>
<tbody>
<tr><td><b>Prueba escrita teoricopráctica</b></td><td>Parcial (18-dic) + final (22-ene). Incluye <b>preguntas esenciales</b> vinculadas a la lista de conceptos imprescindibles del plan docente: hay que aprobarlas todas. Con preguntas contextualizadas y un caso integrador en la prueba final.</td><td><b>30 %</b></td><td>C1, C2, H1</td></tr>
<tr><td><b>Cuaderno de Fisiología</b> <span class="badge b-hand">a mano</span></td><td>Individual: apuntes y esquemas, registros de prácticas, síntesis y fichas de lectura. Revisión continua + entregas formales.</td><td><b>15 %</b></td><td>C2, H2, A1</td></tr>
<tr><td><b>Dossier de la compañía + defensa</b> <span class="badge b-hand">a mano</span></td><td>Grupal: capítulos en copia limpia a mano + anexos; defensa ante el grupo (22-ene).</td><td><b>20 %</b></td><td>H1, H2, A3</td></tr>
<tr><td><b>Presentación oral</b></td><td>Grupal (27-nov): comunicación científica adaptada con demostración en directo. Rúbrica + coevaluación entre grupos.</td><td><b>20 %</b></td><td>H2, A2, A3</td></tr>
<tr><td><b>Participación y trabajo cooperativo</b></td><td>Implicación en las prácticas y seminarios, resolución de casos, actitudes de cuidado y ética profesional. Incluye autoevaluación y coevaluación (ajuste ±10 %).</td><td><b>15 %</b></td><td>A1, A2</td></tr>
</tbody></table>
<p><b>Formativa (no ponderada pero obligatoria):</b> quiz de bloque, debates y estudios de caso, tutorías de seguimiento. Al comienzo del curso se publicará la <b>lista de conceptos imprescindibles</b> (plan docente), que fundamenta las preguntas esenciales de las pruebas.</p>
<h3>Requisitos para superar la asignatura</h3>
<ul>
<li><b>Asistencia mínima del 80 %</b> (dentro del rango 70-80 % del plan docente; necesaria por el carácter práctico de las sesiones).</li>
<li>Entrega del cuaderno, del dossier y de la presentación oral.</li>
<li>Nota global ≥ 5/10 y <b>prueba escrita ≥ 4/10</b>, con las preguntas esenciales aprobadas.</li>
</ul>
<h3>Recuperación y evaluación única</h3>
<ul>
<li><b>Recuperación:</b> prueba escrita global en febrero; el cuaderno y el dossier se pueden mejorar; la presentación oral y la participación no se recuperan.</li>
<li><b>Evaluación única:</b> se regirá por lo que establece la Guía del estudiante del CSD (causas excepcionales justificadas documentalmente).</li>
</ul>
<div class="note"><b>Nota de compatibilidad:</b> el plan docente oficial recoge la ponderación «continuada 25 % / preguntas fundamentales 25 % / examen 50 %». Esta propuesta la renueva manteniendo los elementos no negociables (examen imprescindible, conceptos imprescindibles, evaluación única, asistencia mínima). Pendiente de validar con el departamento.</div>
<h3>Dimensiones de evaluación de los productos</h3>
<p><b>Cuaderno:</b> regularidad y cuidado; precisión de los registros y de los esquemas; calidad de las síntesis; fichas de lectura completas y bien citadas. <b>Presentación oral:</b> contenido científico; estructura; comunicación adaptada al público; demostración práctica; fuentes y tiempo. <b>Dossier:</b> fundamentación fisiológica; adaptación al perfil de compañía; integración de sistemas (H1); módulo de especialidad; formato a mano y citación; defensa. Las <b>rúbricas completas</b> se concretarán en la planificación semanal.</p>`},

{id:"annex",t:"10. Anexo: fichas de trabajo del alumnado",h:`
<p><span class="badge b-pend">pendiente de concretar</span></p>
<p>Los documentos operativos de trabajo del alumnado se concretarán en la <b>planificación semanal del profesorado</b> (plan de trabajo de cada sesión) y en anexos específicos. Quedan pendientes de concretar:</p>
<ul>
<li><b>Cuaderno de Fisiología:</b> estructura, criterios de revisión y formatos.</li>
<li><b>Fichas de lectura a mano:</b> modelo, número mínimo y calendario.</li>
<li><b>Productos de la SdA del curso:</b> ficha inicial de compañía, productos intermedios y dossier final (formatos, requisitos y fechas exactas de entrega).</li>
<li><b>Rúbricas completas:</b> presentación oral, cuaderno y dossier.</li>

{id:"ra",t:"2. Competences and learning outcomes",h:`
<h3>Competences of the official teaching plan (official text)</h3>
<p><b>GC3</b> · To know the basic principles, both theoretical and practical, of how the human body works, in order to provide a global, integrating view of it.</p>
<p><b>CECI 3</b> · To know the anatomy, physiology and biomechanics of the human body, its capacities and limitations as a vehicle of artistic expression, as well as the most frequent pathologies and their prevention, in order to optimise performance and creative work.</p>
<p><b>Other competences:</b> develop the capacity for synthesis and global vision (seminars); develop the application of knowledge to practice: skills and attitudes (practical).</p>
<h3>Learning outcomes (LOs) and deployment</h3>
<p>The teaching plan fixes <b>7 official LOs</b> (knowledge, skills, attitudes). The table specifies the achievement criterion, how it is worked on and with which assessment instrument.</p>
<table>
<thead><tr><th>Official LO</th><th>Achievement criterion</th><th>How it is worked on</th><th>Instrument</th></tr></thead>
<tbody>
<tr><td><b>K1</b> · Structure and functional bases of the body systems</td><td>Describes the functioning of the muscular, nervous, blood, cardiovascular, respiratory and hormonal systems, and homeostatic mechanisms.</td><td>Dialogued presentations + hand-drawn diagrams in the notebook</td><td>Written test · Notebook</td></tr>
<tr><td><b>K2</b> · Adaptations of the systems to physical activity</td><td>Explains the response and adaptation of each system to danced exertion (HR, fatigue, thermoregulation, RED-S…).</td><td>Body-lab practicals; case studies</td><td>Notebook · Written test</td></tr>
<tr><td><b>S1</b> · Relating the systems in the functioning of the organism as a whole</td><td>Relates the systems in an integrated way (O₂ chain, energy regulation, global response to exertion).</td><td>Integrative reviews, integrating exam question, final synthesis of the products</td><td>Final exam · Dossier</td></tr>
<tr><td><b>S2</b> · Applying acquired knowledge to one's field of work</td><td>Applies physiology to real professional situations (rehearsals, shows, dance classroom).</td><td>Core project: company dossier + oral presentation</td><td>Dossier · Oral presentation</td></tr>
<tr><td><b>A1</b> · Interest in how one's own body works</td><td>Records and interprets personal data with care, consistency and rigour.</td><td>Physiology notebook: hand-written practical records</td><td>Notebook</td></tr>
<tr><td><b>A2</b> · Positive attitude towards a new field of knowledge</td><td>Participates with engagement in theory, practice and cooperative work.</td><td>Participation in sessions, cooperation, peer assessment</td><td>Observation · Peer assessment</td></tr>
<tr><td><b>A3</b> · Importance of this knowledge for one's own work</td><td>Transfers knowledge to the professional role (performer / teacher).</td><td>Specialisation module, audience-adapted presentation</td><td>Oral presentation · Dossier</td></tr>
</tbody></table>`},

{id:"enfo",t:"3. Course approach",h:`
<p>Physiology is the scientific basis that enables performers and educators to understand how the body works in action. The course avoids rote learning and situates learning in professional contexts: rehearsing better, preventing injuries, performing on stage and teaching safely. Specifically:</p>
<ul>
<li><b>Sessions start from content presentations</b> (dialogued lectures) that give students the conceptual scheme to organise and integrate what they will work on afterwards.</li>
<li><b>No topic is closed in a single session:</b> the topics of the syllabus advance continuously, are distributed across sessions, are reopened when needed, and every session begins with a <b>review</b> of the previous one.</li>
<li><b>There is an important practical part in every session</b> (body lab: measuring one's own body), structured around the SdA.</li>
<li><b>The SdA focuses on physiology:</b> the necessary anatomy is treated as <i>minimum support</i> to understand function, without going into anatomical depth.</li>
<li><b>Complementary activities</b> develop and consolidate the content of the presentations.</li>
<li><b>Handwriting is the central cognitive tool:</b> all learning is fixed by hand in the <b>Physiology Notebook</b> (see §4 and §7).</li>
</ul>
<h3>Recurring session structure (template)</h3>
<table>
<thead><tr><th>Phase</th><th>Orientative time</th><th>What happens</th><th>Product (by hand)</th></tr></thead>
<tbody>
<tr><td>1. Activation &amp; review</td><td>15-20 min</td><td>Short activity on the previous session: quick quiz, completing a diagram, review questions…</td><td>Answer in the notebook</td></tr>
<tr><td>2. Content presentation</td><td>50-60 min</td><td>Dialogued lecture on the topic (or the part of the topic due), with questions and brief cases</td><td>Notes and drawn diagrams</td></tr>
<tr><td>3. Practical part</td><td>60-75 min</td><td>Body lab, SdA activity, case study or cooperative work</td><td>Data record + interpretation</td></tr>
<tr><td>4. Synthesis &amp; closing</td><td>15-30 min</td><td>Session synthesis, memory diagram, "one-minute paper", preview of the next session</td><td>Summary + diagram in the notebook</td></tr>
</tbody></table>
<div class="note">Times are orientative. Once this programme is validated, the <b>work plan for each session</b> (lecturer's weekly planning) will be developed with the definitive timing of all resources and activities. The specification of SdAs, practicals and complementary activities is contained in that weekly planning.</div>`},

{id:"eix",t:"4. Core project and student products",h:`
<h3>Challenge: "The company's health-science team"</h3>
<p><i>You are the health-science team of a dance company. The company must reach the season injury-free and performing at its best: prepare its "health dossier".</i> Groups of 3-4 with rotating roles (coordination, data, writing, spokesperson); each group adopts a company profile (contemporary in creation, flamenco on tour, junior company… or a real one from the centre) and documents it in an initial sheet.</p>
<h3>Products</h3>
<table>
<thead><tr><th>Product</th><th>Who</th><th>Description</th><th>When (course calendar)</th></tr></thead>
<tbody>
<tr><td><b>Physiology Notebook</b> <span class="badge b-hand">by hand</span></td><td>Individual</td><td>Lab notebook: notes and drawn diagrams from the presentations, records of practicals, closing syntheses and reading sheets.</td><td>Ongoing; reviews 18 Dec and 22 Jan</td></tr>
<tr><td><b>Oral presentation</b></td><td>Group</td><td>Scientific communication adapted to an audience, with hand-written speaker cards. <b>Preparation and submission of the oral papers on 13 Nov</b>, according to the course calendar.</td><td>Preparation &amp; submission: 13 Nov · Delivery: 27 Nov</td></tr>
<tr><td><b>Company dossier</b> <span class="badge b-hand">by hand</span></td><td>Group</td><td>Chapters in clean hand-written copy + printed annexes (data, graphs, references). Submission and defence before the group.</td><td>Submission &amp; defence: 22 Jan (final exam day)</td></tr>
</tbody></table>
<h3>Dossier chapters (systems = project moments)</h3>
<p>Homeostatic framework (T1) · Ch. 1 Physiology of a step (T2) · Ch. 2 The dancing brain (T3) · Ch. 3 Engine &amp; fuel (T4, T7, nutrition) · Ch. 4 Cardio &amp; breathing (T5, T6) · Ch. 5 Integration: performance week (T8).</p>
<h3>Specialisation module</h3>
<p><i>Dance Pedagogy:</i> section "Explaining it in the classroom" (translating physiological concepts + safe, justified warm-up/cool-down). <i>Choreography &amp; Performance:</i> section "My body's user manual" (personal pre-stage and post-show protocol).</p>
<div class="note">The specification of the products (formats, requirements, exact intermediate submission dates) will be detailed in the <b>lecturer's weekly planning</b> once the programme is validated.</div>`},

{id:"metod",t:"7. Methodology and handwriting",h:`
<h3>Principles</h3>
<ul>
<li><b>Dialogued presentation as the base:</b> theory is introduced with a clear conceptual scheme and consolidated with practice and cases. The presentation is never closed within a single session: topics continue, are reviewed and progressively integrated.</li>
<li><b>Situated learning:</b> the company SdA gives professional meaning to every system studied, with physiology at the centre and anatomy as minimum support.</li>
<li><b>Body practice every session:</b> the body lab (measuring and experimenting with one's own body) is an important part of every session and the main tool for achieving the content.</li>
<li><b>Complementary activities:</b> every presentation is developed and consolidated with complementary activities (practicals, cases, sheets, quizzes, seminars) that help students achieve the content.</li>
<li><b>Cooperative work with rotating roles</b>, peer assessment and self-assessment.</li>
<li><b>Self-regulation:</b> students interpret their own data and decide on workload and recovery.</li>
<li><b>Ethical focus:</b> body image and ED prevention treated with non-stigmatising language and professional perspective.</li>
</ul>
<h3>Handwriting <span class="badge b-hand">by hand</span></h3>
<p>The lecturer will work with <b>handwriting</b> as a learning tool. Hand-written notes activate deep encoding processes: they force selection, prioritisation and reformulation —not copying— and hand-drawing diagrams forces the information to be translated into one's own representation. Moreover, the notebook makes progress visible and reviewable with the lecturer. It is implemented as:</p>
<ul>
<li><b>Physiology Notebook (individual):</b> notes and drawn diagrams from the presentations; records of practicals (data, calculations and interpretation); closing synthesis of each session.</li>
<li><b>Hand-written reading sheets</b> (guaranteeing methodical, scientific consultation): full cited reference + key ideas + dance application. <b>Consultation</b> of sources is digital or library-based; what is assessed is the <b>manual product</b>.</li>
<li><b>SdA products in clean hand-written copy</b> (company dossier) with printed annexes when the content requires it (data, graphs, references).</li>
<li><b>Hand-written speaker cards</b> for oral presentations (no screens are read).</li>
<li><b>Written tests by hand</b>, with essential questions linked to the teaching plan's list of indispensable concepts.</li>
</ul>
<div class="note">If a student has specific needs (UDL), adaptations can be made without losing the active-fixation component. The concrete formats and criteria of each manual product will be detailed in the weekly planning.</div>
<h3>Complementary activities (type and purpose)</h3>
<table>
<thead><tr><th>Type</th><th>Purpose</th></tr></thead>
<tbody>
<tr><td>Body-lab practicals (every session)</td><td>First-person experience of the presentation content; generating own data</td></tr>
<tr><td>Hand-writing activities (notebook, diagrams, sheets)</td><td>Fixing and structuring knowledge; making progress visible</td></tr>
<tr><td>Reading sheets with scientific source consultation</td><td>Rigour, citation and professional transfer (S2, A3)</td></tr>
<tr><td>Quizzes and review questions</td><td>Consolidating indispensable concepts and preparing tests</td></tr>
<tr><td>Case studies and debates</td><td>Professional analysis, prevention and ethics (CECI 3)</td></tr>
<tr><td>Oral papers and seminars</td><td>Adapted scientific communication and synthesis (S2)</td></tr>
</tbody></table>
<h3>Attention to diversity</h3>
<ul><li>UDL: content in multiple formats; adaptable products when needed.</li><li>Practicals adapted to injuries or health conditions (never provoking pain).</li><li>Mental health and body image: careful language and referral to the centre's services when needed.</li><li>Structured cooperation with rotating roles to guarantee participation of all profiles.</li></ul>`},

{id:"aval",t:"8. Assessment",h:`
<p>A <b>competence-based, continuous approach</b>: formative assessment (during the process) is combined with summative assessment (at the end). Knowledge is assessed in real professional contexts.</p>
<h3>Weighting</h3>
<div class="note"><b>Provisional weighting:</b> the percentages in the table will be modified manually once the programme has been reviewed with the department.</div>
<table>
<thead><tr><th>Instrument</th><th>Description</th><th>Weight</th><th>LOs</th></tr></thead>
<tbody>
<tr><td><b>Written theory-practice test</b></td><td>Mid-term (18 Dec) + final (22 Jan). Includes <b>essential questions</b> linked to the teaching plan's list of indispensable concepts: all must be passed. With contextualised questions and an integrating case in the final test.</td><td><b>30 %</b></td><td>K1, K2, S1</td></tr>
<tr><td><b>Physiology Notebook</b> <span class="badge b-hand">by hand</span></td><td>Individual: notes and diagrams, practical records, syntheses and reading sheets. Continuous review + formal submissions.</td><td><b>15 %</b></td><td>K2, S2, A1</td></tr>
<tr><td><b>Company dossier + defence</b> <span class="badge b-hand">by hand</span></td><td>Group: chapters in clean hand-written copy + annexes; defence before the group (22 Jan).</td><td><b>20 %</b></td><td>S1, S2, A3</td></tr>
<tr><td><b>Oral presentation</b></td><td>Group (27 Nov): adapted scientific communication with a live demonstration. Rubric + inter-group peer assessment.</td><td><b>20 %</b></td><td>S2, A2, A3</td></tr>
<tr><td><b>Participation and cooperative work</b></td><td>Engagement in practicals and seminars, case solving, care attitudes and professional ethics. Includes self- and peer-assessment (adjustment ±10 %).</td><td><b>15 %</b></td><td>A1, A2</td></tr>
</tbody></table>
<p><b>Formative (unweighted but compulsory):</b> block quizzes, debates and case studies, monitoring tutorials. At the start of the course, the <b>list of indispensable concepts</b> (teaching plan) will be published; it underpins the essential questions of the tests.</p>
<h3>Requirements to pass the course</h3>
<ul>
<li><b>Minimum attendance of 80 %</b> (within the 70-80 % range of the teaching plan; necessary given the practical nature of the sessions).</li>
<li>Submission of the notebook, the dossier and the oral presentation.</li>
<li>Overall grade ≥ 5/10 and <b>written test ≥ 4/10</b>, with the essential questions passed.</li>
</ul>
<h3>Resit and single assessment</h3>
<ul>
<li><b>Resit:</b> global written test in February; the notebook and dossier can be improved; the oral presentation and participation are not recoverable.</li>
<li><b>Single assessment:</b> governed by the Student Guide of the CSD (documented exceptional circumstances).</li>
</ul>
<div class="note"><b>Compatibility note:</b> the official teaching plan states the weighting "continuous 25 % / fundamental questions 25 % / exam 50 %". This proposal renews it while keeping the non-negotiable elements (compulsory exam, indispensable concepts, single assessment, minimum attendance). Pending validation by the department.</div>
<h3>Assessment dimensions of the products</h3>
<p><b>Notebook:</b> regularity and care; precision of records and diagrams; quality of syntheses; complete, well-cited reading sheets. <b>Oral presentation:</b> scientific content; structure; audience-adapted communication; live demonstration; sources and timing. <b>Dossier:</b> physiological grounding; tailoring to the company profile; systems integration (S1); specialisation module; hand-written format and citation; defence. The <b>complete rubrics</b> will be specified in the weekly planning.</p>`},

<li>Tracking apps (HR, sleep, hydration) <b>as a complement</b>: the assessed data are those transcribed by hand into the notebook.</li>
</ul>
<p><b>Selection criteria:</b> scientific rigour, currency, dance specificity, linguistic diversity and accessibility via the Institut del Teatre library.</p>`},

{id:"annex",t:"10. Annex: student worksheets",h:`
<p><span class="badge b-pend">to be specified</span></p>
<p>The operational working documents for students will be specified in the <b>lecturer's weekly planning</b> (work plan for each session) and in specific annexes. Pending specification:</p>
<ul>
<li><b>Physiology Notebook:</b> structure, review criteria and formats.</li>
<li><b>Hand-written reading sheets:</b> model, minimum number and calendar.</li>
<li><b>SdA products of the course:</b> initial company sheet, intermediate products and final dossier (formats, requirements and exact submission dates).</li>
<li><b>Complete rubrics:</b> oral presentation, notebook and dossier.</li>
<li><b>Bank of essential questions</b> and list of indispensable concepts per block.</li>
<li><b>Template of the work plan for each session:</b> timing of all resources and activities (activation &amp; review, presentation, practical part, synthesis).</li>
</ul>
<div class="note">These annexes will be developed once the programme is validated with the department, so they can be adjusted to the final decisions (weighting, submission calendar, formats).</div>`}
]}
};

/* =========================================================
   APLICACIÓ — render, idiomes, edició, persistència
   ========================================================= */
let lang=localStorage.getItem(KEY+'_lang')||'ca';
let overrides=JSON.parse(localStorage.getItem(KEY+'_overrides')||'{}');
let editing=false;

const $=s=>document.querySelector(s);
const U=()=>DATA[lang].ui;
const orig=(id)=>DATA[lang].secs.find(s=>s.id===id).h;
const cur=(id)=>(overrides[lang]&&overrides[lang][id]!==undefined)?overrides[lang][id]:orig(id);

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2200);}

function render(){
  const d=DATA[lang];
  document.documentElement.lang=lang;
  $('#brandTitle').textContent='🩰 '+d.ui.brand;
  $('#brandSub').textContent=d.ui.brandSub;
  $('#bEdit').textContent=editing?d.ui.editing:d.ui.edit;
  $('#bSave').textContent=d.ui.save;
  $('#bExport').textContent=d.ui.export;
  $('#bImport').textContent=d.ui.import;
  $('#bReset').textContent=d.ui.reset;
  $('#bPrint').textContent=d.ui.print;
  document.querySelectorAll('#langBox button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  $('#nav').innerHTML='<strong class="navtitle">'+d.ui.navTitle+'</strong>'+
    d.secs.map((s,i)=>'<a href="#s-'+s.id+'" data-i="'+i+'">'+s.t+'</a>').join('');
  $('#main').innerHTML=d.secs.map(s=>{
    const ed=(overrides[lang]&&overrides[lang][s.id]!==undefined)?'<span class="edited-chip">'+d.ui.edited+'</span>':'';
    return '<section class="card" id="s-'+s.id+'"><h2>'+s.t+ed+'</h2><div class="secbody" data-id="'+s.id+'">'+cur(s.id)+'</div></section>';
  }).join('');
  applyEdit();
  const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id));}})},{rootMargin:'-20% 0px -70% 0px'});
  document.querySelectorAll('section.card').forEach(sec=>obs.observe(sec));
}

function applyEdit(){
  document.querySelectorAll('.secbody').forEach(el=>{
    el.setAttribute('contenteditable',editing?'true':'false');
  });
  document.body.classList.toggle('editing',editing);
}

function save(){
  if(!editing){toast(U().nochanges);return;}
  overrides[lang]=overrides[lang]||{};
  let n=0;
  document.querySelectorAll('.secbody').forEach(el=>{
    const id=el.dataset.id;
    if(el.innerHTML!==orig(id)){overrides[lang][id]=el.innerHTML;n++;}
    else{delete overrides[lang][id];}
  });
  if(!Object.keys(overrides[lang]).length)delete overrides[lang];
  localStorage.setItem(KEY+'_overrides',JSON.stringify(overrides));
  toast(U().saved+' ('+n+') · '+new Date().toLocaleTimeString());
  $('#savestate').textContent=U().saved+' '+new Date().toLocaleTimeString();
  render();
}
function resetLang(){
  if(!confirm(U().resetMsg))return;
  delete overrides[lang];
  localStorage.setItem(KEY+'_overrides',JSON.stringify(overrides));
  render();toast(U().saved);
}
function exportJSON(){
  const blob=new Blob([JSON.stringify({app:KEY,exported:new Date().toISOString(),overrides},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='plaC-rev2-edicions.json';a.click();
}
function importJSON(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const j=JSON.parse(e.target.result);
      if(j.overrides){overrides=j.overrides;localStorage.setItem(KEY+'_overrides',JSON.stringify(overrides));render();toast(U().saved);}
      else toast('Format no vàlid');
    }catch(err){toast('Error: fitxer no vàlid');}
  };
  r.readAsText(file);
}

 $('#langBox').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(editing&&!confirm("Canviar d'idioma tanca el mode d'edició sense desar. Continuar?"))return;
  editing=false;lang=b.dataset.lang;localStorage.setItem(KEY+'_lang',lang);render();
});
 $('#bEdit').onclick=()=>{editing=!editing;applyEdit();$('#bEdit').textContent=editing?U().editing:U().edit;};
 $('#bSave').onclick=save;
 $('#bReset').onclick=resetLang;
 $('#bExport').onclick=exportJSON;
 $('#bPrint').onclick=()=>window.print();
 $('#bImport').onclick=()=>$('#fileImp').click();
 $('#fileImp').onchange=e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value='';};

render();
</script>
</body>
</html>
