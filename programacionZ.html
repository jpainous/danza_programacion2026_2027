{id:"fitxes",t:"8. Student work: worksheets",h:`
<h3>Sheet 0 — Company Profile Sheet (individual/group · 9 Oct)</h3>
<p>Company name and profile, discipline, season repertoire, performance calendar, dancer profile (age, level, weekly dancing hours) and 3 health concerns of the group.</p>
<h3>Sheet 1 — SdA 1: "Anatomy of a dance step" (group · due 30 Oct)</h3>
<ul>
<li>Choose a technical element from the company's repertoire (<i>plié, développé, grand jeté</i>, pirouette, arm elevation…).</li>
<li><b>Product:</b> (a) anatomical sheet (1-2 pages): bones and joints involved, main muscles by phase (preparation-action-reception), contraction type, 2 risk injuries + 1 preventive measure; (b) 2-3 min annotated video (arrows, labels or voice-over).</li>
<li>Minimum 3 cited sources (one from IADMS). Individual statement of contributions.</li>
</ul>
<h3>Sheet 2 — SdA 2: "The dancing brain" (group · presentation 27 Nov)</h3>
<ul>
<li>Each group answers <b>one research question</b> (10 min + 2 min of questions, minimum 5 references, with <b>1 live demonstration or experiment</b> with the audience):</li>
</ul>
<ol>
<li>Why do we <i>spot</i>? 2. How is a choreography consolidated while we sleep? 3. What is motor memory and how is it trained? 4. What happens in the body during stage fright? 5. Why does turning cause vertigo and how does the vestibular system adapt? 6. How does fatigue affect proprioception? 7. Mental vs. physical practice: what does science say? 8. Mirrors and body image: what does the brain perceive? 9. Why do nerves make movement uncoordinated? 10. What is the best rehearsal schedule according to the brain?</li>
</ol>
<ul><li>Every member presents one section. Inter-group peer assessment with a standardised form.</li></ul>
<h3>Sheet 3 — SdA 3: "Physiological plan for performance week" (group · due 20 Jan, defence 22 Jan)</h3>
<p>Integral plan for a typical company week (3-4 h dancing/day, 2 shows):</p>
<ol>
<li><b>Diagnosis:</b> estimated energy demands and profile risks.</li>
<li><b>Conditioning:</b> target HR zones (from P6 data), 1 complementary cardio session, cool-down and recovery protocol.</li>
<li><b>Nutrition:</b> pre-show menu, hydration and post-show recovery (validated by the dietitian).</li>
<li><b>Sleep &amp; stress:</b> sleep hygiene on tour + stage-fright management protocol (breathing, visualisation).</li>
<li><b>Specialisation module</b> (see §4).</li>
</ol>
<p>The <b>final dossier</b> integrates: SdA 1 sheet + SdA 2 summary + SdA 3 plan + practical-data annex. Draft due 15 Jan (feedback), final version 20 Jan, defence 22 Jan.</p>`},

{id:"diversitat",t:"9. Diversity and inclusive measures",h:`
<ul>
<li><b>UDL:</b> all content in multiple formats (text, video, hands-on); products with diverse means of expression.</li>
<li><b>Adapted practicals:</b> any current injury or health condition is accommodated with alternative measurements or a documented observer role (never forcing pain or discomfort).</li>
<li><b>Mental health and body image:</b> non-stigmatising language, the endocrine/nutrition block treated from an eating-disorder-prevention perspective, referral to the centre's services when needed.</li>
<li><b>Structured cooperation:</b> rotating roles to guarantee participation of all profiles; peer tutoring.</li>
<li>Language support: highly specialised Spanish/Catalan glossary on the virtual campus.</li>
</ul>`},

{id:"materials",t:"10. Materials, resources and bibliography",h:`
<p>Open studio space with free movement area; projector; pulse oximeters or HR apps; measuring tape; anatomical models and 3D anatomy app; virtual campus (sheets, quizzes, submissions); standardised practical worksheets.</p>
<p><b>Recommended bibliography:</b> Tortora &amp; Derrickson, <i>Principles of Anatomy and Physiology</i>; Calais-Germain, <i>Anatomy of Movement</i>; Haas, <i>Dance Anatomy</i>; Quin, Rafferty &amp; Tomlinson, <i>Safe Dance Practice</i>; Krasnow &amp; Wilmerding, <i>Motor Learning and Control for Dance</i>; resources and statements of the <b>IADMS</b> (iadms.org).</p>`},

{id:"avaluacio",t:"11. Assessment",h:`
<h3>11.1 Assessment criteria</h3>
<ul>
<li><b>AC1</b> Explains the physiological mechanisms of the systems studied as applied to danced movement.</li>
<li><b>AC2</b> Analyses dance technical elements from functional anatomy and identifies risk factors.</li>
<li><b>AC3</b> Collects and interprets personal physiological data to assess load and recovery.</li>
<li><b>AC4</b> Designs evidence-based prevention, nutrition, sleep and performance strategies for a real professional context.</li>
<li><b>AC5</b> Communicates scientific knowledge rigorously, orally and in writing, adapting it to the audience.</li>
<li><b>AC6</b> Finds, cross-checks and cites reliable scientific sources.</li>
<li><b>AC7</b> Cooperates and exercises individual responsibility within group work.</li>
<li><b>AC8</b> (specialisation) Translates physiological concepts into safe didactic proposals / into a personal performance protocol.</li>
</ul>
<h3>11.2 Assessment activities and weighting</h3>
<table>
<thead><tr><th>#</th><th>Activity</th><th>Instrument</th><th>Weight</th><th>Mode</th><th>Timing</th></tr></thead>
<tbody>
<tr><td>A1</td><td>Formative block quizzes</td><td>Online quiz / Kahoot</td><td><i>Formative</i></td><td>Individual</td><td>13 Nov, 4 Dec, 8 Jan</td></tr>
<tr><td>A2</td><td>Practical sheets (P1-P7)</td><td>Recording sheet: data + interpretation</td><td>10 %</td><td>Individual</td><td>Ongoing</td></tr>
<tr><td>A3</td><td>Learning portfolio (7 entries)</td><td>Checklist + qualitative appraisal</td><td>10 %</td><td>Individual</td><td>Ongoing</td></tr>
<tr><td>A4</td><td>SdA 1: video + anatomical sheet</td><td>Anatomical-analysis rubric</td><td>8 %</td><td>Group</td><td>30 Oct</td></tr>
<tr><td>A5</td><td>SdA 2: oral presentation</td><td>Rubric + inter-group peer assessment</td><td>10 %</td><td>Group (individual part: speaking)</td><td>27 Nov</td></tr>
<tr><td>A6</td><td>SdA 3: dossier + defence</td><td>Rubric + defence questions</td><td>12 %</td><td>Group</td><td>20-22 Jan</td></tr>
<tr><td>A7</td><td>Mid-term exam</td><td>Written test (90 min)</td><td>20 %</td><td>Individual</td><td>18 Dec</td></tr>
<tr><td>A8</td><td>Final exam</td><td>Written test (2 h)</td><td>30 %</td><td>Individual</td><td>22 Jan</td></tr>
<tr><td>A9</td><td>Cooperative self-assessment</td><td>Individual statement of contributions</td><td>Adjustment ±10 %</td><td>Individual</td><td>End of each SdA</td></tr>
</tbody></table>
<h3>11.3 Activity descriptions</h3>
<p><b>A1 · Formative quizzes (0 %):</b> 10 min, 8-10 items; immediate feedback; detect gaps before exams.</p>
<p><b>A2 · Practical sheets:</b> in each practical (homeostasis, palpation, motor learning, balance/vestibular, hydration, HR in class, breathing) students record data and interpret it in 10-15 lines. Precision of recording and quality of physiological interpretation are assessed.</p>
<p><b>A3 · Individual portfolio</b> (7 entries, 15-20 min each): 1) health expectations and concerns; 2) what I discovered about my body in SdA 1; 3) what I will apply from brain/learning to my rehearsals; 4) post-presentation reflection; 5) body image and eating: my takeaways; 6) what my class data tell me; 7) final metacognition: what I will do differently. Criteria: regularity, reflective depth, theory-experience connection.</p>
<p><b>A4 · SdA 1 rubric</b> (dimensions): anatomical accuracy; application to real movement; injuries and prevention; technical quality of the video; source citation.</p>
<p><b>A5 · Oral presentation rubric:</b></p>
<table>
<thead><tr><th>Criterion</th><th>Excellent (4)</th><th>Good (3)</th><th>Pass (2)</th><th>Fail (1)</th></tr></thead>
<tbody>
<tr><td>Scientific content</td><td>Rigorous, up to date, well explained</td><td>Correct with minor imprecision</td><td>Basic, with occasional errors</td><td>Serious errors or gaps</td></tr>
<tr><td>Structure</td><td>Clear question-evidence-conclusion</td><td>Logical with minor mismatches</td><td>Followable but confusing</td><td>Disorganised</td></tr>
<tr><td>Communication</td><td>Engaging, audience-adapted</td><td>Fluent, minimal reading</td><td>Script-dependent</td><td>Reads, no connection</td></tr>
<tr><td>Live demonstration</td><td>Relevant, safe, well integrated</td><td>Relevant but weakly integrated</td><td>Superficial</td><td>Absent or irrelevant</td></tr>
<tr><td>Sources &amp; timing</td><td>5+ sources, on time</td><td>Enough sources, slight overrun</td><td>Few sources or overtime</td><td>No sources, no timing control</td></tr>
</tbody></table>
<p>Peer assessment (5-item form per group) adjusts the presentation mark by up to 1 point.</p>
<p><b>A6 · Dossier + defence rubric</b> (dimensions): physiological grounding; feasibility and tailoring to the company profile; nutrition-sleep-load integration; specialisation module; format, visual design and citation; quality of defence answers (5-min pitch + 3 questions).</p>
<p><b>A7 · Mid-term exam (18 Dec, 90 min):</b> 20 multiple-choice questions (40 %) + 3 contextualised essay questions (45 %) + 1 mini-case (15 %). <i>Examples:</i> "During the landing of a <i>grand jeté</i>, what do the hamstrings of the front leg do? Justify your answer"; "A dancer has recurrent vertigo in pirouettes: explain the vestibular structure involved and why <i>spotting</i> helps".</p>
<p><b>A8 · Final exam (22 Jan, 2 h):</b> same format on block 4 and transversal content + <b>1 integrating question on the whole course</b>: "The company's HR logs show slow recovery after <i>allegro</i>. Propose two physiological explanations and two actions from your health plan".</p>
<p><b>A9 · Cooperative self-assessment:</b> at the end of each SdA, an individual statement of contributions; allows the group mark to be adjusted individually (±10 %).</p>
<h3>11.4 Minimum requirements, recovery and monitoring</h3>
<ul>
<li><b>Minimum attendance of 80 %</b> at contact sessions to be assessable in practical activities.</li>
<li><b>Minimums:</b> final exam ≥ 4 (out of 10) to compute the weighted average; all group products submitted.</li>
<li><b>Recovery:</b> global written re-sit in February (replaces the exam mark if higher); group products may be resubmitted within one week with a maximum grade of "good" (notable); the oral presentation is recovered in a tutorial.</li>
<li><b>Monitoring:</b> grades visible on the campus; weekly tutorials; direct communication of failure risk after the mid-term.</li>
</ul>`},

{id:"temari",t:"12. Physiological outline of every session",h:`
<h3>Topic 0 · Introduction, homeostasis and cell physiology (9 Oct)</h3>
<h4>1. Introduction to physiology</h4>
<ul><li>Concept of physiology; levels of organisation (cell → tissue → organ → system → organism)</li><li>The four foundations: structure-function relationship, gradients, communication, energy (ATP)</li></ul>
<h4>2. Homeostasis</h4>
<ul><li>Internal environment (Claude Bernard) and homeostasis (Cannon)</li><li>Control system: regulated variable, sensors, integration centre, effectors</li><li>Negative feedback (temperature, blood glucose, osmolarity) and positive feedback (birth, clotting)</li><li>Exercise as homeostatic disturbance: ↑temperature, ↓pH, ↓plasma volume, ↓glycogen</li><li><b>Dance application:</b> fatigue as temporary imbalance; recovery as return to equilibrium; why "warming up" and "cooling down" are homeostatic regulations</li></ul>
<h4>3. Cell physiology</h4>
<ul><li>Plasma membrane: lipid bilayer and proteins; selective permeability</li><li>Passive transport (simple and facilitated diffusion, osmosis) and active transport (Na⁺/K⁺ pump)</li><li>Membrane potential and excitability (basis of nerve and muscle)</li><li>Functional organelles: mitochondria (energy), sarcoplasmic reticulum (Ca²⁺), ribosomes (proteins)</li><li>Intercellular communication: chemical signals and receptors</li><li>Cell types of the course: muscle fibre, neuron, osteocyte, chondrocyte, erythrocyte</li><li><b>Application:</b> what happens to the muscle cell during an <i>allegro</i>? ATP, Ca²⁺, metabolites</li></ul>
<h3>Topic 1 · Musculoskeletal system I (16 Oct) — <i>Bone and joints</i></h3>
<h4>1. System overview</h4>
<ul><li>Functions: support, movement, protection, minerals, haematopoiesis</li><li>Connective tissue: collagen and elastin (basis of tendon, ligament, fascia, capsule)</li></ul>
<h4>2. Bone tissue</h4>
<ul><li>Compact and spongy bone; matrix (collagen + hydroxyapatite)</li><li>Bone cells: osteoblasts, osteocytes, osteoclasts</li><li>Bone remodelling and <b>Wolff's law</b>: bone adapts to load</li><li>Long bone structure: diaphysis, epiphysis, growth cartilage, marrow</li><li><b>Application:</b> bone adaptation to dance impact; stress fractures (metatarsals, tibia); osteopenia and bone health (link with RED-S, topic 7)</li></ul>
<h4>3. Articular cartilage</h4>
<ul><li>Types (hyaline, fibrocartilage); avascularity → nutrition by diffusion through movement</li></ul>
<h4>4. Joints</h4>
<ul><li>Classification: fibrous, cartilaginous, synovial</li><li>Synovial joint structure: capsule, synovial fluid, menisci, labrum</li><li>Anatomical planes and axes; movement terminology (flexion/extension, abduction, rotation, dorsiflexion/plantarflexion, pronation/supination)</li><li>Range of motion: limiting factors</li><li><b>Hypermobility:</b> Beighton test; aesthetic advantages vs. injury risk</li><li><b>Application:</b> <i>turnout</i> from the hip vs. forced at knee/ankle; <i>en pointe</i>; shoulder stabilisation in <i>port de bras</i></li></ul>
<h3>Topic 2 · Musculoskeletal system II (23 Oct) — <i>Muscle</i></h3>
<h4>1. Structure of skeletal muscle</h4>
<ul><li>Belly, origin and insertion, tendon; epimysium, perimysium, endomysium</li><li>The muscle fibre: sarcolemma, sarcoplasmic reticulum, myofibrils</li></ul>
<h4>2. Muscle contraction</h4>
<ul><li>The sarcomere: actin, myosin, troponin, tropomyosin; A and I bands</li><li>Sliding filament theory; excitation-contraction coupling (role of Ca²⁺ and ATP)</li><li>Cross-bridge cycle; rigor and ATP shortage</li></ul>
<h4>3. Fibre types and motor unit</h4>
<ul><li>Type I (slow/oxidative) vs. IIa/IIx (fast/glycolytic) fibres; the dancer's profile</li><li>Motor unit: motor neuron + fibres; size principle and recruitment</li></ul>
<h4>4. Contraction types and muscle function</h4>
<ul><li>Isometric, concentric, <b>eccentric</b> (basis of DOMS: soreness)</li><li>Muscle roles: agonist, antagonist, synergist, fixator; co-contraction</li><li><b>Application:</b> muscle analysis of <i>plié</i> (eccentric), <i>relevé</i> (concentric), balance (isometric), <i>grand jeté</i> (full sequence)</li></ul>
<h4>5. Muscle proprioception</h4>
<ul><li>Muscle spindle (myotatic reflex) and Golgi tendon organ</li></ul>
<h4>6. Muscle fatigue and flexibility</h4>
<ul><li>Fatigue mechanisms; cramps; viscoelastic properties and stretching</li><li>Typical dance musculotendinous injuries: strains, tendinopathies (Achilles, rotator cuff)</li></ul>
<h3>— Self-directed day (30 Oct) —</h3>
<p>No on-site teaching: non-contact work on the musculoskeletal block.</p>
<h3>Topic 3 · Nervous system I (6 Nov) — <i>Neuron and movement control</i></h3>
<h4>1. Organisation of the nervous system</h4>
<ul><li>CNS / PNS; afferent and efferent pathways; somatic and autonomic</li></ul>
<h4>2. The neuron</h4>
<ul><li>Structure: soma, dendrites, axon, myelin; neuroglia</li><li>Resting potential, action potential; saltatory conduction and speed</li></ul>
<h4>3. Synapse</h4>
<ul><li>Chemical synapse; key neurotransmitters (ACh, glutamate, GABA, dopamine, serotonin, <b>endorphins</b>)</li><li>Integration: summation, excitation and inhibition</li></ul>
<h4>4. Motor control</h4>
<ul><li>Motor and premotor cortex; descending pathways; the motor neuron as final common pathway</li><li><b>Cerebellum:</b> coordination, timing, balance</li><li><b>Basal ganglia:</b> automatisation of learned movements</li><li><b>Plasticity and motor learning:</b> stages (cognitive → associative → autonomous); motor memory</li><li><b>Application:</b> how a choreography is learned; distributed vs. massed rehearsal; mental practice/visualisation; why "automatised" movement frees attention for interpretation</li></ul>
<h3>Topic 4 · Oral presentation workshop (13 Nov)</h3>
<p>No new physiological content: methodology session (source searching, scientific structure, oral communication) and group tutorials.</p>
<h3>Topic 5 · Nervous system II / Sleep (20 Nov)</h3>
<h4>1. Sensation and balance</h4>
<ul><li>Proprioception (spindles, joint receptors) + vision + <b>vestibular system</b></li><li>Vestibular apparatus: otoliths (utricle/saccule) and semicircular canals (endolymph)</li><li><b>Rotational vertigo, nystagmus and vestibular adaptation</b></li><li><b>Application:</b> why <i>spotting</i> works; turning as vestibular training; balance impairment under fatigue</li></ul>
<h4>2. Autonomic nervous system</h4>
<ul><li>Sympathetic vs. parasympathetic; autonomic tone</li><li><b>Stage-fright stress response:</b> adrenaline (tachycardia, trembling, dry mouth), Yerkes-Dodson curve (optimal arousal)</li><li><b>Application:</b> controlling opening-night nerves; breathing as a parasympathetic activator; pre-stage routines</li></ul>
<h4>3. Sleep</h4>
<ul><li>Sleep architecture: NREM (1-3) and REM stages; circadian rhythms</li><li>Functions: <b>motor memory consolidation</b> (choreography "sets in" while sleeping), GH secretion, tissue repair</li><li>Sleep deprivation: attention, reaction time, injury risk</li><li><b>Application:</b> dancer's sleep hygiene; evening shows and tours; naps; caffeine</li></ul>
<h3>Topic 6 · Oral presentations / Blood (27 Nov)</h3>
<p><b>First part:</b> oral presentations (assessment of the nervous block).</p>
<h4>1. Blood composition</h4>
<ul><li>Plasma (water, proteins, electrolytes, nutrients) and formed elements (haematocrit)</li></ul>
<h4>2. Erythrocytes</h4>
<ul><li>Haemoglobin; O₂ and CO₂ transport; erythropoiesis</li><li><b>Training adaptation:</b> ↑plasma volume and transport capacity</li></ul>
<h4>3. Leukocytes and platelets</h4>
<ul><li>Immune function and inflammation (link with recovery and injuries); haemostasis</li></ul>
<h4>4. Blood in dance</h4>
<ul><li><b>Iron-deficiency anaemia in dancers:</b> unexplained fatigue, ferritin, higher risk in women, impact on aerobic performance</li><li>Basic interpretation of a blood test</li></ul>
<h3>Topic 7 · Endocrine system (4 Dec)</h3>
<h4>1. Endocrinology fundamentals</h4>
<ul><li>Hormone, target gland, receptors; protein vs. steroid hormones</li><li>Hypothalamus-pituitary axis and <b>feedback</b></li></ul>
<h4>2. Main hormonal axes</h4>
<ul><li>Pituitary: GH, ACTH, TSH, gonadotropins, ADH</li><li>Thyroid: T3/T4 and <b>basal metabolism</b></li><li>Parathyroid: PTH and calcium regulation (link with bone)</li><li>Adrenal gland: <b>catecholamines</b> (adrenaline: fight-or-flight) and <b>cortisol</b> (stress, catabolism); aldosterone</li><li>Endocrine pancreas: <b>insulin/glucagon</b> and blood glucose (link with nutrition)</li><li>Gonads: oestrogens, progesterone, testosterone; <b>menstrual cycle and performance</b></li></ul>
<h4>3. Hormones, stress and dance</h4>
<ul><li>Hormonal response to acute exercise and overtraining (chronic cortisol)</li><li><b>Low energy availability and RED-S:</b> hormonal disruption, amenorrhoea, bone health (integration of topics 1, 6 and 8)</li><li><b>Application:</b> opening-night adrenaline; menstrual health as an indicator of overall health; stigma-free professional communication</li></ul>
<h3>Topic 8 · Nutrition (11 Dec) — <i>with dietitian + practical</i></h3>
<h4>1. Muscle fuel (integrative review)</h4>
<ul><li>ATP and energy systems: phosphagens, glycolysis, oxidative metabolism</li><li>Dominant systems by dance demand (jump vs. long variation vs. improvisation)</li></ul>
<h4>2. Macronutrients</h4>
<ul><li>Carbohydrates: muscle and liver glycogen; performance</li><li>Proteins: repair and adaptation; dancer's requirements</li><li>Fats: hormonal and energy function; essential fatty acids</li></ul>
<h4>3. Micronutrients and hydration</h4>
<ul><li>Iron, calcium, vitamin D (link with blood and bone)</li><li>Fluid balance; hypohydration and loss of performance and coordination</li></ul>
<h4>4. Applied nutrition</h4>
<ul><li>Nutrient timing: pre-rehearsal, post-class recovery, show day</li><li><b>Energy availability, body image and EDs in dance:</b> warning signs and professional attitude</li><li><b>Practical:</b> analysis of real menus, planning a show day with the dietitian</li></ul>
<h3>Topic 9 · MID-TERM ASSESSMENT (18 Dec)</h3>
<p>Written test on topics 0-7. Graded feedback before the holidays.</p>
<h3>Topic 10 · Cardiovascular system (8 Jan)</h3>
<h4>1. The heart</h4>
<ul><li>Structure: chambers, valves, myocardium, coronary arteries</li><li>Conduction system: sinoatrial and atrioventricular nodes; myocardium as self-excitable muscle</li><li>Cardiac cycle: systole/diastole; <b>cardiac output = HR × stroke volume</b></li></ul>
<h4>2. Vessels and blood pressure</h4>
<ul><li>Arteries, capillaries, veins; venous return (role of the <b>muscle pump</b>: why to keep moving after exertion)</li></ul>
<h4>3. Regulation</h4>
<ul><li>Autonomic (sympathetic ↑HR / parasympathetic ↓HR), hormonal and local</li></ul>
<h4>4. Cardiovascular system and dance</h4>
<ul><li>Exercise response: HR, flow redistribution, blood pressure</li><li><b>Max HR and intensity zones;</b> dance as intermittent exercise (intensity profile of a class: barre vs. allegro vs. repertoire)</li><li>Training adaptations: resting bradycardia, ↑stroke volume</li><li><b>Heart-rate recovery</b> as a fitness indicator</li><li><b>Practical:</b> measuring HR in a real class and calculating zones</li></ul>
<h3>Topic 11 · Respiratory system (15 Jan)</h3>
<h4>1. Structure</h4>
<ul><li>Airways (conduction) and exchange zone: <b>alveoli</b>; pleura</li></ul>
<h4>2. Ventilatory mechanics</h4>
<ul><li>Diaphragm and intercostals; pressures and inspiration/expiration</li><li>Lung volumes and capacities: tidal volume, VC, residual volume</li></ul>
<h4>3. Gas exchange and transport</h4>
<ul><li>Alveolar-capillary diffusion; role of haemoglobin (integration with blood)</li><li>Regulation of ventilation: CO₂-sensitive chemoreceptors (why "breathlessness" is not lack of O₂)</li></ul>
<h4>4. Breathing and exercise</h4>
<ul><li>Ventilation and O₂ consumption; <b>VO₂max</b>; ventilatory threshold</li><li><b>EPOC (oxygen debt)</b> and active recovery</li><li>The complete O₂ chain: lungs → blood → heart → muscle (course synthesis)</li></ul>
<h4>5. Breathing applied to dance</h4>
<ul><li>Diaphragmatic vs. shallow costal breathing; avoiding apnoea/Valsalva during exertion</li><li>Breath-movement phase coordination (<i>port de bras</i>, jumps, adagio)</li><li>Breathing as a tool for regulating stage stress (transversal closing with the autonomic nervous system)</li><li><b>Practical:</b> breathing exercises and simple ventilation tests</li></ul>
<h3>Topic 12 · FINAL EXAM (22 Jan)</h3>
<p>Cumulative written test with emphasis on cardiovascular, respiratory and integration (case-type question: "a performance week").</p>
<h3>Transversal notes</h3>
<ul>
<li><b>Common thread:</b> homeostasis (topic 0) reappears in every system: temperature and water (cardio), Ca²⁺ and pH (muscle), blood glucose (endocrine-nutrition), CO₂ (respiratory).</li>
<li><b>Integrative review:</b> each topic opens with 10-15 min connecting to the previous one; practicals measure variables of one's own body to reinforce transfer.</li>
<li>The four days without theoretical content (30 Oct, 13 Nov, 18 Dec, 22 Jan) are devoted to tutored autonomous work, product preparation and assessment.</li>
</ul>`}
]}
};

/* =========================================================
   APLICACIÓ — render, idiomes, edició, persistència
   ========================================================= */
let lang=localStorage.getItem(KEY+'_lang')||'es';
let overrides=JSON.parse(localStorage.getItem(KEY+'_overrides')||'{}');
let editing=false;

const $=s=>document.querySelector(s);
const U=()=>DATA[lang].ui;
const orig=(id)=>DATA[lang].secs.find(s=>s.id===id).h;
const cur=(id)=>(overrides[lang]&&overrides[lang][id]!==undefined)?overrides[lang][id]:orig(id);

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),2200);}

function render(){
  const d=DATA[lang];
  document.documentElement.lang=lang;
  $('#brandTitle').textContent='🩰 '+d.ui.brand;
  $('#brandSub').textContent=d.ui.brandSub;
  $('#bEdit').textContent=editing?d.ui.editing:d.ui.edit;
  $('#bSave').textContent=d.ui.save;
  $('#bExport').textContent=d.ui.export;
  $('#bImport').textContent=d.ui.import;
  $('#bReset').textContent=d.ui.reset;
  $('#bPrint').textContent=d.ui.print;
  document.querySelectorAll('#langBox button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  // nav
  $('#nav').innerHTML=d.ui.navTitle?`<strong style="display:block;padding:.3rem .5rem;color:var(--granate);font-size:.8rem;text-transform:uppercase;letter-spacing:.5px">${d.ui.navTitle}</strong>`:''+
    d.secs.map((s,i)=>`<a href="#s-${s.id}" data-i="${i}">${s.t}</a>`).join('');
  // main
  $('#main').innerHTML=d.secs.map(s=>`
    <section class="card" id="s-${s.id}">
      <h2>${s.t}${(overrides[lang]&&overrides[lang][s.id]!==undefined)?`<span class="edited-chip">${d.ui.edited}</span>`:''}</h2>
      <div class="secbody" data-id="${s.id}">${cur(s.id)}</div>
    </section>`).join('');
  applyEdit();
  // nav activa
  const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+e.target.id));}})},{rootMargin:'-20% 0px -70% 0px'});
  document.querySelectorAll('section.card').forEach(sec=>obs.observe(sec));
}

function applyEdit(){
  document.querySelectorAll('.secbody').forEach(el=>{
    el.setAttribute('contenteditable',editing?'true':'false');
  });
  document.body.classList.toggle('editing',editing);
}

/* ---- guardar / restaurar ---- */
function save(){
  if(!editing){toast(U().nochanges);return;}
  overrides[lang]=overrides[lang]||{};
  let n=0;
  document.querySelectorAll('.secbody').forEach(el=>{
    const id=el.dataset.id;
    if(el.innerHTML!==orig(id)){overrides[lang][id]=el.innerHTML;n++;}
    else{delete overrides[lang][id];}
  });
  if(!Object.keys(overrides[lang]).length)delete overrides[lang];
  localStorage.setItem(KEY+'_overrides',JSON.stringify(overrides));
  toast(U().saved+' ('+n+') · '+new Date().toLocaleTimeString());
  $('#savestate').textContent=U().saved+' '+new Date().toLocaleTimeString();
  render();
}
function resetLang(){
  if(!confirm(U().resetMsg))return;
  delete overrides[lang];
  localStorage.setItem(KEY+'_overrides',JSON.stringify(overrides));
  render();toast(U().saved);
}
function exportJSON(){
  const blob=new Blob([JSON.stringify({app:KEY,exported:new Date().toISOString(),overrides},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='programacio-fisiologia-edicions.json';a.click();
}
function importJSON(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const j=JSON.parse(e.target.result);
      if(j.overrides){overrides=j.overrides;localStorage.setItem(KEY+'_overrides',JSON.stringify(overrides));render();toast(U().saved);}
      else toast('Format no vàlid');
    }catch(err){toast('Error: fitxer no vàlid');}
  };
  r.readAsText(file);
}

/* ---- events ---- */
 $('#langBox').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(editing&&!confirm('Canviar d\'idioma tanca el mode d\'edició sense desar. Continuar?'))return;
  editing=false;lang=b.dataset.lang;localStorage.setItem(KEY+'_lang',lang);render();
});
 $('#bEdit').onclick=()=>{editing=!editing;applyEdit();$('#bEdit').textContent=editing?U().editing:U().edit;};
 $('#bSave').onclick=save;
 $('#bReset').onclick=resetLang;
 $('#bExport').onclick=exportJSON;
 $('#bPrint').onclick=()=>window.print();
 $('#bImport').onclick=()=>$('#fileImp').click();
 $('#fileImp').onchange=e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value='';};

render();
</script>
</body>
</html>
