  .add{background:var(--pri2);color:#fff;border:none;border-radius:8px;padding:.3rem .65rem;font-size:.78rem;font-weight:600;cursor:pointer}

 for(i=0;i<x.res.length;i++){a=x.res[i];a.id=a.id||uid();a.txt=a.txt||'';a.vis=(a.vis!==false);}
 if(!x.av)x.av=[];
 for(i=0;i<x.av.length;i++){a=x.av[i];a.id=a.id||uid();a.txt=a.txt||'';a.vis=(a.vis!==false);}
 x.objVis=(x.objVis!==false);x.compVis=(x.compVis!==false);x.evVis=(x.evVis!==false);
 if(x.obj==null)x.obj='';if(x.comp==null)x.comp='';if(x.ev==null)x.ev='';

}

var GENERIC=['index.html','index.htm','index.php','default.html','main.html','home.html',
             'edit','view','watch','print','preview','share','download','embed'];
function pathParts_(u){
  var m=String(u).match(/^https?:\/\/([^\/#?]+)([^#?]*)/i);
  if(!m)return null;
  return {dom:m[1],parts:m[2].split('/').filter(Boolean)};
}
function linkLabel_(u,segments){
  var p=pathParts_(u);
  if(!p)return String(u);
  if(!p.parts.length)return p.dom;
  var n=Math.min(segments,p.parts.length);
  return '/'+p.parts.slice(-n).join('/');
}
function linkLabelSmart_(u){
  var p=pathParts_(u);
  if(!p)return String(u);
  if(!p.parts.length)return p.dom;
  var last=p.parts[p.parts.length-1];
  var gen=GENERIC.indexOf(last.toLowerCase())>-1;
  var segs=(gen||(last.length<5&&p.parts.length>1))?2:1;
  return linkLabel_(u,segs);
}
function hiHaDuplicades(arr){
  var i,j,a,b;
  for(i=0;i<arr.length;i++)for(j=i+1;j<arr.length;j++){
    a=String(arr[i]).toLowerCase();b=String(arr[j]).toLowerCase();
    if(a===b)return true;
  }
  return false;
}
function updateLinks(row,txt){
  if(!row)return;
  var box=row.querySelector('.lks');
  if(!box)return;
  var urls=String(txt||'').match(/https?:\/\/[^\s]+/g)||[];
  if(!urls.length){box.style.display='none';box.innerHTML='';return;}
  urls=urls.map(function(u){return u.replace(/[.,;:!?"']+$/,'');});
  var labels=urls.map(linkLabelSmart_);
  if(hiHaDuplicades(labels))labels=urls.map(function(u){return linkLabel_(u,2);});
  if(hiHaDuplicades(labels))labels=urls.map(function(u){
    var p=pathParts_(u);
    return p?p.dom+linkLabel_(u,2):String(u);
  });
  box.style.display='flex';
  box.innerHTML=urls.map(function(u,i){
    var v=labels[i];
    if(v.length>44)v='…'+v.slice(-44);
    return '<a href="'+esc(u)+'" target="_blank" rel="noopener" title="'+esc(u)+'">&#128279; '+esc(v)+'</a>';
  }).join('');
}
function refreshAllLinks(root){
 if(!root)return;
 var rows=root.querySelectorAll('.row'),i;
 for(i=0;i<rows.length;i++){
  var ta=rows[i].querySelector('textarea');
  updateLinks(rows[i],ta?ta.value:'');
 }
}

/* ================== EDICIO ================== */
function ancestorWithSid(el){
 var n=el;
 while(n&&n!==document.body){
  if(n.getAttribute&&n.getAttribute('data-sid'))return n;
  n=n.parentNode;
 }
 return null;
}
function findSession(cardEl){
 var sid=cardEl.getAttribute('data-sid');
 for(var i=0;i<plan.sessions.length;i++)if(plan.sessions[i].id===sid)return plan.sessions[i];
 return null;
}
function removeById(arr,id){var out=[],i;for(i=0;i<arr.length;i++)if(arr[i].id!==id)out.push(arr[i]);return out;}
function idxOf(id){var i;for(i=0;i<plan.sessions.length;i++)if(plan.sessions[i].id===id)return i;return -1;}

function moveSession(id,dir){
 var i=idxOf(id);
 if(i<0)return;
 var j=i+dir;
 if(j<0||j>=plan.sessions.length)return;
 var tmp=plan.sessions[i];plan.sessions[i]=plan.sessions[j];plan.sessions[j]=tmp;
 render();scheduleSave();
}

function dupSession(id){
 var i=idxOf(id);
 if(i<0)return;
 var src=plan.sessions[i];
 var c;
 try{c=JSON.parse(JSON.stringify(src));}catch(e){return;}
 c.id=uid();
 c.topic=(src.topic?src.topic+' ':'')+'(copia)';
 var j;
 for(j=0;j<c.acts.length;j++)c.acts[j].id=uid();
 for(j=0;j<c.res.length;j++)c.res[j].id=uid();
 for(j=0;j<c.av.length;j++)c.av[j].id=uid();
 plan.sessions.splice(i+1,0,c);
 EXP[c.id]=true;
 render();scheduleSave();
 var el=$('c-'+c.id);
 if(el&&el.scrollIntoView)el.scrollIntoView();
}

function onEdit(e){
 var el=e.target;
 if(!el.getAttribute)return;
 var cardEl=ancestorWithSid(el);
 if(!cardEl)return;
 var x=findSession(cardEl);
 if(!x)return;
 var i,f=el.getAttribute('data-f');
 if(f!==null&&f!==undefined&&f!==''){
  if(f==='date'||f==='topic'||f==='obj'||f==='comp'||f==='ev')x[f]=el.value;
  if(f==='objVis'||f==='compVis'||f==='evVis')x[f]=el.checked;
  if(f==='date'||f==='topic'){var m=cardEl.querySelector('.cmeta');if(m)m.innerHTML=metaHTML(x,idxOf(x.id)+1);}
 }else{
  var aid=el.getAttribute('data-aid'),rid=el.getAttribute('data-rid'),vid=el.getAttribute('data-vid'),k=el.getAttribute('data-k');
  if(aid){
   var a=null;
   for(i=0;i<x.acts.length;i++)if(x.acts[i].id===aid)a=x.acts[i];
   if(a){
    if(k==='txt'){a.txt=el.value;updateLinks(el.parentNode,el.value);}
    else if(k==='time')a.time=el.value;
    else if(k==='vis')a.vis=el.checked;
    else if(k==='st'){a.st=el.value;var row=el.parentNode;row.setAttribute('data-st',a.st);row.className='row act st-'+a.st;applyRowFilter(row);}
   }
  }else if(rid){
   var r=null;
   for(i=0;i<x.res.length;i++)if(x.res[i].id===rid)r=x.res[i];
   if(r){if(k==='txt'){r.txt=el.value;updateLinks(el.parentNode,el.value);}else if(k==='vis')r.vis=el.checked;}
  }else if(vid){
   var v=null;
   for(i=0;i<x.av.length;i++)if(x.av[i].id===vid)v=x.av[i];
   if(v){if(k==='txt'){v.txt=el.value;updateLinks(el.parentNode,el.value);}else if(k==='vis')v.vis=el.checked;}
  }
 }
 updateCounts(x);
 scheduleSave();
}

/* Converteix els enllaços del text en <a>, conservant la resta de text */
function linkify(txt){
 try{
  var s=esc(txt);
  return s.replace(/(https?:\/\/[^\s<]+)/g,function(u){
    var clean=String(u).replace(/[.,;:!?"']+$/,'');
    var trail=u.slice(clean.length);
    return '<a href="'+clean+'" target="_blank" rel="noopener">'+clean+'</a>'+trail;
  });
 }catch(e){
  return esc(txt);
 }
}

/* Obre la sessió en una pestanya nova fent servir un Blob URL.
   Aquest mètode funciona bé en file:// i en http:// */
function openBig(sid){
 var x=plan.sessions[idxOf(sid)];
 if(!x){toast('Sessió no trobada');return;}
 var html=buildSessionPage(x);
 
 // Creem un Blob amb el contingut HTML
 var blob=new Blob([html],{type:'text/html;charset=utf-8'});
 var url=URL.createObjectURL(blob);
 
 // Obrim la pestanya nova
 var w=window.open(url,'_blank');
 
 if(!w){
  // Si el navegador bloqueja la finestra, alliberem l'URL i avisem
  URL.revokeObjectURL(url);
  toast(t('bigBlocked'));
  return;
 }
 
 // Alliberem l'URL quan ja no calgui (donem 1 minut de marge)
 setTimeout(function(){try{URL.revokeObjectURL(url);}catch(e){}},60000);
}

  a.download=name;

/* --- porta-retalls --- */
function copyText(txt,okMsg){
 var done=function(){toast(okMsg||t('copOk'));};
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt,done);});
 }else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
 var ta=document.createElement('textarea');
 ta.value=txt;ta.style.position='fixed';ta.style.left='-9999px';
 document.body.appendChild(ta);ta.select();
 var ok=false;try{ok=document.execCommand('copy');}catch(e){}
 document.body.removeChild(ta);
 if(ok)done();else toast(t('copFail'));
}

     if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(to)){toast(t('emBad'));return;}
     var c=$('emCli').value;
     ST.setItem(KEY+'MAIL',to);ST.setItem(KEY+'CLI',c);
     var su=t('emTitle')+' - '+dtStamp();
     var body=t('emBody1')+'\n\n'+t('emBody2')+' '+new Date().toLocaleString()
      +'\n'+t('emBody3')+' '+plan.sessions.length
      +'\n\n'+t('emBody4').replace('{f}',f1)
      +'\n\n'+t('emBody5');
     var eTo=encodeURIComponent(to),eSu=encodeURIComponent(su),eBd=encodeURIComponent(body);
     closeModal();
     if(c==='gmail'){
      window.open('https://mail.google.com/mail/?view=cm&fs=1&to='+eTo+'&su='+eSu+'&body='+eBd,'_blank');
      copyText(body,t('emSent')+' + '+t('copOk'));
     }else if(c==='out'){
      window.open('https://outlook.office.com/mail/deeplink/compose?to='+eTo+'&subject='+eSu+'&body='+eBd,'_blank');
      copyText(body,t('emSent')+' + '+t('copOk'));
     }else{
      window.location.href='mailto:'+to+'?subject='+eSu+'&body='+eBd;
      setTimeout(function(){toast(t('emSent'));},600);
     }
   }],
   [t('emCopy'),'',function(){copyData();}],
   [t('emClose'),'',function(){closeModal();}]]);
}

/* ================== IMPRESSIO: expandir textareas ================== */
var printFix=[];
window.addEventListener('beforeprint',function(){
 printFix=[];
 var tas=document.querySelectorAll('textarea'),i;
 for(i=0;i<tas.length;i++){
  var ta=tas[i],div=document.createElement('div');
  div.className='print-swap';
  div.textContent=ta.value;
  ta.parentNode.insertBefore(div,ta);
  ta.style.display='none';
  printFix.push([ta,div]);
 }
});
window.addEventListener('afterprint',function(){
 var i;
 for(i=0;i<printFix.length;i++){
  var ta=printFix[i][0],div=printFix[i][1];
  if(div.parentNode)div.parentNode.removeChild(div);
  ta.style.display='';
 }
 printFix=[];
});

 $('bExpStu').onclick=function(){
 var out={app:'fitxa_alumne',generated:new Date().toISOString(),sessions:[]};
 var i,j;
 for(i=0;i<plan.sessions.length;i++){
  var x=plan.sessions[i];
  var o={date:x.date,topic:x.topic,noLectiva:x.noLectiva,obj:'',acts:[],res:[],av:[],comp:'',ev:''};
  if(x.objVis)o.obj=x.obj;
  for(j=0;j<x.acts.length;j++){var a=x.acts[j];if(a.vis&&a.st!=='drop')o.acts.push({txt:a.txt,time:a.time});}
  for(j=0;j<x.res.length;j++)if(x.res[j].vis)o.res.push({txt:x.res[j].txt});
  for(j=0;j<x.av.length;j++)if(x.av[j].vis)o.av.push({txt:x.av[j].txt});
  if(x.compVis)o.comp=x.comp;
  if(x.evVis)o.ev=x.ev;
  out.sessions.push(o);
 }
 download('fitxa_alumne-dades.json',JSON.stringify(out));
 toast(t('studentNote'));
};

 $('bImp').onclick=function(){$('fImp').click();};
 $('fImp').onchange=function(e){
 var f=e.target.files[0];
 if(!f)return;
 var r=new FileReader();
 r.onload=function(ev){
  try{
   var j=JSON.parse(ev.target.result);
   if(j&&j.sessions){
    plan={v:5,sessions:j.sessions};
    if(j.meta&&typeof j.meta==='object')plan.meta=j.meta;
    else plan.meta=defaultMeta();
    for(var i=0;i<plan.sessions.length;i++)norm(plan.sessions[i]);
    render();save();
    toast(t('impOk'));
   }else toast('JSON no valid');
  }catch(x){toast('JSON no valid');}
 };
 r.readAsText(f);
 e.target.value='';
};
