/* ================== EDICIO ================== */
function ancestorWithSid(el){
 var n=el;
 while(n&&n!==document.body){
  if(n.getAttribute&&n.getAttribute('data-sid'))return n;
  n=n.parentNode;
 }
 return null;
}
function findSession(cardEl){
 var sid=cardEl.getAttribute('data-sid');
 for(var i=0;i<plan.sessions.length;i++)if(plan.sessions[i].id===sid)return plan.sessions[i];
 return null;
}
function removeById(arr,id){var out=[],i;for(i=0;i<arr.length;i++)if(arr[i].id!==id)out.push(arr[i]);return out;}
function idxOf(id){var i;for(i=0;i<plan.sessions.length;i++)if(plan.sessions[i].id===id)return i;return -1;}

function moveSession(id,dir){
 var i=idxOf(id);
 if(i<0)return;
 var j=i+dir;
 if(j<0||j>=plan.sessions.length)return;
 var tmp=plan.sessions[i];plan.sessions[i]=plan.sessions[j];plan.sessions[j]=tmp;
 render();scheduleSave();
}

function dupSession(id){
 var i=idxOf(id);
 if(i<0)return;
 var src=plan.sessions[i];
 var c;
 try{c=JSON.parse(JSON.stringify(src));}catch(e){return;}
 c.id=uid();
 c.topic=(src.topic?src.topic+' ':'')+'(copia)';
 var j;
 for(j=0;j<c.acts.length;j++)c.acts[j].id=uid();
 for(j=0;j<c.res.length;j++)c.res[j].id=uid();
 for(j=0;j<c.av.length;j++)c.av[j].id=uid();
 plan.sessions.splice(i+1,0,c);
 EXP[c.id]=true;
 render();scheduleSave();
 var el=$('c-'+c.id);
 if(el&&el.scrollIntoView)el.scrollIntoView();
}

function onEdit(e){
 var el=e.target;
 if(!el.getAttribute)return;
 var cardEl=ancestorWithSid(el);
 if(!cardEl)return;
 var x=findSession(cardEl);
 if(!x)return;
 var i,f=el.getAttribute('data-f');
 if(f!==null&&f!==undefined&&f!==''){
  if(f==='date'||f==='topic'||f==='obj'||f==='comp'||f==='ev')x[f]=el.value;
  if(f==='objVis'||f==='compVis'||f==='evVis')x[f]=el.checked;
  if(f==='date'||f==='topic'){var m=cardEl.querySelector('.cmeta');if(m)m.innerHTML=metaHTML(x);}
 }else{
  var aid=el.getAttribute('data-aid'),rid=el.getAttribute('data-rid'),vid=el.getAttribute('data-vid'),k=el.getAttribute('data-k');
  if(aid){
   var a=null;
   for(i=0;i<x.acts.length;i++)if(x.acts[i].id===aid)a=x.acts[i];
   if(a){
    if(k==='txt')a.txt=el.value;
    else if(k==='time')a.time=el.value;
    else if(k==='vis')a.vis=el.checked;
    else if(k==='st'){a.st=el.value;var row=el.parentNode;row.setAttribute('data-st',a.st);row.className='row act st-'+a.st;applyRowFilter(row);}
   }
  }else if(rid){
   var r=null;
   for(i=0;i<x.res.length;i++)if(x.res[i].id===rid)r=x.res[i];
   if(r){if(k==='txt')r.txt=el.value;else if(k==='vis')r.vis=el.checked;}
  }else if(vid){
   var v=null;
   for(i=0;i<x.av.length;i++)if(x.av[i].id===vid)v=x.av[i];
   if(v){if(k==='txt')v.txt=el.value;else if(k==='vis')v.vis=el.checked;}
  }
 }
 updateCounts(x);
 scheduleSave();
}

function onClick(e){
 var el=e.target,node=el;
 var toggleEl=null,addEl=null,upEl=null,downEl=null,dupEl=null,delAct=null,delRes=null,delAv=null,delSes=null;
 while(node&&node!==document.body){
  if(node.getAttribute){
   if(!delSes&&node.getAttribute('data-del-ses'))delSes=node;
   if(!delAct&&node.getAttribute('data-del-act'))delAct=node;
   if(!delRes&&node.getAttribute('data-del-res'))delRes=node;
   if(!delAv&&node.getAttribute('data-del-av'))delAv=node;
   if(!addEl&&node.getAttribute('data-add'))addEl=node;
   if(!upEl&&node.getAttribute('data-up'))upEl=node;
   if(!downEl&&node.getAttribute('data-down'))downEl=node;
   if(!dupEl&&node.getAttribute('data-dup'))dupEl=node;
   if(!toggleEl&&node.getAttribute('data-toggle'))toggleEl=node;
  }
  node=node.parentNode;
 }
 if(delSes){
  if(delSes.className.indexOf('confirm')<0){
   delSes.className='del ses confirm';
   delSes.innerHTML='&#9888;';
   if(delSes._to)clearTimeout(delSes._to);
   delSes._to=setTimeout(function(){delSes.className='del ses';delSes.innerHTML='&#128465;';},3000);
   return;
  }
  if(delSes._to)clearTimeout(delSes._to);
  var id=delSes.getAttribute('data-del-ses'),out=[];
  for(var i=0;i<plan.sessions.length;i++)if(plan.sessions[i].id!==id)out.push(plan.sessions[i]);
  plan.sessions=out;render();scheduleSave();
  return;
 }
 if(delAct||delRes||delAv){
  var cardEl=ancestorWithSid(el);
  if(!cardEl)return;
  var x=findSession(cardEl);
  if(!x)return;
  if(delAct)x.acts=removeById(x.acts,delAct.getAttribute('data-del-act'));
  if(delRes)x.res=removeById(x.res,delRes.getAttribute('data-del-res'));
  if(delAv)x.av=removeById(x.av,delAv.getAttribute('data-del-av'));
  renderCard(x);scheduleSave();
  return;
 }
 if(addEl){
  var cardEl2=ancestorWithSid(el);
  if(!cardEl2)return;
  var y=findSession(cardEl2);
  if(!y)return;
  var k=addEl.getAttribute('data-add');
  if(k==='acts')y.acts.push({id:uid(),txt:'',time:'',vis:true,st:'plan'});
  if(k==='res')y.res.push({id:uid(),txt:'',vis:true});
  if(k==='av')y.av.push({id:uid(),txt:'',vis:true});
  renderCard(y);scheduleSave();
  return;
 }
 if(upEl){moveSession(upEl.getAttribute('data-up'),-1);return;}
 if(downEl){moveSession(downEl.getAttribute('data-down'),1);return;}
 if(dupEl){dupSession(dupEl.getAttribute('data-dup'));return;}
 if(toggleEl){
  var tid=toggleEl.getAttribute('data-toggle');
  if(EXP[tid])delete EXP[tid];else EXP[tid]=true;
  render();
 }
}

/* ================== IMPRESSIO: expandir textareas ================== */
var printFix=[];
window.addEventListener('beforeprint',function(){
 printFix=[];
 var tas=document.querySelectorAll('textarea'),i;
 for(i=0;i<tas.length;i++){
  var ta=tas[i],div=document.createElement('div');
  div.className='print-swap';
  div.textContent=ta.value;
  ta.parentNode.insertBefore(div,ta);
  ta.style.display='none';
  printFix.push([ta,div]);
 }
});
window.addEventListener('afterprint',function(){
 var i;
 for(i=0;i<printFix.length;i++){
  var ta=printFix[i][0],div=printFix[i][1];
  if(div.parentNode)div.parentNode.removeChild(div);
  ta.style.display='';
 }
 printFix=[];
});

 $('bExpStu').onclick=function(){

  var x=plan.sessions[i];
  var o={date:x.date,topic:x.topic,noLectiva:x.noLectiva,obj:'',acts:[],res:[],av:[],comp:'',ev:''};
  if(x.objVis)o.obj=x.obj;
  for(j=0;j<x.acts.length;j++){var a=x.acts[j];if(a.vis&&a.st!=='drop')o.acts.push({txt:a.txt,time:a.time});}
  for(j=0;j<x.res.length;j++)if(x.res[j].vis)o.res.push({txt:x.res[j].txt});
  for(j=0;j<x.av.length;j++)if(x.av[j].vis)o.av.push({txt:x.av[j].txt});
  if(x.compVis)o.comp=x.comp;
  if(x.evVis)o.ev=x.ev;
  out.sessions.push(o);
 }
 download('fitxa_alumne-dades.json',JSON.stringify(out));
 toast(t('studentNote'));
};

 $('bImp').onclick=function(){$('fImp').click();};

 var f=e.target.files[0];
 if(!f)return;
 var r=new FileReader();
 r.onload=function(ev){
  try{
   var j=JSON.parse(ev.target.result);
   if(j&&j.sessions){
    plan={v:5,sessions:j.sessions};
    if(j.meta&&typeof j.meta==='object')plan.meta=j.meta;
    else plan.meta=defaultMeta();
    for(var i=0;i<plan.sessions.length;i++)norm(plan.sessions[i]);
    render();save();
    toast(t('impOk'));
   }else toast('JSON no valid');
  }catch(x){toast('JSON no valid');}
 };
 r.readAsText(f);
 e.target.value='';
};
